<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>포장·배달 주문 QR</title>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4eadb;font-family:"Noto Sans KR",sans-serif;color:#1f1a15;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
.card{width:100%;max-width:380px;background:#fff;border:3px solid #c3321c;border-radius:20px;overflow:hidden;text-align:center}
.top{background:#c3321c;color:#fff;padding:20px 16px 16px}
.top b{display:block;font:400 36px/1.1 "Do Hyeon",sans-serif}
.top span{font-size:15px}
.card img{width:78%;aspect-ratio:1;display:block;margin:22px auto 8px}
.msg{font:400 26px "Do Hyeon",sans-serif;margin:6px 0 2px}
.sub{font-size:14px;color:#6f6358;margin:0 0 20px}
button{margin-top:16px;font:700 16px "Noto Sans KR",sans-serif;background:#1f1a15;color:#fff;border:0;border-radius:12px;padding:14px 28px;min-height:48px}
.tip{max-width:380px;font-size:14px;color:#6f6358;margin-top:14px;line-height:1.6;text-align:center}
@media print{body{background:#fff}button,.tip{display:none}}
</style>
</head>
<body>
<div class="card">
  <div class="top"><b>포장·배달 주문</b><span>맛있는밥집 쌍촌본점</span></div>
  <img id="qr" alt="포장 배달 주문 QR 코드">
  <p class="msg">카메라로 찍고 바로 주문</p>
  <p class="sub">현장결제 · 카드 / 현금 · 매주 일요일 휴무</p>
</div>
<button onclick="window.print()">인쇄하기</button>
<p class="tip">캡처하거나 인쇄해서 카운터, 전단지, 도시락 스티커에 쓰세요.</p>
<script>
{
const url = new URL("order.html", location.href).href;
document.getElementById("qr").src = "https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=10&data=" + encodeURIComponent(url);
}
</script>
</body>
</html>
