<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영수증 중계기 · 맛있는밥집</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Malgun Gothic", "Noto Sans KR", sans-serif; background: #f2f2f2; color: #222; }
  header { background: #333; color: #fff; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { margin: 0; font-size: 20px; }
  header button { background: none; border: 1px solid #888; color: #fff; border-radius: 8px; padding: 6px 10px; }
  .box { background: #fff; border-radius: 14px; margin: 12px; padding: 16px; }
  .login { max-width: 360px; margin: 60px auto; }
  .login input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; }
  .login button, .big { width: 100%; padding: 14px; background: #d9532b; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; }
  h2 { font-size: 17px; margin: 0 0 10px; }
  .row { display: flex; gap: 8px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
  .row button { padding: 12px; border-radius: 10px; border: 1px solid #ccc; background: #fff; font-size: 15px; font-weight: 700; flex: 1; min-width: 180px; }
  .row button.ok { background: #e8f5e9; border-color: #2e8b57; color: #1e6b3f; }
  .row select { padding: 9px; border-radius: 8px; border: 1px solid #ccc; font-size: 15px; }
  .state { font-size: 22px; font-weight: 800; padding: 14px; border-radius: 12px; text-align: center; }
  .state.on { background: #e8f5e9; color: #1e6b3f; }
  .state.off { background: #fdecea; color: #b3261e; }
  .note { font-size: 13px; color: #777; line-height: 1.6; }
  .log { font-family: Consolas, monospace; font-size: 12px; color: #555; max-height: 140px; overflow: auto; background: #fafafa; border-radius: 8px; padding: 8px; white-space: pre-wrap; }
  .rc { border: 1px solid #eee; border-radius: 10px; padding: 10px; margin: 8px 0; }
  .rc .h { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 6px; }
  .rc pre { margin: 0; font-family: Consolas, "Malgun Gothic", monospace; font-size: 12px; white-space: pre-wrap; max-height: 260px; overflow: auto; background: #fafafa; padding: 8px; border-radius: 8px; }
  .src { font-size: 12px; padding: 2px 8px; border-radius: 6px; color: #fff; background: #888; margin-right: 6px; }
  .src.쿠팡이츠 { background: #00a5e5; } .src.배달의민족 { background: #2ac1bc; } .src.요기요 { background: #fa0050; } .src.도시락합계 { background: #333; }
</style>
</head>
<body>
<header><h1>🧾 영수증 중계기</h1><button id="logout" style="display:none">로그아웃</button></header>

<div class="box login" id="login">
  <input id="email" type="email" placeholder="관리자 이메일">
  <input id="pw" type="password" placeholder="비밀번호">
  <button id="loginBtn">로그인</button>
  <div id="loginMsg" style="margin-top:10px;font-size:14px;color:#c0392b"></div>
</div>

<div id="app" style="display:none">
  <div class="box">
    <div class="state off" id="state">⏹ 중계 꺼짐</div>
    <div class="row">
      <button id="pickIn">① 배달앱 쪽 가상 포트 고르기 (예: COM10)</button>
      <button id="pickOut">② 진짜 프린터 포트 고르기 (예: COM1)</button>
    </div>
    <div class="row">
      <span>프린터 속도</span><select id="baud"></select>
      <button id="startBtn" class="ok">▶ 중계 시작</button>
    </div>
    <div class="note">
      · 배달앱(쿠팡이츠·배민·요기요) 프린터 설정은 <b>가상 포트(COM10)</b>로 바꿔 두세요.<br>
      · 이 창은 <b>항상 켜 두세요</b>. 닫으면 배달앱 영수증이 안 나와요. (켜 두기만 하면 다음에 열 때 자동으로 다시 시작해요)<br>
    </div>
    <div class="log" id="log"></div>
  </div>

  <div class="box">
    <h2>📥 받은 영수증 <span id="rcCount" style="font-weight:400;color:#888"></span></h2>
    <div id="rcList"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, doc, setDoc, updateDoc, onSnapshot, query, orderBy, limit, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyC2zCKXtWxY9vgHf2bS_L1bvuXUUvKQpSA",
  authDomain: "house-order-a689f.firebaseapp.com",
  projectId: "house-order-a689f",
  storageBucket: "house-order-a689f.firebasestorage.app",
  messagingSenderId: "621901289473",
  appId: "1:621901289473:web:952c5951744cd9f5b40800"
});
const db = getFirestore(app);
const auth = getAuth(app);
const $ = id => document.getElementById(id);
const esc = x => String(x ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------- 로그 ----------
const logLines = [];
function log(t) {
  const n = new Date();
  logLines.unshift(`${String(n.getHours()).padStart(2, "0")}:${String(n.getMinutes()).padStart(2, "0")}:${String(n.getSeconds()).padStart(2, "0")} ${t}`);
  logLines.length = Math.min(logLines.length, 60);
  $("log").textContent = logLines.join("\n");
}

// ---------- 로그인 ----------
$("loginBtn").onclick = async () => {
  try { await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pw").value); }
  catch (e) { $("loginMsg").textContent = "로그인 실패 (" + (e.code || e.message) + ")"; }
};
$("logout").onclick = () => signOut(auth);
let started = false;
onAuthStateChanged(auth, user => {
  $("login").style.display = user ? "none" : "block";
  $("app").style.display = user ? "block" : "none";
  $("logout").style.display = user ? "block" : "none";
  if (user && !started) { started = true; boot(); }
});

// ---------- 설정 ----------
const KEY = "relay_cfg";
let cfg = {};
try { cfg = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch {}
const saveCfg = () => { try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch {} };
$("baud").innerHTML = [9600, 19200, 38400, 57600, 115200].map(b => `<option>${b}</option>`).join("");
$("baud").value = String(cfg.baud || 9600);
$("baud").onchange = () => { cfg.baud = Number($("baud").value); saveCfg(); if (running) { stopRelay().then(startRelay); } };

// ---------- 포트 ----------
let inPort = null, outPort = null;   // in: 배달앱 쪽 가상 포트, out: 진짜 프린터
const infoKey = p => JSON.stringify(p.getInfo ? p.getInfo() : {});
async function restorePorts() {
  if (!("serial" in navigator)) return;
  const ps = await navigator.serial.getPorts();
  // 고른 순서(번호)와 장치 정보로 다시 찾기
  if (cfg.inIdx != null && ps[cfg.inIdx] && infoKey(ps[cfg.inIdx]) === cfg.inInfo) inPort = ps[cfg.inIdx];
  if (cfg.outIdx != null && ps[cfg.outIdx] && infoKey(ps[cfg.outIdx]) === cfg.outInfo) outPort = ps[cfg.outIdx];
  updBtns();
}
async function pick(role) {
  if (!("serial" in navigator)) { alert("이 브라우저는 COM 포트를 못 써요. 윈도우 컴퓨터의 크롬이나 엣지로 열어 주세요."); return; }
  try {
    const p = await navigator.serial.requestPort();
    const ps = await navigator.serial.getPorts();
    const idx = ps.indexOf(p);
    if (role === "in") { inPort = p; cfg.inIdx = idx; cfg.inInfo = infoKey(p); }
    else { outPort = p; cfg.outIdx = idx; cfg.outInfo = infoKey(p); }
    if (inPort && inPort === outPort) { alert("두 포트가 같아요. ①은 가상 포트(COM10), ②는 진짜 프린터(COM1)로 따로 골라 주세요."); if (role === "in") inPort = null; else outPort = null; }
    saveCfg(); updBtns();
  } catch (e) { if (e.name !== "NotFoundError") alert("포트 선택 실패: " + e.message); }
}
$("pickIn").onclick = () => pick("in");
$("pickOut").onclick = () => pick("out");
function updBtns() {
  $("pickIn").classList.toggle("ok", !!inPort);
  $("pickOut").classList.toggle("ok", !!outPort);
  $("pickIn").textContent = inPort ? "✅ ① 배달앱 쪽 가상 포트 선택됨" : "① 배달앱 쪽 가상 포트 고르기 (예: COM10)";
  $("pickOut").textContent = outPort ? "✅ ② 프린터 포트 선택됨" : "② 진짜 프린터 포트 고르기 (예: COM1)";
}

// ---------- 중계 ----------
let running = false, inReader = null, outReader = null, outWriter = null, inWriter = null;
let lastIn = 0;               // 배달앱에서 마지막으로 데이터 온 시각
let job = [];                 // 지금 받는 영수증 바이트
let jobTimer = null;
let writeChain = Promise.resolve();   // 프린터로 보내는 순서 지키기
const sleep = ms => new Promise(r => setTimeout(r, ms));

function toPrinter(bytes) {
  writeChain = writeChain.then(async () => {
    if (!outWriter) return;
    const baud = Number(cfg.baud || 9600), CH = 64, wait = Math.ceil(CH * 10 * 1000 / baud * 1.3);
    for (let i = 0; i < bytes.length; i += CH) { await outWriter.write(bytes.slice(i, i + CH)); await sleep(wait); }
  }).catch(e => log("프린터 쓰기 오류: " + e.message));
  return writeChain;
}
async function pump(reader, onData) {
  try {
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      if (value && value.length) onData(value);
    }
  } catch (e) { if (running) log("읽기 오류: " + e.message); }
}
async function startRelay() {
  if (running) return;
  if (!inPort || !outPort) { alert("①, ② 포트를 먼저 골라 주세요."); return; }
  const baud = Number(cfg.baud || 9600);
  try { await inPort.open({ baudRate: baud }); } catch (e) { if (!String(e.message).includes("already open")) { log("가상 포트 열기 실패: " + e.message); alert("가상 포트를 못 열었어요: " + e.message); return; } }
  try { await outPort.open({ baudRate: baud }); } catch (e) {
    if (!String(e.message).includes("already open")) {
      log("프린터 포트 열기 실패: " + e.message);
      alert("프린터 포트를 못 열었어요.\n배달앱이나 다른 창이 아직 COM1을 쓰고 있을 수 있어요. 배달앱 프린터 포트를 가상 포트로 바꾼 뒤 배달앱을 다시 켜 주세요.\n(" + e.message + ")");
      try { await inPort.close(); } catch {}
      return;
    }
  }
  running = true; cfg.auto = true; saveCfg();
  outWriter = outPort.writable.getWriter();
  inWriter = inPort.writable.getWriter();
  inReader = inPort.readable.getReader();
  outReader = outPort.readable.getReader();
  // 배달앱 → 프린터 (영수증 저장도 같이)
  pump(inReader, v => { lastIn = Date.now(); toPrinter(v); captureBytes(v); });
  // 프린터 → 배달앱 (용지 없음 같은 상태 응답)
  pump(outReader, v => { inWriter?.write(v).catch(() => {}); });
  setState(true);
  log("중계 시작");
}
async function stopRelay() {
  running = false;
  for (const r of [inReader, outReader]) { try { await r?.cancel(); r?.releaseLock(); } catch {} }
  for (const w of [inWriter, outWriter]) { try { w?.releaseLock(); } catch {} }
  inReader = outReader = inWriter = outWriter = null;
  for (const p of [inPort, outPort]) { try { await p?.close(); } catch {} }
  setState(false);
  log("중계 멈춤");
}
$("startBtn").onclick = () => running ? (cfg.auto = false, saveCfg(), stopRelay()) : startRelay();
function setState(on) {
  $("state").className = "state " + (on ? "on" : "off");
  $("state").textContent = on ? "🟢 중계 중 · 배달앱 영수증이 프린터로 나가요" : "⏹ 중계 꺼짐 · 배달앱 영수증이 안 나와요!";
  $("startBtn").textContent = on ? "⏸ 중계 멈추기" : "▶ 중계 시작";
  document.title = (on ? "🟢" : "🔴") + " 영수증 중계기";
  heartbeat();
}
if ("serial" in navigator) navigator.serial.addEventListener("disconnect", () => { log("포트가 빠졌어요"); if (running) stopRelay(); });

// ---------- 영수증 저장 ----------
function captureBytes(v) {
  for (const b of v) job.push(b);
  clearTimeout(jobTimer);
  // 1.5초 동안 더 안 오면 영수증 한 장 끝
  jobTimer = setTimeout(finishJob, 1500);
}
// ESC/POS 명령을 빼고 글자만 남기기
function escposToText(bytes) {
  const out = [];
  let i = 0;
  const n = bytes.length;
  while (i < n) {
    const b = bytes[i];
    if (b === 0x1B) {               // ESC
      const c = bytes[i + 1];
      if (c === 0x40) i += 2;                                   // 초기화
      else if (c === 0x64 || c === 0x4A) { out.push(0x0A); i += 3; } // 줄 띄움
      else if (c === 0x2A) { const nL = bytes[i + 3] || 0, nH = bytes[i + 4] || 0, m = bytes[i + 2]; i += 5 + (nL + nH * 256) * (m >= 32 ? 3 : 1); } // 비트 이미지
      else if (c === 0x70) i += 5;                              // 금전함
      else if (c === 0x44) { i += 2; while (i < n && bytes[i] !== 0) i++; i++; }
      else i += 3;                                              // 나머지는 값 1개짜리
    } else if (b === 0x1D) {        // GS
      const c = bytes[i + 1];
      if (c === 0x56) i += (bytes[i + 2] >= 65 ? 4 : 3);        // 자르기
      else if (c === 0x76 && bytes[i + 2] === 0x30) { const xL = bytes[i + 4], xH = bytes[i + 5], yL = bytes[i + 6], yH = bytes[i + 7]; i += 8 + (xL + xH * 256) * (yL + yH * 256); } // 그림
      else if (c === 0x28) { const pL = bytes[i + 3] || 0, pH = bytes[i + 4] || 0; i += 5 + pL + pH * 256; } // QR 등
      else if (c === 0x6B) { const m = bytes[i + 2]; if (m <= 6) { i += 3; while (i < n && bytes[i] !== 0) i++; i++; } else i += 4 + (bytes[i + 3] || 0); } // 바코드
      else i += 3;
    } else if (b === 0x1C) {        // FS (한글 모드 등)
      const c = bytes[i + 1];
      i += (c === 0x26 || c === 0x2E) ? 2 : 3;
    } else if (b === 0x10 || b === 0x0C) { i += (b === 0x10 ? 3 : 1); }
    else { if (b === 0x0A || b === 0x0D || b === 0x09 || b >= 0x20) out.push(b); i++; }
  }
  let t = new TextDecoder("euc-kr").decode(new Uint8Array(out));
  return t.replace(/\r/g, "").replace(/\n{3,}/g, "\n\n").trim();
}
function guessSrc(t) {
  if (/쿠팡\s*이츠|coupang/i.test(t)) return "쿠팡이츠";
  if (/배달의\s*민족|배민|baemin/i.test(t)) return "배달의민족";
  if (/요기요|yogiyo/i.test(t)) return "요기요";
  return "기타";
}
const b64 = u8 => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode(...u8.subarray(i, i + 0x8000)); return btoa(s); };
async function finishJob() {
  if (!job.length) return;
  const bytes = new Uint8Array(job); job = [];
  const text = escposToText(bytes);
  const src = guessSrc(text);
  log(`영수증 받음 (${src}, ${bytes.length}바이트)`);
  if (!text) return;
  try {
    await addDoc(collection(db, "receipts"), {
      src, text, raw: bytes.length <= 200000 ? b64(bytes) : "", size: bytes.length,
      at: Date.now(), createdAt: serverTimestamp(), parsed: false
    });
  } catch (e) { log("영수증 저장 실패: " + e.message); }
}

// ---------- 살아있음 표시 (관리자 화면이 이걸 보고 이 창으로 출력을 보냄) ----------
function heartbeat() {
  setDoc(doc(db, "settings", "relay"), { at: Date.now(), running }, { merge: true }).catch(() => {});
}

// ---------- 받은 영수증 목록 ----------
function watchReceipts() {
  onSnapshot(query(collection(db, "receipts"), orderBy("at", "desc"), limit(20)), snap => {
    $("rcCount").textContent = snap.size ? `(최근 ${snap.size}장)` : "";
    $("rcList").innerHTML = snap.docs.map(d => {
      const r = d.data(), t = new Date(r.at || 0);
      return `<div class="rc"><div class="h"><span><span class="src ${esc(r.src)}">${esc(r.src)}</span>${t.getMonth() + 1}/${t.getDate()} ${String(t.getHours()).padStart(2, "0")}:${String(t.getMinutes()).padStart(2, "0")}</span><span style="color:#999;font-weight:400">${r.size || 0}B</span></div><pre>${esc(r.text)}</pre></div>`;
    }).join("") || `<div class="note">아직 받은 영수증이 없어요. 배달앱에서 '테스트 출력'을 해 보세요.</div>`;
  }, e => { $("rcList").innerHTML = `<div class="note">불러오기 실패: ${esc(e.message)}</div>`; });
}

async function boot() {
  await restorePorts();
  watchReceipts();
  heartbeat(); setInterval(heartbeat, 30000);
  if (cfg.auto && inPort && outPort) startRelay();
  if (!("serial" in navigator)) log("⚠️ 이 브라우저는 COM 포트를 못 써요 (윈도우 크롬/엣지 필요)");
}
window.addEventListener("beforeunload", e => { if (running) { e.preventDefault(); e.returnValue = ""; } });
</script>
</body>
</html>
