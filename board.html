<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>테이블오더</title>
<style>
:root{--bg:#f2f5f4;--card:#fff;--text:#1b2a2f;--muted:#66767b;--line:#dbe3e1;--accent:#1f7a5c;--accent-text:#fff;--new:#d6453d;--cook:#e8a317;--done:#8a9a9e}
@media (prefers-color-scheme:dark){:root{--bg:#10181b;--card:#1a2528;--text:#e8efee;--muted:#93a4a8;--line:#2b393d;--accent:#3ab38a;--accent-text:#06231a;--new:#ff6b60;--cook:#f2b53a;--done:#6f8084}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 "Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;max-width:640px;margin-inline:auto;padding-bottom:96px}
header{position:sticky;top:0;background:var(--bg);z-index:5;padding:12px 16px 0}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line)}
.tab{flex:1;padding:12px 8px;border:0;background:none;color:var(--muted);font:inherit;font-weight:700;border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--text);border-color:var(--accent)}
.badge{display:inline-block;min-width:22px;padding:0 6px;margin-left:6px;border-radius:11px;background:var(--new);color:#fff;font-size:13px;line-height:22px;text-align:center}
.badge.zero{display:none}
.top{display:flex;justify-content:space-between;align-items:center}
.net{font-size:12px;font-weight:700;padding:4px 0 6px;color:var(--muted)}.net.ok{color:var(--accent)}.net.err,.net.off{color:var(--new)}
.lo{border:0;background:none;color:var(--muted);font:inherit;font-size:12px;text-decoration:underline;cursor:pointer}
main{padding:16px}
.hello{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.hello h1{font-size:20px;margin:0}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px}
.emoji{font-size:30px;width:44px;text-align:center}
.info{flex:1}.info b{display:block}.info span{color:var(--muted);font-size:14px}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:20px;cursor:pointer}
.qty button.plus{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.qty output{min-width:18px;text-align:center;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px;background:var(--bg);border-top:1px solid var(--line)}
.bar button{display:block;width:100%;max-width:608px;margin:auto;padding:16px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-text);font:inherit;font-weight:700;font-size:17px;cursor:pointer}
.bar button:disabled{background:var(--line);color:var(--muted);cursor:default}
.toast{background:var(--accent);color:var(--accent-text);padding:12px 14px;border-radius:10px;margin-bottom:12px;font-weight:700}
.empty{color:var(--muted);text-align:center;padding:48px 0}
.ticket{background:var(--card);border:1px solid var(--line);border-left:8px solid var(--new);border-radius:10px;padding:14px;margin-bottom:12px}
.ticket.cook{border-left-color:var(--cook)}.ticket.done{border-left-color:var(--done);opacity:.55}
.thead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.thead b{font-size:calc(clamp(24px,4vmin,44px)*var(--fs,1))}.thead span{color:var(--muted);font-size:calc(clamp(14px,2vmin,22px)*var(--fs,1))}
.ticket ul{list-style:none;margin:0 0 12px;padding:0;font-size:calc(clamp(24px,4vmin,44px)*var(--fs,1));font-weight:700;line-height:1.3}
.ticket li{display:flex;justify-content:space-between;padding:2px 0}
.act{width:100%;padding:14px;border:0;border-radius:10px;font:inherit;font-weight:700;font-size:calc(clamp(18px,2.6vmin,30px)*var(--fs,1));cursor:pointer;background:var(--cook);color:#1b2a2f}
.act.finish{background:var(--accent);color:var(--accent-text)}
.state{font-size:13px;font-weight:700;margin-left:8px}
.cat{font-size:14px;font-weight:800;color:var(--muted);margin:18px 0 8px}
.memo,.inp{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:inherit;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.tile{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font:inherit;cursor:pointer}
.tile b{font-size:32px;line-height:1.1}.tile span{font-size:13px;color:var(--muted);font-weight:700}
.tile.new{border-color:var(--new)}.tile.new span{color:var(--text)}
.tile.cook{border-color:var(--cook)}.tile.cook span{color:var(--cook)}
.tile.eat{border-color:var(--accent)}.tile.eat span{color:var(--accent)}
.tile .sum{font-size:14px}.tile.new .sum,.tile.cook .sum,.tile.eat .sum{color:var(--text)}
.back{border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-weight:700;padding:8px 12px;border-radius:8px;cursor:pointer}
.hist{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.horder{padding:6px 0;border-bottom:1px dashed var(--line)}
.hmeta{font-size:13px;color:var(--muted);margin-bottom:2px}
.hrow{display:flex;align-items:center;gap:8px;padding:2px 0}.hrow span:first-child{flex:1}
.mini{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:18px;cursor:pointer}
.htotal{display:flex;justify-content:space-between;font-size:18px;padding:10px 0}
.clear{width:100%;padding:12px;border:1px solid var(--text);border-radius:10px;background:none;color:var(--text);font:inherit;font-weight:700;cursor:pointer}
.note{background:var(--bg);border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:17px;font-weight:700}
.login{max-width:360px;margin:15vh auto 0;padding:24px}
.login h1{font-size:22px;margin:0 0 16px}
.lerr{color:var(--new);font-weight:700;min-height:24px}
.lgo{width:100%;padding:14px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-text);font:inherit;font-weight:700;cursor:pointer}
@media (min-width:768px){
body{max-width:1100px;font-size:18px}
.hello h1{font-size:24px}
.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tile b{font-size:46px}.tile span{font-size:16px}.tile .sum{font-size:18px}
#menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#menu .cat{grid-column:1/-1}
#menu .item{margin-bottom:0}
#tickets{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(340px*var(--fs,1)),1fr));gap:14px;align-items:start}
#tickets .empty{grid-column:1/-1}
.ticket{margin-bottom:0}
.bar button{max-width:1068px}
}
body.k{padding-bottom:0}
.kbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.kl{display:flex;align-items:center;gap:8px}
.kbar .back{min-height:44px}
#fsv{text-align:center;font-weight:700;padding:0 4px}

#tickets.board{display:grid;gap:8px;align-items:stretch;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(6,minmax(0,1fr));height:calc(100vh - 190px);height:calc(100dvh - 190px)}
@media (min-width:600px){#tickets.board{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,minmax(0,1fr))}}
@media (min-width:1000px){#tickets.board{grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(2,minmax(0,1fr))}}
.cell{background:var(--card);border:3px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.cell.new{border-color:var(--new)}.cell.cook{border-color:var(--cook)}
.cell.eat{opacity:.55}.cell.blank{opacity:.35}
.cell .ch{display:flex;justify-content:space-between;align-items:baseline;gap:4px}
.cell .ch b{font-size:calc(clamp(18px,3vmin,34px)*var(--fs,1))}.cell .ch span{font-size:calc(clamp(11px,1.8vmin,20px)*var(--fs,1));color:var(--muted)}
.cell ul{list-style:none;margin:4px 0;padding:0;flex:1;min-height:0;overflow:auto;font-size:calc(clamp(14px,2.5vmin,30px)*var(--fs,1));font-weight:700;line-height:1.25}
.cell li{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:1px 0;word-break:keep-all}
.cell li .q{flex:none;white-space:nowrap}
.cell li.n{color:var(--text);font-weight:900}
.cell .cn{flex:1;font-weight:700;color:var(--muted);font-size:calc(clamp(13px,1.8vmin,20px)*var(--fs,1))}
.cell .mm{font-size:calc(clamp(13px,2.2vmin,26px)*var(--fs,1));font-weight:700;background:var(--bg);border-radius:6px;padding:4px 6px;margin-bottom:4px}
.cell .act{padding:8px;font-size:calc(clamp(15px,2.3vmin,26px)*var(--fs,1))}
body.k{max-width:none;height:100vh;height:100dvh;overflow:hidden}
body.k #app{height:100%;display:flex;flex-direction:column}
body.k header{position:static;flex:none}
body.k #kitchen{flex:1;min-height:0;display:flex;flex-direction:column;padding:6px 12px 10px}
body.k .kbar{flex:none;margin-bottom:6px}
body.k #tickets{flex:1;min-height:0;overflow:auto}
body.k #tickets.board{height:auto;overflow:hidden}
body.o{max-width:none;height:100vh;height:100dvh;overflow:hidden;padding-bottom:0}
body.o #app{height:100%;display:flex;flex-direction:column}
body.o header{position:static;flex:none}
body.o #cust{flex:1;min-height:0;display:flex;flex-direction:column;padding:6px 10px 10px}
body.o #orderview{flex:1;min-height:0;display:flex;flex-direction:column}
.ohead{flex:none;display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.ohead h1{font-size:22px;margin:0}
.obody{flex:1;min-height:0;display:grid;gap:8px;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
body.o #menu{display:grid;gap:8px;min-height:0;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(6,minmax(0,1fr))}
@media (min-width:600px){body.o #menu{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,minmax(0,1fr))}}
.mt{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:0;overflow:hidden;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:4px;text-align:center;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.mt.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--card))}
.mt .me{font-size:clamp(22px,5vmin,44px);line-height:1}
.mt .mn{font-weight:800;font-size:clamp(14px,2.6vmin,26px);line-height:1.2}
.mt .mp{color:var(--muted);font-size:clamp(12px,2vmin,20px)}
.mt .mq{position:absolute;top:4px;right:4px;min-width:34px;height:34px;padding:0 8px;border-radius:17px;background:var(--accent);color:var(--accent-text);font-weight:800;font-size:20px;line-height:34px}
.mt .mx{position:absolute;top:4px;left:4px;width:46px;height:46px;border-radius:8px;background:var(--text);color:var(--bg);font-size:28px;line-height:44px;font-weight:800}
.side{display:flex;flex-direction:column;gap:8px;min-height:0}
body.o #history{max-height:17vh;max-height:17dvh;overflow:auto}
body.o .hist{padding:8px}
body.o .htotal{padding:6px 0 0;font-size:18px}
body.o .horder{padding:3px 0}
.side .memo{margin:0;height:46px}
.rp{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:10px}
.rp.hide{display:none}
.rpb{background:var(--bg);border-radius:14px;padding:12px;width:100%;max-width:560px;max-height:100%;overflow:auto}
.rpb h2{margin:0 0 6px;font-size:20px}
.rpg{display:grid;gap:8px;margin-bottom:10px;grid-template-columns:repeat(4,1fr)}
.rpg.m{grid-template-columns:repeat(6,1fr)}
.rpg button,.rpf button{min-height:56px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:inherit;font-weight:800;font-size:22px;cursor:pointer;touch-action:manipulation}
.rpg button.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.rpf{display:flex;gap:8px}.rpf button{flex:1}.rpf button.ok{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.rv{font-weight:800;background:var(--bg);border-radius:6px;padding:2px 6px;display:inline-block}
.acts{display:flex;gap:8px}
.acts button{flex:1;min-height:68px;border:0;border-radius:8px;font:inherit;font-weight:800;font-size:20px;cursor:pointer;background:var(--accent);color:var(--accent-text)}
.acts button.clearbig{flex:0 0 36%;background:var(--text);color:var(--bg)}
.acts button:disabled{background:var(--line);color:var(--muted);cursor:default}
@media (min-width:900px) and (orientation:landscape){
.obody{grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:minmax(0,1fr)}
body.o #menu{grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(3,minmax(0,1fr))}
body.o #history{flex:1;max-height:none}
.acts{flex-direction:column}
.acts button{flex:none;min-height:88px;font-size:24px}
.acts button.clearbig{flex:none}
}
.mt.act{background:var(--text);color:var(--bg);border-color:var(--text)}
.mt.act .mn{font-size:clamp(16px,3vmin,30px)}
.mt.act .mp{color:inherit;opacity:.85}
.mt.act.go{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.mt.act.off{background:var(--line);color:var(--muted);border-color:var(--line);cursor:default}
.hide{display:none}
</style>
</head>
<body>

<div id="login" class="login hide">
  <h1>테이블오더 로그인</h1>
  <input id="em" class="inp" type="email" placeholder="이메일" autocomplete="username">
  <input id="pw" class="inp" type="password" placeholder="비밀번호" autocomplete="current-password">
  <div class="lerr" id="lerr"></div>
  <button class="lgo" id="lgo">로그인</button>
</div>

<div id="app" class="hide">
<header>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-cust" aria-selected="true">손님 화면</button>
    <button class="tab" role="tab" id="t-kitchen" aria-selected="false">주방 화면<span class="badge zero" id="badge"></span></button>
  </div>
  <div class="top"><div class="net off" id="net">연결 중…</div><button class="lo" id="lo">로그아웃</button></div>
</header>

<main id="cust">
  <div id="gridview">
    <div class="hello"><h1>테이블을 선택하세요</h1></div>
    <div id="toast"></div>
    <div class="grid" id="grid"></div>
  </div>
  <div id="orderview" class="hide">
    <div class="ohead"><h1 id="otitle"></h1><button class="back" id="back">← 테이블 선택</button></div>
    <div class="obody">
      <div id="menu"></div>
      <aside class="side">
        <div id="history"></div>
        <input id="memo" class="memo" maxlength="60" placeholder="요청사항 (예: 공기밥 빼주세요)">
      </aside>
    </div>
  </div>
</main>

<div id="rp" class="rp hide"><div class="rpb">
  <h2>예약 시간</h2><div id="rph" class="rpg"></div><div id="rpm" class="rpg m"></div>
  <div class="rpf"><button id="rpn" type="button">예약 안 함</button><button id="rpc" type="button">닫기</button><button id="rpo" class="ok" type="button">확인</button></div>
</div></div>

<main id="kitchen" class="hide">
  <div class="kbar">
    <div class="kl"><button class="back" id="fsm" aria-label="글자 작게">A−</button><span id="fsv">글자크기</span><button class="back" id="fsp" aria-label="글자 크게">A+</button></div>
    <div class="kl"><button class="back" id="snd">🔔 알림음 켜짐</button><button class="back" id="kv">카드로 보기</button></div>
  </div>
  <div id="tickets"></div>
</main>
</div>

  var acts='<div class="mt act go'+(n?'':' off')+'" role="button" data-act="order"><div class="mn">주문하기</div><div class="mp">'+(n?n+'개':'메뉴를 골라주세요')+(rtv&&n?' · '+rtv+' 예약':'')+'</div></div>'+
    '<div class="mt act'+(rtv?' on':'')+'" role="button" data-act="resv"><div class="mn">'+(rtv?'🕒 '+rtv:'예약')+'</div><div class="mp">'+(rtv?'예약 변경':'시간 선택')+'</div></div>'+
    '<div class="mt act'+(has?'':' off')+'" role="button" data-act="clear"><div class="mn">테이블 비우기</div><div class="mp">계산 완료</div></div>';
  $("menu").innerHTML=acts+MENU.map(function(m){
    var q=cart[m.id]||0;
    return '<div class="mt'+(q?' on':'')+'" role="button" tabindex="0" data-d="1" data-id="'+m.id+'" aria-label="'+m.name+' 담기"><div class="me">'+m.e+'</div><div class="mn">'+m.name+'</div>'+
    (q?'<div class="mq">'+q+'</div><div class="mx" role="button" data-d="-1" data-id="'+m.id+'" aria-label="'+m.name+' 빼기">−</div>':'')+'</div>';
  }).join("");
}
$("menu").addEventListener("click",function(e){
  var a=e.target.closest("[data-act]");
  if(a){if(a.classList.contains("off"))return;if(a.dataset.act==="order")doOrder();else if(a.dataset.act==="resv")openResv();else doClear();return}
  var t=e.target.closest("[data-d]");if(!t)return;
  cart[t.dataset.id]=Math.max(0,(cart[t.dataset.id]||0)+(+t.dataset.d));
  renderMenu();
});

var soundOn=true,kfs=0,wl=null;
try{soundOn=localStorage.getItem("ksnd")!=="0";kfs=parseFloat(localStorage.getItem("kfs"))||0}catch(err){}
if(!kfs)kfs=window.innerWidth<1400?.8:1;
function unlock(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==="suspended")audio.resume()}catch(err){}}
document.addEventListener("pointerdown",unlock,true);
function tone(f,t0,d,v){
  var o=audio.createOscillator(),g=audio.createGain();
  o.type="sine";o.frequency.value=f;o.connect(g);g.connect(audio.destination);
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  o.start(t0);o.stop(t0+d+.05);
}
function beep(){
  if(!soundOn)return;
  try{unlock();var t=audio.currentTime;tone(988,t,.35,.7);tone(784,t+.4,.5,.7);tone(988,t+1,.35,.7);tone(784,t+1.4,.5,.7)}catch(err){}
  try{if(navigator.vibrate)navigator.vibrate([300,150,300])}catch(err){}
}
function ping(){try{unlock();tone(880,audio.currentTime,.25,.3)}catch(err){}}
function setFs(v){
  kfs=Math.max(.6,Math.min(2,Math.round(v*10)/10));
  document.documentElement.style.setProperty("--fs",kfs);
  try{localStorage.setItem("kfs",kfs)}catch(err){}
}
function setSound(on){
  soundOn=on;$("snd").textContent=on?"🔔 알림음 켜짐":"🔕 알림음 꺼짐";
  try{localStorage.setItem("ksnd",on?"1":"0")}catch(err){}
}
$("fsm").onclick=function(){setFs(kfs-.1)};
$("fsp").onclick=function(){setFs(kfs+.1)};
$("snd").onclick=function(){setSound(!soundOn);if(soundOn)beep()};
setFs(kfs);setSound(soundOn);
function wake(){
  try{if(wl||!navigator.wakeLock||document.hidden||$("kitchen").classList.contains("hide"))return;
    navigator.wakeLock.request("screen").then(function(l){wl=l;l.addEventListener("release",function(){wl=null})}).catch(function(){})}catch(err){}
}
document.addEventListener("visibilitychange",function(){if(!document.hidden)wake()});

function renderGrid(){
  var nm={"":"빈 테이블","new":"접수","cook":"조리중","eat":"식사중"},h="";
  for(var i=1;i<=16;i++){
    var mine=tableOrders(i);
    var st=!mine.length?"":mine.some(function(o){return o.status==="new"})?"new":mine.some(function(o){return o.status==="cook"})?"cook":"eat";
    h+='<button class="tile '+st+'" data-t="'+i+'"><b>'+i+'</b><span>'+nm[st]+'</span>'+'</button>';
  }
  $("grid").innerHTML=h;
}
function openGrid(){
  cart={};armed=false;$("memo").value="";renderMenu();
  $("orderview").classList.add("hide");$("gridview").classList.remove("hide");syncBody();
}
$("grid").addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  cur=t.dataset.t;cart={};rtv="";armed=false;$("memo").value="";renderMenu();renderHistory();
  $("otitle").textContent=cur+"번 테이블";$("toast").innerHTML="";
  $("gridview").classList.add("hide");$("orderview").classList.remove("hide");syncBody();
  window.scrollTo(0,0);
});
$("back").addEventListener("click",openGrid);
function doClear(){
  if(!cur)return;
  orders.forEach(function(o){if(o.table==cur&&!o.closed){o.closed=true;save(o)}});
  openGrid();renderKitchen();
}
function syncBody(){document.body.classList.toggle("o",!$("cust").classList.contains("hide")&&!$("orderview").classList.contains("hide"))}

function renderHistory(){
  var os=tableOrders(cur);
  renderMenu();
  if(!os.length){$("history").innerHTML="";return}
  var h='<div class="hist">';
  os.forEach(function(o){
    var tm=new Date(o.time).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});
    h+='<div class="horder"><div class="hmeta">'+tm+' · '+LABEL[o.status]+(o.resv?' · 🕒 '+o.resv+' 예약':'')+(o.memo?' · 📝 '+esc(o.memo):'')+'</div>';
    o.items.forEach(function(it,idx){
      h+='<div class="hrow"><span>'+it.name+' × '+it.qty+'</span><span></span><button class="mini" data-o="'+o.id+'" data-i="'+idx+'" aria-label="'+it.name+' 하나 빼기">−</button></div>';
    });
    h+='</div>';
  });
  h+='</div>';
  $("history").innerHTML=h;
}
$("history").addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  var o=orders.filter(function(x){return x.id==t.dataset.o})[0];if(!o)return;
  var k=+t.dataset.i;o.items[k].qty--;
  if(o.items[k].qty<=0)o.items.splice(k,1);
  if(!o.items.length){orders.splice(orders.indexOf(o),1);drop(o)}else save(o);
  armed=false;renderHistory();renderKitchen();
});

var rtv="",ph="",pm="00";
function drawResv(){
  var h="",i;for(i=10;i<=22;i++){var v=(i<10?"0":"")+i;h+='<button type="button" data-h="'+v+'" class="'+(ph===v?"on":"")+'">'+i+'시</button>'}
  $("rph").innerHTML=h;
  var m="";["00","10","20","30","40","50"].forEach(function(v){m+='<button type="button" data-m="'+v+'" class="'+(pm===v?"on":"")+'">'+v+'분</button>'});
  $("rpm").innerHTML=m;
}
function openResv(){ph=rtv?rtv.slice(0,2):"";pm=rtv?rtv.slice(3):"00";drawResv();$("rp").classList.remove("hide")}
$("rp").addEventListener("click",function(e){
  var t=e.target.closest("button");
  if(!t){if(e.target===$("rp"))$("rp").classList.add("hide");return}
  if(t.dataset.h){ph=t.dataset.h;drawResv();return}
  if(t.dataset.m){pm=t.dataset.m;drawResv();return}
  if(t.id==="rpn"){rtv="";$("rp").classList.add("hide");renderMenu();return}
  if(t.id==="rpc"){$("rp").classList.add("hide");return}
  if(t.id==="rpo"){if(!ph)return;rtv=ph+":"+pm;$("rp").classList.add("hide");renderMenu()}
});
function doOrder(){
  var items=MENU.filter(function(m){return cart[m.id]}).map(function(m){return{name:m.name,qty:cart[m.id],price:m.price}});
  if(!items.length)return;
  var no={id:newId(),table:cur,items:items,time:Date.now(),status:"new",memo:$("memo").value.trim(),resv:rtv,closed:false};
  orders.push(no);save(no);
  var tn=cur;
  rtv="";renderKitchen();ping();openGrid();
  $("toast").innerHTML='<div class="toast">'+tn+'번 테이블 '+(no.resv?no.resv+' 예약 ':'')+'주문이 주방에 전달됐어요.</div>';
  setTimeout(function(){$("toast").innerHTML=""},4000);
}

var kview="board";
function renderBoard(){
  var h="";
  for(var t=1;t<=16;t++){
    var os=tableOrders(t),pend=os.filter(function(o){return o.status!=="done"});
    var st=!os.length?"blank":pend.some(function(o){return o.status==="new"})?"new":pend.length?"cook":"eat";
    var lines={},keys=[],memos=[],qn=0,old=Infinity,rv='';
    pend.forEach(function(o){
      if(o.time<old)old=o.time;
      o.items.forEach(function(i){
        var k=(o.status==="new"?"n":"c")+i.name;
        if(!lines[k]){lines[k]={n:i.name,q:0,s:o.status};keys.push(k)}
        lines[k].q+=i.qty;qn+=i.qty;
      });
      if(o.memo)memos.push(o.memo);
      if(o.resv&&(!rv||o.resv<rv))rv=o.resv;
    });
    keys.sort(function(a,b){return a[0]===b[0]?0:a[0]==="n"?-1:1});
    var mins=pend.length?Math.floor((Date.now()-old)/60000):0;
    var body=st==="blank"?'<div class="cn">빈 테이블</div>':st==="eat"?'<div class="cn">서빙 완료</div>':
      '<ul>'+keys.map(function(k){var l=lines[k];return '<li class="'+(l.s==="new"?"n":"")+'"><span>'+l.n+'</span><span class="q">× '+l.q+'</span></li>'}).join("")+'</ul>'+(rv?'<div class="mm rv">🕒 '+rv+' 예약</div>':'')+(memos.length?'<div class="mm">📝 '+esc(memos.join(" / "))+'</div>':'');
    var btn=pend.length?'<button class="act finish" data-t="'+t+'" data-a="done">완료</button>':'';
    h+='<div class="cell '+st+'"><div class="ch"><b>'+t+'번</b><span>'+(pend.length?(mins<1?"방금":mins+"분")+" · "+qn+"개":"")+'</span></div>'+body+btn+'</div>';
  }
  $("tickets").innerHTML=h;
}
function renderKitchen(){
  renderGrid();
  var live=orders.filter(function(o){return !o.closed});
  var newN=live.filter(function(o){return o.status==="new"}).length;
  var bd=$("badge");bd.textContent=newN||"";bd.classList.toggle("zero",!newN);
  $("tickets").className=kview==="board"?"board":"";
  if(kview==="board"){renderBoard();return}
  if(!live.length){$("tickets").innerHTML='<div class="empty">아직 들어온 주문이 없어요.</div>';return}
  var list=live.slice().sort(function(a,b){
    var da=a.status==="done",db=b.status==="done";
    return da===db?a.time-b.time:da?1:-1;
  });
  $("tickets").innerHTML=list.map(function(o){
    var mins=Math.floor((Date.now()-o.time)/60000);
    var btn=o.status!=="done"?'<button class="act finish" data-id="'+o.id+'">완료</button>':'';
    return '<div class="ticket '+o.status+'"><div class="thead"><b>'+o.table+'번 테이블<span class="state">'+LABEL[o.status]+'</span></b><span>'+(mins<1?"방금":mins+"분 전")+'</span></div><ul>'+
      o.items.map(function(i){return '<li><span>'+i.name+'</span><b>× '+i.qty+'</b></li>'}).join("")+'</ul>'+
      (o.resv?'<div class="note rv">🕒 '+o.resv+' 예약</div>':'')+(o.memo?'<div class="note">📝 '+esc(o.memo)+'</div>':'')+btn+'</div>';
  }).join("");
}
$("tickets").addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  if(t.dataset.t){
    tableOrders(t.dataset.t).forEach(function(o){if(o.status!=="done"){o.status="done";save(o)}});
    renderKitchen();return;
  }
  var o=orders.filter(function(x){return x.id==t.dataset.id})[0];
  if(o){o.status="done";save(o);renderKitchen()}
});

function show(which){
  var k=which==="kitchen";
  $("cust").classList.toggle("hide",k);$("kitchen").classList.toggle("hide",!k);document.body.classList.toggle("k",k);syncBody();if(k)wake();
  $("t-cust").setAttribute("aria-selected",!k);$("t-kitchen").setAttribute("aria-selected",k);
  if(k)renderKitchen();
}
function route(){show(location.hash==="#kitchen"?"kitchen":"cust")}
$("t-cust").onclick=function(){location.hash="order";show("cust")};
$("t-kitchen").onclick=function(){location.hash="kitchen";show("kitchen")};
window.addEventListener("hashchange",route);
setInterval(function(){if(!$("kitchen").classList.contains("hide"))renderKitchen()},30000);

function showLogin(msg){
  $("app").classList.add("hide");$("login").classList.remove("hide");$("lerr").textContent=msg||"";
}
function doLogin(){
  $("lerr").textContent="";
  auth.signInWithEmailAndPassword($("em").value.trim(),$("pw").value).catch(function(){
    $("lerr").textContent="이메일 또는 비밀번호가 맞지 않아요.";
  });
}
$("lgo").onclick=doLogin;
$("pw").addEventListener("keydown",function(e){if(e.key==="Enter")doLogin()});
$("kv").onclick=function(){kview=kview==="board"?"list":"board";$("kv").textContent=kview==="board"?"카드로 보기":"테이블로 보기";renderKitchen()};
$("lo").onclick=function(){if(auth)auth.signOut()};

function start(){
  $("login").classList.add("hide");$("app").classList.remove("hide");
  first=true;route();renderMenu();renderKitchen();net("off");
  unsub=fs.collection("orders").onSnapshot(function(snap){
    var freshN=0;
    if(!first){snap.docChanges().forEach(function(c){if(c.type==="added"&&!snap.metadata.hasPendingWrites&&!c.doc.data().closed)freshN++})}
    first=false;
    orders=snap.docs.map(function(x){var v=x.data();v.id=x.id;return v}).sort(function(a,b){return a.time-b.time});
    if(!pruned&&!snap.metadata.fromCache){pruned=true;orders.forEach(function(o){if(o.closed&&Date.now()-o.time>172800000)drop(o)})}
    net(snap.metadata.fromCache?"off":"ok");
    renderKitchen();
    if(cur&&!$("orderview").classList.contains("hide"))renderHistory();
    if(freshN&&!$("kitchen").classList.contains("hide"))beep();
  },function(){net("err")});
}

if(!FIREBASE_CONFIG.apiKey){
  showLogin("Firebase 설정이 아직 입력되지 않았어요.");
}else{
  firebase.initializeApp(FIREBASE_CONFIG);
  auth=firebase.auth();fs=firebase.firestore();
  auth.onAuthStateChanged(function(u){
    if(u){start()}
    else{if(unsub){unsub();unsub=null}orders=[];showLogin()}
  });
}
</script>
