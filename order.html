<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffaf1;--card:#fff;--ink:#1f1a15;--soft:#6f6358;--line:#eadfce;--red:#c3321c;--brown:#8a5a2b;--chip:#f4eadb;--ok:#2f7d4f;--pick:#fdf0ec}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans KR",system-ui,sans-serif;padding-bottom:100px}
button,a,label{touch-action:manipulation}
button{cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
/* 상단: 가게 소개 + 영업상태 + 주문 안내 + 할인 진행 막대 */
header{background:var(--red);color:#fff;padding:20px 0 46px;text-align:center}
.logo{display:block;width:96px;height:96px;margin:0 auto 10px;border-radius:22px;background:#fff;box-shadow:0 6px 18px rgba(60,10,0,.28);object-fit:cover}
.brand h1{font:400 30px/1.1 "Do Hyeon",sans-serif;margin:0}
.brand h1 span{font-size:22px;margin-left:6px;opacity:.95}
.tag{margin:6px 0 12px;font-size:14px;opacity:.92}
.status{display:inline-flex;align-items:center;gap:7px;background:rgba(0,0,0,.18);border-radius:999px;padding:5px 12px 5px 10px;font-size:14px;font-weight:500}
.status i{width:9px;height:9px;border-radius:50%;background:#7CE29C;box-shadow:0 0 0 3px rgba(124,226,156,.3)}
.status.off i{background:#ffd34d;box-shadow:0 0 0 3px rgba(255,211,77,.3)}
.status b{font-weight:700}
.intro{margin-top:-34px;position:relative;z-index:1}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 14px rgba(80,40,10,.08);overflow:hidden}
.facts div{padding:10px 6px;text-align:center;border-left:1px solid var(--line)}
.facts div:first-child{border-left:0}
.facts small{display:block;font-size:12px;color:var(--soft)}
.facts b{font-size:14px;white-space:nowrap}
.facts a{color:var(--ink);text-decoration:none}
.deal{margin-top:10px;background:var(--pick);border:1px solid #f3d3c9;border-radius:16px;padding:12px 14px 10px}
.deal .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.deal .hd b{color:var(--red);font-size:15px}
.deal .msg{font-size:13px;color:var(--ink);margin-top:2px;min-height:19px}
.track{position:relative;height:8px;background:#f1ddd5;border-radius:99px;margin:14px 4px 0}
.track .fill{position:absolute;left:0;top:0;bottom:0;background:var(--red);border-radius:99px;transition:width .35s ease}
.track .mk{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;border:2.5px solid #e2b9ab;transition:border-color .3s,background .3s}
.track .mk.on{border-color:var(--red);background:var(--red)}
.ticks{position:relative;height:34px;margin:4px 4px 0;font-size:12px;color:var(--soft)}
.ticks span{position:absolute;transform:translateX(-50%);text-align:center;white-space:nowrap;line-height:1.25}
.ticks span:last-child{transform:translateX(-100%);text-align:right}
.ticks span:first-child:not(:last-child){}
.ticks b{display:block;color:var(--red);font-size:13px}
.closed{margin-top:10px;background:#fff3c4;color:#6b4e00;padding:10px 16px;font-size:14px;font-weight:500;display:none}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0 6px}
input,textarea{font:16px "Noto Sans KR",sans-serif;color:var(--ink)}
.search{width:100%;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}
.search:focus{outline:2px solid var(--red);outline-offset:1px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips a{flex:none;text-decoration:none;color:var(--ink);background:var(--chip);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;white-space:nowrap;transition:background .2s,color .2s}
.chips a.on{background:var(--red);color:#fff}
section{padding-top:18px;scroll-margin-top:118px}
h2{font:400 23px/1.1 "Do Hyeon",sans-serif;margin:0 0 8px;color:var(--brown)}
ul{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
/* 메뉴 한 줄: 이름 | 가격 | 버튼 */
li{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 14px;border-top:1px dashed var(--line);transition:background .25s;min-height:62px}
li:first-child{border-top:0}
li.in{background:var(--pick)}
.nm{flex:1 1 auto;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{flex:none;font-weight:700;white-space:nowrap;font-size:14px;font-variant-numeric:tabular-nums}
.ctl{flex:none;display:flex;justify-content:flex-end}
.add{border:0;background:var(--red);color:#fff;border-radius:12px;width:44px;height:42px;font-size:24px;font-weight:700;transition:transform .12s}
.add:active,.step button:active{transform:scale(.9)}
.step{display:flex;align-items:center;gap:2px}
.step button{border:1.5px solid var(--line);background:var(--card);border-radius:11px;width:38px;height:40px;font-size:21px;font-weight:700;color:var(--ink);transition:transform .12s;padding:0}
.step button.plus{background:var(--red);border-color:var(--red);color:#fff}
.step b{min-width:22px;text-align:center;font-size:16px}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);transform:translateY(110%);transition:transform .25s ease}
.cartbar.show{transform:none}
.cartbar button{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:688px;margin:0 auto;border:0;background:var(--ink);color:#fff;border-radius:14px;padding:14px 18px;font:700 17px "Noto Sans KR",sans-serif}
.cartbar button>span:first-child{white-space:nowrap}
.cartbar .n{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;border-radius:999px;background:var(--red);margin-right:8px;font-size:15px}
.cartbar .amt{text-align:right;line-height:1.2}
.cartbar .amt small{display:block;font-size:12px;color:#ffb4a5;font-weight:500}
.bump{animation:bump .3s ease}
@keyframes bump{40%{transform:scale(1.04)}}
.toast{position:fixed;left:50%;bottom:96px;z-index:15;transform:translate(-50%,12px);opacity:0;background:rgba(31,26,21,.92);color:#fff;border-radius:999px;padding:9px 16px;font-size:14px;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.panel{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;transform:translateY(100%);visibility:hidden;transition:transform .28s ease,visibility 0s .28s;overscroll-behavior:contain}
.panel.on{transform:none;visibility:visible;transition:transform .28s ease}
.ptop{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 0;z-index:2}
.ptop .wrap{display:flex;align-items:center;gap:10px}
.back{border:0;background:var(--chip);border-radius:10px;height:42px;padding:0 14px;font:500 15px "Noto Sans KR",sans-serif;color:var(--ink)}
.ptop h3{font:400 24px "Do Hyeon",sans-serif;margin:0}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
.box h4{margin:0 0 10px;font-size:16px}
.seg{display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:8px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0}
.seg span{display:block;text-align:center;padding:12px 4px;border:1.5px solid var(--line);border-radius:12px;font-weight:700;font-size:15px;transition:background .15s,color .15s}
.seg input:checked+span{border-color:var(--red);background:var(--red);color:#fff}
.seg input:focus-visible+span{outline:2px solid var(--ink)}
.field{display:block;margin-top:10px}
.field span{display:block;font-size:14px;color:var(--soft);margin-bottom:4px}
.field input,.field textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.field textarea{min-height:70px;resize:vertical}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0}
.row .note{display:block;font-size:12px;color:var(--soft)}
.money{border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.money .row{padding:3px 0}
.disc{color:var(--red);font-weight:700}
.final{font-size:20px;font-weight:700}
.bank{background:#f3f7ff;border:1.5px solid #c9d8f5;border-radius:12px;padding:12px;margin-top:12px}
.bank b{font-size:18px;letter-spacing:.3px}
.bank button{margin-top:8px;border:0;background:#2556a8;color:#fff;border-radius:10px;padding:10px 14px;font:700 15px "Noto Sans KR",sans-serif;min-height:42px}
.hint{font-size:13px;color:var(--soft);margin:8px 0 0}
.saved{display:flex;align-items:center;gap:10px;background:#faf6ef;border:1.5px solid var(--line);border-radius:12px;padding:12px 12px 12px 14px;margin-top:12px}
.saved .sv{flex:1;display:flex;flex-direction:column;font-size:16px;line-height:1.4}
.saved .sv span{color:var(--soft);font-size:14px}
.saved button,.svdone{border:0;background:var(--chip);color:var(--ink);border-radius:10px;height:40px;padding:0 16px;font:700 15px "Noto Sans KR",sans-serif}
.svdone{background:var(--ink);color:#fff;margin-left:6px}
.svact{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;font-size:14px;color:var(--soft)}
.keep input{width:18px;height:18px;vertical-align:-4px;accent-color:var(--red);margin:0 4px 0 0}
.link{border:0;background:none;color:var(--soft);text-decoration:underline;font:14px "Noto Sans KR",sans-serif;padding:8px}
.err{color:var(--red);font-size:14px;min-height:20px;margin:10px 0 0}
.big{display:block;width:100%;border:0;background:var(--red);color:#fff;border-radius:14px;padding:17px;font:700 18px "Noto Sans KR",sans-serif;margin:16px 0 30px}
.big:disabled{opacity:.45}
.hide{display:none!important}
.done{text-align:center;padding:40px 16px}
.done .code{font:400 54px "Do Hyeon",sans-serif;color:var(--red);margin:10px 0}
.badge{display:inline-block;padding:6px 14px;border-radius:999px;background:var(--chip);font-weight:700}
.badge.ok{background:var(--ok);color:#fff}
#trackBar{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.trk{display:flex;flex-direction:column;background:var(--card);border:1.5px solid var(--line);border-left:5px solid #c9b8a3;border-radius:12px;padding:9px 12px;font-size:14px}
.trk b{font-size:13px;color:var(--soft)}
.trk span{font-weight:700}
.trk.accepted{border-left-color:#e0a21a}
.trk.out,.trk.ready{border-left-color:var(--ok);background:#eef8f1}
.trk.canceled{border-left-color:var(--red);background:#fdecea}
.alertbox{position:fixed;inset:0;z-index:40;background:rgba(31,26,21,.55);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
.alertbox.on{opacity:1;visibility:visible;transition:opacity .2s}
.acard{background:#fff;border-radius:22px;padding:26px 20px 20px;text-align:center;width:100%;max-width:360px;transform:scale(.92);transition:transform .25s}
.alertbox.on .acard{transform:none}
.aicon{font-size:56px;line-height:1;animation:hop 1s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-6px)}}
.acard h3{font:400 28px "Do Hyeon",sans-serif;margin:10px 0 6px;color:var(--red)}
.acard p{margin:0 0 12px;color:var(--soft);font-size:15px}
.empty{text-align:center;color:var(--soft);padding:30px 0;display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
</style>
</head>

const DAYS = ["일", "월", "화", "수", "목", "금", "토"];

// ===== 영업시간 =====
let S = DEFAULTS;
const kstNow = () => { const d = new Date(Date.now() + 9 * 3600e3); return { day: d.getUTCDay(), hm: d.toISOString().slice(11, 16) }; };
function dayHours(day) { const h = (S.hours || {})[day]; return h || { closed: false, open: "00:00", close: "24:00" }; }
function hoursText(h) { return h.closed ? "휴무" : (h.open === "00:00" && h.close === "24:00") ? "종일" : `${h.open}~${h.close}`; }
function isOpen() {
  if (S.paused) return false;
  const { day, hm } = kstNow(), h = dayHours(day);
  if (h.closed) return false;
  return h.close > h.open ? (hm >= h.open && hm < h.close) : (hm >= h.open || hm < h.close);
}
function nextOpenText() {
  const { day, hm } = kstNow();
  for (let k = 0; k < 7; k++) {
    const d = (day + k) % 7, h = dayHours(d);
    if (h.closed) continue;
    if (k === 0 && hm < h.open) return `오늘 ${h.open}부터 주문할 수 있어요.`;
    if (k > 0) return `${k === 1 ? "내일" : DAYS[d] + "요일"} ${h.open}부터 주문할 수 있어요.`;
  }
  return "";
}
let open = true;
function applyHours() {
  open = isOpen();
  const h = dayHours(kstNow().day);
  const ht = h.closed ? "오늘 휴무" : (h.open === "00:00" && h.close === "24:00") ? "" : `오늘 ${h.open}~${h.close}`;
  $("status").classList.toggle("off", !open);
  $("statusText").innerHTML = open ? `<b>지금 주문할 수 있어요</b>${ht ? " · " + ht : ""}` : `<b>${S.paused ? "잠시 주문을 멈췄어요" : "지금은 주문 마감"}</b>${ht && !S.paused ? " · " + ht : ""}`;
  const c = $("closed");
  if (open) c.style.display = "none";
  else { c.style.display = "block"; c.textContent = S.paused ? "가게 사정으로 지금은 주문을 잠시 받지 않아요. 잠시 후 다시 확인해 주세요." : "지금은 주문 시간이 아니에요. " + nextOpenText(); }
  updateBar(); if ($("checkout").classList.contains("on")) renderCart();
}
onSnapshot(doc(db, "settings", "shop"), s => { S = s.exists() ? { ...DEFAULTS, ...s.data() } : DEFAULTS; applyHours(); }, () => applyHours());

// 결제 금액 구간별 할인: 상품 금액이 min 이상이면 amount 할인 (가장 큰 구간 하나만)
const tiersOf = s => (Array.isArray(s.tiers) ? s.tiers : (s.discount ? [{ min: s.discountMin || 0, amount: s.discount }] : []))
  .filter(t => t.amount > 0).sort((a, b) => a.min - b.min);
const tierDiscount = (s, sub) => { let d = 0; for (const t of tiersOf(s)) if (sub > 0 && sub >= t.min) d = Math.max(d, t.amount); return Math.min(d, sub); };
const nextTier = (s, sub) => tiersOf(s).find(t => t.min > sub && t.amount > tierDiscount(s, sub));

// 할인 진행 막대: 담은 금액만큼 차오르고 구간에 닿으면 점이 채워져요
function drawDeal(sub, dc, nx, ts) {
  $("factMin").textContent = minOrder() ? won(minOrder()) : "없음";

  if (!ts.length) return;

  const n = ts.length, at = i => (i + 1) / n * 100;

}

const PAYNAME = { card: "카드", transfer: "계좌이체", cash: "현금" };

// ===== 내 주문 상태 따라가기 =====
// 주문하면 이 폰에 주문번호를 기억해 두고, 가게에서 상태를 바꾸면 바로 알려줘요.
const OKEY = "mbj-orders";
const TRACK = { new: "가게에서 주문을 확인하고 있어요", accepted: "주문이 접수됐어요. 맛있게 만들고 있어요", ready: "포장이 준비됐어요. 가게로 와주세요", out: "배달 출발했어요! 곧 도착해요", done: "주문이 완료됐어요. 맛있게 드세요", canceled: "주문이 취소됐어요. 가게로 문의해 주세요" };
const loadMine = () => { try { return JSON.parse(localStorage.getItem(OKEY) || "[]").filter(o => Date.now() - o.t < 12 * 3600e3); } catch { return []; } };
const saveMine = list => { try { localStorage.setItem(OKEY, JSON.stringify(list)); } catch {} };
const mine = loadMine();
const live = {}; // id -> 현재 상태
const watchers = new Map();
let doneId = null, ac2 = null;
function unlockSound() { try { ac2 = ac2 || new (window.AudioContext || window.webkitAudioContext)(); ac2.resume(); } catch {} }
document.addEventListener("click", unlockSound, { once: true });
function chime() {
  if (!ac2) return;
  [[0, 784], [0.25, 988], [0.5, 1319]].forEach(([t, f]) => { const o = ac2.createOscillator(), g = ac2.createGain(); o.frequency.value = f; o.connect(g); g.connect(ac2.destination); g.gain.setValueAtTime(0.45, ac2.currentTime + t); g.gain.exponentialRampToValueAtTime(0.001, ac2.currentTime + t + 0.5); o.start(ac2.currentTime + t); o.stop(ac2.currentTime + t + 0.5); });
}
function say(text) { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = "ko-KR"; const v = speechSynthesis.getVoices().find(v => /^ko/i.test(v.lang)); if (v) u.voice = v; speechSynthesis.speak(u); } catch {} }
const ALERT = {
  out: { icon: "🛵", title: "배달 출발했어요!", text: "맛있게 만든 음식이 출발했어요. 곧 도착해요.", voice: "배달 출발했어요" },
  ready: { icon: "🛍️", title: "포장이 준비됐어요!", text: "가게로 오셔서 찾아가세요.", voice: "포장 준비됐어요" },
  canceled: { icon: "⚠️", title: "주문이 취소됐어요", text: `궁금한 점은 가게로 전화해 주세요 (${SHOP.phone}).`, voice: "주문이 취소됐어요" }
};
function bigAlert(rec, st) {

  $("alertIcon").textContent = a.icon; $("alertTitle").textContent = a.title;
  $("alertText").textContent = `주문번호 ${rec.code} · ${a.text}`;
  $("alertBox").classList.add("on");
  chime(); setTimeout(() => say(a.voice), 900);
  try { navigator.vibrate && navigator.vibrate([400, 150, 400, 150, 400]); } catch {}
  let i = 0; const f = setInterval(() => { document.title = i++ % 2 ? `${a.icon} ${a.title}` : "맛있는밥집 주문하기"; if (i > 16) { clearInterval(f); document.title = "맛있는밥집 주문하기"; } }, 800);
}
$("alertOk").onclick = () => $("alertBox").classList.remove("on");
function renderTrack() {
  const act = mine.filter(r => live[r.id] && live[r.id] !== "done" || !live[r.id]);
  $("trackBar").innerHTML = mine.map(r => {
    const st = live[r.id] || "new";
    return `<div class="trk ${st}"><b>주문 ${esc(r.code)}</b><span>${TRACK[st]}</span></div>`;
  }).join("");
  $("trackBar").classList.toggle("hide", !mine.length);
}
function backToMenu() { $("donePanel").classList.remove("on"); document.body.style.overflow = ""; doneId = null; window.scrollTo({ top: 0, behavior: "smooth" }); }
function track(rec) {
  if (watchers.has(rec.id)) return;
  watchers.set(rec.id, onSnapshot(doc(db, "onlineOrders", rec.id), s => {
    const st = s.exists() ? (s.data().status || "new") : "canceled";
    const prev = live[rec.id]; live[rec.id] = st;
    if (doneId === rec.id) {
      $("doneStatus").textContent = TRACK[st];
      $("doneStatus").classList.toggle("ok", ["accepted", "ready", "out", "done"].includes(st));
      if (st === "accepted") setTimeout(() => { if (doneId === rec.id) { backToMenu(); toast(rec.type === "delivery" ? "주문 접수! 배달 출발하면 알려드릴게요" : "주문 접수! 포장 준비되면 알려드릴게요"); } }, 2500);
    }
    // 배달 출발·포장 준비·취소는 한 번만 크게 알려줘요 (화면을 닫았다 다시 열어도)
    if (ALERT[st] && rec.a !== st) { rec.a = st; saveMine(mine); if (doneId === rec.id) backToMenu(); bigAlert(rec, st); }
    // 완료된 주문은 잠깐 보여준 뒤 목록에서 빼요

      setTimeout(() => { const k = mine.indexOf(rec); if (k >= 0) mine.splice(k, 1); saveMine(mine); watchers.get(rec.id)?.(); watchers.delete(rec.id); renderTrack(); }, prev ? 60000 : 0);
    }
    renderTrack();
  }, () => {}));
}
function showDone(id, order) {

  $("doneStatus").textContent = TRACK.new; $("doneStatus").classList.remove("ok");
  $("doneInfo").textContent = `${order.type === "delivery" ? "배달" : "포장"} · 결제 금액 ${won(order.total)}${order.discount ? ` (${won(order.discount)} 할인)` : ""} · ${PAYNAME[order.payment.method]}${order.payment.receipt ? " · 현금영수증 신청" : ""}`;
  const db_ = $("doneBank");
  if (order.payment.method === "transfer") {
    db_.classList.remove("hide");
    db_.innerHTML = `<div>아래 계좌로 <b>${won(order.total)}</b>을 보내주세요.</div><div style="margin-top:6px">${SHOP.bank}</div><button type="button" id="copyBank2">계좌번호 복사</button>`;
    $("copyBank2").onclick = async () => { try { await navigator.clipboard.writeText(SHOP.bankNo); $("copyBank2").textContent = "복사됐어요"; } catch { $("copyBank2").textContent = "길게 눌러 복사하세요"; } };
  } else db_.classList.add("hide");
  const rec = { id, code: order.code, type: order.type, t: Date.now() };
  mine.unshift(rec); saveMine(mine);
  doneId = id; openPanel("donePanel");
  track(rec); renderTrack();
}
$("again").onclick = backToMenu;
mine.forEach(track); renderTrack();
renderList(); applyHours();
</script>
</body>
</html>
