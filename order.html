<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>맛있는밥집 주문하기</title>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffaf1;--card:#fff;--ink:#1f1a15;--soft:#6f6358;--line:#eadfce;--red:#c3321c;--brown:#8a5a2b;--chip:#f4eadb;--ok:#2f7d4f;--pick:#fdf0ec}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans KR",system-ui,sans-serif;padding-bottom:100px}
button,a,label{touch-action:manipulation}
button{cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header{background:var(--red);color:#fff;padding:20px 0 16px}
header h1{font:400 30px/1.1 "Do Hyeon",sans-serif;margin:0}
.mode{display:inline-block;margin-top:8px;background:#fff;color:var(--red);font-weight:700;border-radius:999px;padding:4px 12px;font-size:15px}
.closed{background:#fff3c4;color:#6b4e00;padding:10px 16px;font-size:14px;display:none}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0 6px}
input,textarea{font:16px "Noto Sans KR",sans-serif;color:var(--ink)}
.search{width:100%;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}
.search:focus{outline:2px solid var(--red);outline-offset:1px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none;scroll-behavior:smooth}
.chips::-webkit-scrollbar{display:none}
.chips a{flex:none;text-decoration:none;color:var(--ink);background:var(--chip);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;white-space:nowrap;transition:background .2s,color .2s}
.chips a.on{background:var(--red);color:#fff}
section{padding-top:18px;scroll-margin-top:118px}
h2{font:400 23px/1.1 "Do Hyeon",sans-serif;margin:0 0 8px;color:var(--brown)}
ul{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
li{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px dashed var(--line);transition:background .25s}
li:first-child{border-top:0}
li.in{background:var(--pick)}
.nm{flex:1;font-weight:500}
.nt{display:block;font-size:13px;color:var(--soft);font-weight:400}
.pr{font-weight:700;white-space:nowrap;font-size:15px}
.ctl{flex:none;width:128px;display:flex;justify-content:flex-end}
.add{border:0;background:var(--red);color:#fff;border-radius:12px;width:48px;height:44px;font-size:24px;font-weight:700;transition:transform .12s}
.add:active,.step button:active{transform:scale(.9)}
.step{display:flex;align-items:center;gap:4px}
.step button{border:1.5px solid var(--line);background:var(--card);border-radius:12px;width:44px;height:44px;font-size:22px;font-weight:700;color:var(--ink);transition:transform .12s}
.step button.plus{background:var(--red);border-color:var(--red);color:#fff}
.step b{min-width:26px;text-align:center;font-size:17px}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);transform:translateY(110%);transition:transform .25s ease}
.cartbar.show{transform:none}
.cartbar button{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:688px;margin:0 auto;border:0;background:var(--ink);color:#fff;border-radius:14px;padding:16px 18px;font:700 17px "Noto Sans KR",sans-serif}
.cartbar .n{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;border-radius:999px;background:var(--red);margin-right:8px;font-size:15px}
.bump{animation:bump .3s ease}
@keyframes bump{40%{transform:scale(1.04)}}
.toast{position:fixed;left:50%;bottom:96px;z-index:15;transform:translate(-50%,12px);opacity:0;background:rgba(31,26,21,.92);color:#fff;border-radius:999px;padding:9px 16px;font-size:14px;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.panel{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;transform:translateY(100%);visibility:hidden;transition:transform .28s ease,visibility 0s .28s;overscroll-behavior:contain}
.panel.on{transform:none;visibility:visible;transition:transform .28s ease}
.ptop{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 0;z-index:2}
.ptop .wrap{display:flex;align-items:center;gap:10px}
.back{border:0;background:var(--chip);border-radius:10px;height:42px;padding:0 14px;font:500 15px "Noto Sans KR",sans-serif;color:var(--ink)}
.ptop h3{font:400 24px "Do Hyeon",sans-serif;margin:0}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
.box h4{margin:0 0 10px;font-size:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0}
.seg span{display:block;text-align:center;padding:12px 8px;border:1.5px solid var(--line);border-radius:12px;font-weight:700;transition:background .15s,color .15s}
.seg input:checked+span{border-color:var(--red);background:var(--red);color:#fff}
.seg input:focus-visible+span{outline:2px solid var(--ink)}
.field{display:block;margin-top:10px}
.field span{display:block;font-size:14px;color:var(--soft);margin-bottom:4px}
.field input,.field textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.field textarea{min-height:70px;resize:vertical}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0}
.total{font-size:19px;font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.err{color:var(--red);font-size:14px;min-height:20px;margin:10px 0 0}
.big{display:block;width:100%;border:0;background:var(--red);color:#fff;border-radius:14px;padding:17px;font:700 18px "Noto Sans KR",sans-serif;margin:16px 0 30px}
.big:disabled{opacity:.5}
.hide{display:none!important}
.done{text-align:center;padding:40px 16px}
.done .code{font:400 54px "Do Hyeon",sans-serif;color:var(--red);margin:10px 0}
.badge{display:inline-block;padding:6px 14px;border-radius:999px;background:var(--chip);font-weight:700}
.badge.ok{background:var(--ok);color:#fff}
.empty{text-align:center;color:var(--soft);padding:30px 0;display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<header><div class="wrap"><h1 id="shopName">맛있는밥집 쌍촌본점</h1><span class="mode" id="modeLabel">포장·배달 주문</span></div></header>
<div class="closed" id="closed">오늘은 휴무일이에요. 주문은 다음 영업일에 확인돼요.</div>
<div class="bar"><div class="wrap">
  <input id="q" class="search" type="search" placeholder="메뉴 이름으로 찾기" aria-label="메뉴 검색">
  <nav class="chips" id="chips"></nav>
</div></div>
<main class="wrap"><div id="list"></div><p class="empty" id="empty">찾는 메뉴가 없어요.</p></main>

<div class="toast" id="toast"></div>
<div class="cartbar" id="cartbar"><button id="openCart"><span><span class="n" id="cartN">0</span>주문서 보기</span><span id="cartSum"></span></button></div>

<!-- 주문서 -->
<div class="panel" id="checkout">
  <div class="ptop"><div class="wrap"><button class="back" data-close>← 메뉴 더 담기</button><h3>주문서</h3></div></div>
  <div class="wrap">
    <div class="box"><h4>담은 메뉴</h4><div id="cartList"></div><div class="row total"><span>합계</span><span id="cartTotal"></span></div></div>

    <div class="box" id="howBox"><h4>받는 방법</h4>
      <div class="seg">
        <label><input type="radio" name="how" value="pickup" checked><span>포장</span></label>
        <label><input type="radio" name="how" value="delivery"><span>배달</span></label>
      </div>
      <label class="field"><span>이름</span><input id="cName" autocomplete="name" placeholder="홍길동"></label>
      <label class="field"><span>전화번호 (필수)</span><input id="cPhone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="01012345678"></label>
      <label class="field" id="addrField"><span>배달 주소 (필수)</span><input id="cAddr" autocomplete="street-address" placeholder="광주 서구 쌍촌동 ○○아파트 101동 1001호"></label>
    </div>

    <div class="box" id="payBox"><h4>결제 방법 (현장결제)</h4>
      <div class="seg">
        <label><input type="radio" name="pay" value="card" checked><span>카드</span></label>
        <label><input type="radio" name="pay" value="cash"><span>현금</span></label>
      </div>
      <div id="receiptBox" class="hide">
        <h4 style="margin-top:14px">현금영수증</h4>
        <div class="seg">
          <label><input type="radio" name="rc" value="no" checked><span>필요 없음</span></label>
          <label><input type="radio" name="rc" value="yes"><span>신청</span></label>
        </div>
        <div id="rcDetail" class="hide">
          <div class="seg" style="margin-top:10px">
            <label><input type="radio" name="rcType" value="personal" checked><span>개인(소득공제)</span></label>
            <label><input type="radio" name="rcType" value="business"><span>사업자(지출증빙)</span></label>
          </div>
          <label class="field"><span id="rcLabel">휴대폰 번호</span><input id="rcNo" inputmode="numeric" placeholder="숫자만 입력"></label>
        </div>
      </div>
    </div>

    <div class="box"><h4>요청사항</h4>
      <label class="field" style="margin-top:0"><textarea id="memo" placeholder="예: 덜 맵게, 수저 빼주세요, 문 앞에 놓아주세요"></textarea></label>
    </div>
    <p class="err" id="err"></p>
    <button class="big" id="submit">주문하기</button>
  </div>
</div>

<!-- 주문 완료 -->
<div class="panel" id="donePanel">
  <div class="wrap done">
    <p>주문이 들어갔어요</p>
    <div class="code" id="doneCode"></div>
    <p>주문번호</p>
    <p><span class="badge" id="doneStatus">가게에서 확인 중이에요</span></p>
    <p id="doneInfo" style="color:var(--soft);font-size:15px"></p>
    <button class="big" id="again">처음으로</button>
  </div>
</div>

const db = getFirestore(initializeApp(firebaseConfig));
const $ = id => document.getElementById(id);
const won = n => n.toLocaleString("ko-KR") + "원";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const tableNo = parseInt(new URLSearchParams(location.search).get("table"), 10) || null;
$("shopName").textContent = SHOP.name;
$("modeLabel").textContent = tableNo ? `${tableNo}번 테이블 주문` : "포장·배달 주문";
if (tableNo) { $("howBox").classList.add("hide"); $("payBox").classList.add("hide"); }
if (new Date(Date.now() + 9 * 3600e3).getUTCDay() === SHOP.closedDay) $("closed").style.display = "block";

const items = [];
MENU.forEach((c, ci) => c.i.forEach(([name, price, note]) => items.push({ id: items.length, cat: ci, name, price, note })));
const cart = new Map();
$("chips").innerHTML = MENU.map((c, ci) => `<a href="#c${ci}" data-c="${ci}">${c.c}</a>`).join("");

// 수량 버튼 (누른 줄만 바꿔서 화면이 흔들리지 않게)
const ctlHTML = id => {
  const q = cart.get(id) || 0;
  return q ? `<div class="step"><button data-minus="${id}" aria-label="빼기">−</button><b>${q}</b><button class="plus" data-plus="${id}" aria-label="더하기">+</button></div>`
           : `<button class="add" data-plus="${id}" aria-label="${esc(items[id].name)} 담기">+</button>`;
};
const rowHTML = it => `<li id="r${it.id}" class="${cart.has(it.id) ? "in" : ""}"><span class="nm">${esc(it.name)}${it.note ? `<span class="nt">${esc(it.note)}</span>` : ""}</span><span class="pr">${won(it.price)}</span><span class="ctl">${ctlHTML(it.id)}</span></li>`;

function renderList() {
  const w = $("q").value.replace(/\s/g, "");
  let shown = 0;
  $("list").innerHTML = MENU.map((c, ci) => {
    const its = items.filter(it => it.cat === ci && (!w || it.name.replace(/\s/g, "").includes(w)));
    shown += its.length;
    return its.length ? `<section id="c${ci}" data-c="${ci}"><h2>${c.c}</h2><ul>${its.map(rowHTML).join("")}</ul></section>` : "";
  }).join("");
  $("empty").style.display = shown ? "none" : "block";
  watchSections();
}
function updateRow(id) {
  const li = document.getElementById("r" + id);
  if (!li) return;
  li.classList.toggle("in", cart.has(id));
  li.querySelector(".ctl").innerHTML = ctlHTML(id);
}
const cartLines = () => [...cart].map(([id, qty]) => ({ ...items[id], qty }));
const cartSum = () => cartLines().reduce((s, l) => s + l.price * l.qty, 0);
function updateBar(bump) {
  const n = [...cart.values()].reduce((a, b) => a + b, 0);
  $("cartbar").classList.toggle("show", n > 0);
  $("cartN").textContent = n;
  $("cartSum").textContent = n ? won(cartSum()) : "";
  if (bump) { const b = $("openCart"); b.classList.remove("bump"); void b.offsetWidth; b.classList.add("bump"); }
}
let toastT;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 1200);
}
function change(id, d) {
  const q = (cart.get(id) || 0) + d;
  if (q <= 0) cart.delete(id); else cart.set(id, Math.min(q, 30));
  updateRow(id); updateBar(d > 0);
  if (d > 0 && q === 1) toast(`${items[id].name} 담았어요`);
  if ($("checkout").classList.contains("on")) { if (!cart.size) closePanel(); else renderCart(); }
  try { navigator.vibrate && navigator.vibrate(8); } catch {}
}
document.addEventListener("click", e => {
  const p = e.target.closest("[data-plus]"), m = e.target.closest("[data-minus]"), x = e.target.closest("[data-remove]");
  if (x) { cart.delete(+x.dataset.remove); updateRow(+x.dataset.remove); updateBar(); if (!cart.size) closePanel(); else renderCart(); return; }
  if (!p && !m) return;
  change(+(p || m).dataset[p ? "plus" : "minus"], p ? 1 : -1);
});
let qT;
$("q").addEventListener("input", () => { clearTimeout(qT); qT = setTimeout(() => { renderList(); window.scrollTo({ top: 0 }); }, 150); });

// 카테고리 버튼: 보고 있는 곳 표시
let io;
function watchSections() {
  if (io) io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    const c = e.target.dataset.c;
    $("chips").querySelectorAll("a").forEach(a => a.classList.toggle("on", a.dataset.c === c));
    const on = $("chips").querySelector(".on");
    if (on) $("chips").scrollTo({ left: on.offsetLeft - 16, behavior: "smooth" });
  }), { rootMargin: "-125px 0px -65% 0px" });
  document.querySelectorAll("#list section").forEach(s => io.observe(s));
}

// 주문서
function renderCart() {
  $("cartList").innerHTML = cartLines().map(l => `<div class="row"><span>${esc(l.name)}<br><small style="color:var(--soft)">${won(l.price * l.qty)}</small></span><div class="step"><button data-minus="${l.id}" aria-label="빼기">−</button><b>${l.qty}</b><button class="plus" data-plus="${l.id}" aria-label="더하기">+</button></div></div>`).join("");
  $("cartTotal").textContent = won(cartSum());
}
function openPanel(id) { $(id).classList.add("on"); $(id).scrollTop = 0; document.body.style.overflow = "hidden"; }
function closePanel() { $("checkout").classList.remove("on"); document.body.style.overflow = ""; }
$("openCart").onclick = () => { renderCart(); $("err").textContent = ""; openPanel("checkout"); };
document.querySelectorAll("[data-close]").forEach(b => b.onclick = closePanel);

const val = name => document.querySelector(`input[name=${name}]:checked`).value;
function syncForm() {
  $("addrField").classList.toggle("hide", val("how") !== "delivery");
  $("receiptBox").classList.toggle("hide", val("pay") !== "cash");
  $("rcDetail").classList.toggle("hide", val("rc") !== "yes");
  const biz = val("rcType") === "business";
  $("rcLabel").textContent = biz ? "사업자등록번호 (10자리)" : "휴대폰 번호";
  $("rcNo").placeholder = biz ? "1234567890" : "01012345678";
}
document.querySelectorAll("#checkout input[type=radio]").forEach(r => r.addEventListener("change", syncForm));
syncForm();
try { const s = JSON.parse(localStorage.getItem("mbj-customer") || "{}"); $("cName").value = s.name || ""; $("cPhone").value = s.phone || ""; $("cAddr").value = s.address || ""; } catch {}

const digits = s => s.replace(/\D/g, "");
$("submit").onclick = async () => {
  $("err").textContent = "";
  const order = {
    type: tableNo ? "table" : val("how"),
    table: tableNo,
    items: cartLines().map(l => ({ name: l.name, price: l.price, qty: l.qty })),
    total: cartSum(),
    memo: $("memo").value.trim().slice(0, 300),
    status: "new",
    code: new Date(Date.now() + 9 * 3600e3).toISOString().slice(11, 16).replace(":", "") + "-" + String(Math.floor(Math.random() * 90) + 10),
    createdAt: serverTimestamp()
  };
  if (!order.items.length) return;
  if (!tableNo) {
    const phone = digits($("cPhone").value);
    if (phone.length < 10 || phone.length > 11) { $("err").textContent = "전화번호를 정확히 입력해 주세요."; $("cPhone").focus(); return; }
    const address = $("cAddr").value.trim();
    if (order.type === "delivery" && address.length < 5) { $("err").textContent = "배달 주소를 입력해 주세요."; $("cAddr").focus(); return; }
    order.customer = { name: $("cName").value.trim().slice(0, 30), phone, address: order.type === "delivery" ? address.slice(0, 150) : "" };
    const pay = { method: val("pay"), receipt: false };
    if (pay.method === "cash" && val("rc") === "yes") {
      const no = digits($("rcNo").value), biz = val("rcType") === "business";
      if (biz ? no.length !== 10 : (no.length < 10 || no.length > 11)) { $("err").textContent = biz ? "사업자등록번호 10자리를 입력해 주세요." : "현금영수증 받을 휴대폰 번호를 입력해 주세요."; $("rcNo").focus(); return; }
      Object.assign(pay, { receipt: true, receiptType: biz ? "business" : "personal", receiptNo: no });
    }
    order.payment = pay;
    try { localStorage.setItem("mbj-customer", JSON.stringify(order.customer)); } catch {}
  }
  $("submit").disabled = true; $("submit").textContent = "주문 넣는 중…";
  try {
    const ref = await addDoc(collection(db, "onlineOrders"), order);
    showDone(ref.id, order);
  } catch (e) {
    console.error(e);
    $("err").textContent = "주문이 전송되지 않았어요. 잠시 후 다시 시도하거나 가게로 전화해 주세요 (" + SHOP.phone + ").";
  } finally { $("submit").disabled = false; $("submit").textContent = "주문하기"; }
};

const STATUS = { new: "가게에서 확인 중이에요", accepted: "주문이 접수됐어요. 조리 중이에요", ready: "음식이 준비됐어요", out: "배달 출발했어요", done: "완료된 주문이에요", canceled: "주문이 취소됐어요. 가게로 문의해 주세요" };
let unsub = null;
function showDone(id, order) {
  const ids = [...cart.keys()];
  closePanel(); cart.clear(); ids.forEach(updateRow); updateBar(); $("memo").value = "";
  $("doneCode").textContent = order.code;
  $("doneInfo").textContent = order.type === "table" ? `${order.table}번 테이블 · ${won(order.total)} · 계산은 카운터에서 해주세요`
    : `${order.type === "delivery" ? "배달" : "포장"} · ${won(order.total)} · ${order.payment.method === "card" ? "카드" : "현금"} 현장결제${order.payment.receipt ? " · 현금영수증 신청" : ""}`;
  openPanel("donePanel");
  if (unsub) unsub();
  unsub = onSnapshot(doc(db, "onlineOrders", id), s => {
    const st = s.exists() ? (s.data().status || "new") : "canceled";
    $("doneStatus").textContent = STATUS[st] || STATUS.new;
    $("doneStatus").classList.toggle("ok", ["accepted", "ready", "out", "done"].includes(st));
  }, () => {});
}
$("again").onclick = () => { if (unsub) unsub(); $("donePanel").classList.remove("on"); document.body.style.overflow = ""; window.scrollTo({ top: 0 }); };
renderList(); updateBar();
</script>
