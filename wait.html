<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>대기시간·영상</title>
<style>
:root{--bg:#f2f4f3;--card:#fff;--line:#d9e0de;--text:#1c2b2a;--muted:#5d6d6b;--accent:#1f7a5a;--accent-text:#fff;--warn:#c0392b;--busy:#fde8d0;--busyline:#d68910}
@media (prefers-color-scheme:dark){:root{--bg:#121917;--card:#1b2522;--line:#32413d;--text:#eef3f1;--muted:#9fb0ab;--accent:#3fb68b;--accent-text:#06110d;--busy:#3a2c17;--busyline:#e0a040}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans KR","Malgun Gothic",sans-serif;min-height:100vh;display:flex;flex-direction:column}
.hide{display:none!important}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);padding:0 8px;position:sticky;top:0;background:var(--bg);z-index:2}
.tab{flex:1;padding:14px 8px;border:0;background:none;color:var(--muted);font:inherit;font-size:18px;font-weight:800;border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--text);border-color:var(--accent)}
.st{font-size:13px;color:var(--muted);padding:6px 14px;display:flex;justify-content:space-between}
.st b.ok{color:var(--accent)}.st b.err{color:var(--warn)}
.pane{flex:1;padding:8px 14px 100px}
/* 대기시간 */
.hero{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.hl{font-size:15px;color:var(--muted);font-weight:700}
.hv{font-size:clamp(44px,9vw,84px);font-weight:900;line-height:1.05;color:var(--accent)}
.hv.go{color:var(--accent)}
.hs{font-size:15px;color:var(--muted);font-weight:700;margin-top:2px}
.wq{display:flex;align-items:center;gap:10px}
.wq b{font-size:clamp(34px,7vw,60px);min-width:2ch;text-align:center}
.wq button{width:72px;height:72px;border-radius:18px;border:3px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:40px;font-weight:900;cursor:pointer;touch-action:manipulation}
.wq .p{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px}
.tb{min-height:96px;border-radius:16px;border:3px solid var(--line);background:var(--card);color:var(--text);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:manipulation}
.tb .n{font-size:30px;font-weight:900;line-height:1}
.tb .s{font-size:16px;font-weight:800;color:var(--muted)}
.tb.b{background:var(--busy);border-color:var(--busyline)}
.tb.b .s{color:var(--text)}
.tb.o .s{color:var(--warn)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:3px solid var(--line);padding:12px 14px;display:flex;gap:10px;align-items:center;z-index:5}
.bar span{flex:1;font-size:20px;font-weight:800}
.bar button{height:64px;padding:0 22px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:20px;font-weight:800;cursor:pointer}
.bar .ok{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.hint{font-size:13px;color:var(--muted);margin:10px 2px 0;line-height:1.5}
/* 영상 */
.cam{background:#000;border-radius:16px;overflow:hidden;position:relative;aspect-ratio:16/9;max-height:62vh;margin:0 auto;width:100%}
.cam video{width:100%;height:100%;object-fit:contain;background:#000}
.cam video.mir{transform:scaleX(-1)}
.rc{position:absolute;left:12px;top:10px;background:#c0392b;color:#fff;font-weight:900;font-size:18px;padding:4px 12px;border-radius:999px}
.cb{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.cb button,.cb a{flex:1;min-width:130px;height:68px;border-radius:16px;border:3px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:20px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;touch-action:manipulation}
.cb .sel{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.cb .rec{background:#c0392b;color:#fff;border-color:#c0392b}
.opt{margin-top:10px;font-size:16px;font-weight:700;display:flex;gap:8px;align-items:center}
.opt input{width:22px;height:22px}
.cmsg{margin-top:10px;font-weight:700;color:var(--warn);min-height:22px}
.login{max-width:360px;margin:12vh auto;padding:0 20px}
.login h1{font-size:24px}.inp{width:100%;height:52px;margin:6px 0;border:2px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-size:18px;background:var(--card);color:var(--text)}
.lgo{width:100%;height:56px;margin-top:8px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-text);font:inherit;font-size:20px;font-weight:800}
.lerr{color:var(--warn);min-height:22px;font-weight:700}
</style></head><body>
<div id="login" class="login hide">
  <h1>대기시간·영상 로그인</h1>
  <input id="em" class="inp" type="email" placeholder="이메일" autocomplete="username">
  <input id="pw" class="inp" type="password" placeholder="비밀번호" autocomplete="current-password">
  <div class="lerr" id="lerr"></div>
  <button class="lgo" id="lgo">로그인</button>
</div>
<div id="app" class="hide" style="display:contents">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="t1" aria-selected="true">대기시간</button>
    <button class="tab" role="tab" id="t2" aria-selected="false">영상</button>
  </div>
  <div class="st"><span><b id="net" class="err">연결 중…</b></span><span>버전 1</span></div>

  <div class="pane" id="p1">
    <div class="hero">
      <div>
        <div class="hl">지금 오시는 팀 예상 대기</div>
        <div class="hv" id="est">–</div>
        <div class="hs" id="sub"></div>
      </div>
      <div>
        <div class="hl">대기·예약 팀</div>
        <div class="wq"><button type="button" id="wm" aria-label="대기 팀 빼기">−</button><b id="wn">0</b><button type="button" class="p" id="wp" aria-label="대기 팀 더하기">＋</button></div>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="hint" id="hint"></div>
  </div>

  <div class="pane hide" id="p2">
    <div class="cam"><video id="vid" autoplay muted playsinline></video><span class="rc hide" id="rc">● 녹화 0:00</span></div>
    <div class="cb">
      <button type="button" id="cf">앞 카메라</button>
      <button type="button" id="cb2">뒤 카메라</button>
      <button type="button" id="rb">● 녹화 시작</button>
    </div>
    <label class="opt"><input type="checkbox" id="aud"> 소리(마이크)도 녹음</label>
    <div class="cmsg" id="cmsg"></div>
    <div class="hide" id="done">
      <video id="pv" controls playsinline style="width:100%;border-radius:12px;margin-top:8px;background:#000;max-height:50vh"></video>
      <div class="cb"><a id="dl" download="영상.webm">⬇ 영상 저장하기</a><button type="button" id="dx">지우기</button></div>
    </div>
    <div class="hint">영상은 서버에 올라가지 않고 이 기기 안에서만 만들어져요. 녹화 후 "영상 저장하기"를 눌러야 기기에 저장돼요.</div>
  </div>
</div>
<div class="bar hide" id="bar"><span id="bt"></span><button type="button" id="bn">취소</button><button type="button" class="ok" id="by">자리 비우기</button></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
var FIREBASE_CONFIG={apiKey:"AIzaSyC2zCKXtWxY9vgHf2bS_L1bvuXUUvKQpSA",authDomain:"house-order-a689f.firebaseapp.com",projectId:"house-order-a689f",storageBucket:"house-order-a689f.firebasestorage.app",messagingSenderId:"621901289473",appId:"1:621901289473:web:952c5951744cd9f5b40800"};
var $=function(i){return document.getElementById(i)},auth,fs,unsub=null;
var NT=16,DEF=35,KEEP=60,tb={},wq=[],hist=[],pend=0;
function ref(){return fs.collection("orders").doc("wait_state")}
function mark(o){o.time=Date.now();o.ts=o.time;o.closed=true;o.status="done";o.items=[];o.table="";return o}
function net(t,c){$("net").textContent=t;$("net").className=c}
function save(upd){mark(upd);ref().set(upd,{merge:true}).catch(function(){net("저장 실패 — 인터넷을 확인하세요","err")})}
/* ----- 계산 ----- */
function avg(){
  var h=hist.slice(-30).map(Math.floor).filter(function(m){return m>=5&&m<=120});
  if(h.length<3)return{v:DEF,n:h.length};
  return{v:Math.round(h.reduce(function(a,b){return a+b},0)/h.length),n:h.length};
}
function avail(av){
  var now=Date.now(),a=[];
  for(var n=1;n<=NT;n++){var t=tb[n];if(!t)a.push(0);else a.push(Math.max(2,av-(now-t)/60000))}
  return a;
}
function waitFor(a,av,i){var q=a.slice(),last=0;for(var j=0;j<i;j++){q.sort(function(x,y){return x-y});last=q[0];q[0]=last+av}return last}
function draw(){
  var A=avg(),a=avail(A.v),free=a.filter(function(x){return x===0}).length,w=wq.length;
  var e=waitFor(a,A.v,w+1);
  $("est").textContent=e<=0?"바로 입장":"약 "+Math.max(1,Math.round(e))+"분";
  $("est").className="hv"+(e<=0?" go":"");
  $("sub").textContent="빈 테이블 "+free+"개 · 식사 중 "+(NT-free)+"개";
  $("wn").textContent=w;
  var now=Date.now(),h="";
  for(var n=1;n<=NT;n++){
    var t=tb[n],m=t?Math.floor((now-t)/60000):0,over=t&&m>=A.v;
    h+='<button type="button" class="tb'+(t?" b":"")+(over?" o":"")+'" data-n="'+n+'"><span class="n">'+n+'번</span><span class="s">'+(t?"식사 "+m+"분"+(over?" ⏰":""):"빈자리")+'</span></button>';
  }
  $("grid").innerHTML=h;
  $("hint").textContent="평균 식사시간 "+A.v+"분 "+(A.n<3?"(기록이 3건 이상 쌓이면 실제 평균으로 바뀌어요. 지금은 기본값)":"(최근 "+A.n+"건 기록 기준)")+" · 손님이 앉으면 번호를 누르고, 나가면 다시 눌러 비워 주세요.";
}
/* ----- 테이블/대기 조작 ----- */
function seat(n){tb[n]=Date.now();var u={};u["t"+n]=tb[n];save(u);draw()}
function leave(n){
  var t=tb[n],u={},F=firebase.firestore.FieldValue;
  if(t){
    var m=(Date.now()-t)/60000;
    if(m>=5&&m<=120){var v=Math.floor(m)+Math.random()/1000;hist.push(v);u.h=F.arrayUnion(v);
      if(hist.length>KEEP){var o=hist.shift();u.h=F.arrayUnion(v);/* 오래된 기록은 아래에서 따로 제거 */setTimeout(function(){ref().set({h:F.arrayRemove(o)},{merge:true})},300)}}
  }
  tb[n]=0;u["t"+n]=0;save(u);draw();
}
function askLeave(n){pend=n;$("bt").textContent=n+"번 테이블 비울까요?";$("bar").classList.remove("hide")}
function closeBar(){pend=0;$("bar").classList.add("hide")}
$("grid").addEventListener("click",function(e){
  var b=e.target.closest("[data-n]");if(!b)return;var n=+b.dataset.n;
  if(tb[n])askLeave(n);else{closeBar();seat(n)}
});
$("bn").onclick=closeBar;
$("by").onclick=function(){if(pend)leave(pend);closeBar()};
$("wp").onclick=function(){var t=Date.now()+Math.random(),F=firebase.firestore.FieldValue;wq.push(t);save({wq:F.arrayUnion(t)});draw()};
$("wm").onclick=function(){if(!wq.length)return;var o=wq.shift(),F=firebase.firestore.FieldValue;save({wq:F.arrayRemove(o)});draw()};
/* ----- 탭 ----- */
function tab(n){
  [1,2].forEach(function(i){$("t"+i).setAttribute("aria-selected",i===n?"true":"false");$("p"+i).classList.toggle("hide",i!==n)});
  if(n===2)openCam();else if(!rec)stopCam();
  closeBar();
}
$("t1").onclick=function(){tab(1)};$("t2").onclick=function(){tab(2)};
/* ----- 카메라/녹화 ----- */
var stream=null,facing="environment",rec=null,chunks=[],rt=0,rtm=null,url=null;
function setCmsg(t){$("cmsg").textContent=t||""}
function stopCam(){if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}$("vid").srcObject=null}
function mark2(){$("cf").className=facing==="user"?"sel":"";$("cb2").className=facing==="environment"?"sel":"";$("vid").classList.toggle("mir",facing==="user")}
function openCam(){
  if(rec)return;
  stopCam();setCmsg("");mark2();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setCmsg("이 브라우저는 카메라를 지원하지 않아요.");return}
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing}},audio:$("aud").checked}).then(function(s){
    stream=s;$("vid").srcObject=s;var p=$("vid").play();if(p&&p.catch)p.catch(function(){});
  }).catch(function(e){setCmsg("카메라를 켤 수 없어요. 브라우저의 카메라 허용을 확인해 주세요. ("+(e&&e.name||"오류")+")")});
}
$("cf").onclick=function(){if(rec)return;facing="user";openCam()};
$("cb2").onclick=function(){if(rec)return;facing="environment";openCam()};
$("aud").onchange=function(){if(!rec)openCam()};
function fmt(s){return Math.floor(s/60)+":"+("0"+s%60).slice(-2)}
$("rb").onclick=function(){
  if(rec){rec.stop();return}
  if(!stream){setCmsg("카메라가 아직 켜지지 않았어요.");return}
  if(typeof MediaRecorder==="undefined"){setCmsg("이 브라우저는 녹화를 지원하지 않아요.");return}
  var types=["video/webm;codecs=vp8,opus","video/webm","video/mp4"],mt="";
  for(var i=0;i<types.length;i++){if(MediaRecorder.isTypeSupported(types[i])){mt=types[i];break}}
  chunks=[];
  try{rec=mt?new MediaRecorder(stream,{mimeType:mt}):new MediaRecorder(stream)}catch(e){setCmsg("녹화를 시작할 수 없어요.");rec=null;return}
  rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
  rec.onstop=function(){
    clearInterval(rtm);$("rc").classList.add("hide");
    var type=rec.mimeType||mt||"video/webm",ext=/mp4/.test(type)?"mp4":"webm";
    rec=null;$("rb").textContent="● 녹화 시작";$("rb").className="";$("cf").disabled=$("cb2").disabled=false;
    var blob=new Blob(chunks,{type:type});
    if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);
    $("pv").src=url;$("dl").href=url;
    var d=new Date();$("dl").download="영상_"+(d.getMonth()+1)+"월"+d.getDate()+"일_"+d.getHours()+"시"+d.getMinutes()+"분."+ext;
    $("done").classList.remove("hide");
  };
  rec.start(1000);
  rt=0;$("rc").textContent="● 녹화 0:00";$("rc").classList.remove("hide");
  rtm=setInterval(function(){rt++;$("rc").textContent="● 녹화 "+fmt(rt)},1000);
  $("rb").textContent="■ 녹화 정지";$("rb").className="rec";$("cf").disabled=$("cb2").disabled=true;
  $("done").classList.add("hide");
};
$("dx").onclick=function(){$("done").classList.add("hide");$("pv").removeAttribute("src");if(url){URL.revokeObjectURL(url);url=null}};
/* ----- 서버 연결 ----- */
function start(){
  $("login").classList.add("hide");$("app").classList.remove("hide");
  unsub=ref().onSnapshot(function(s){
    var d=s.exists?s.data():{};
    for(var n=1;n<=NT;n++)tb[n]=+d["t"+n]||0;
    wq=Array.isArray(d.wq)?d.wq.slice().sort(function(a,b){return a-b}):[];
    hist=Array.isArray(d.h)?d.h.slice().sort(function(a,b){return a-b}):[];
    draw();net(s.metadata.fromCache?"연결 확인 중…":"● 실시간 연결됨",s.metadata.fromCache?"err":"ok");
  },function(){net("연결 실패 — 로그인/권한을 확인하세요","err")});
}
function showLogin(msg){stopCam();$("app").classList.add("hide");$("login").classList.remove("hide");$("lerr").textContent=msg||""}
function doLogin(){$("lerr").textContent="";auth.signInWithEmailAndPassword($("em").value.trim(),$("pw").value).catch(function(){$("lerr").textContent="이메일 또는 비밀번호가 맞지 않아요."})}
$("lgo").onclick=doLogin;$("pw").addEventListener("keydown",function(e){if(e.key==="Enter")doLogin()});
setInterval(function(){if(!$("app").classList.contains("hide")&&!$("p1").classList.contains("hide"))draw()},30000);
firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();fs=firebase.firestore();
auth.onAuthStateChanged(function(u){if(u)start();else{if(unsub){unsub();unsub=null}showLogin()}});
</script></body></html>
