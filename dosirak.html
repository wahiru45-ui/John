<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정기 도시락 신청</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; background: #f6f3ee; color: #2b2b2b; padding-bottom: 130px; }
  header { background: #d9532b; color: #fff; padding: 22px 18px; }
  header h1 { font-size: 22px; }
  header p { font-size: 14px; opacity: .9; margin-top: 4px; }
  section { background: #fff; margin: 12px; border-radius: 14px; padding: 16px; }
  h2 { font-size: 17px; margin-bottom: 6px; }
  .sub { font-size: 13px; color: #888; margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .weeknav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .weeknav span { font-weight: 700; font-size: 15px; }
  .weeknav button { width: 40px; height: 36px; border-radius: 10px; border: 1px solid #ccc; background: #fff; font-size: 16px; }
  .weeknav button:disabled { opacity: .3; }
  .date:disabled { background: #f4f4f4; color: #ccc; border-color: #eee; }
  .saved { font-size: 15px; line-height: 1.6; }
  .saved button { margin-top: 8px; padding: 8px 14px; border-radius: 10px; border: 1px solid #ccc; background: #fafafa; font-size: 14px; }
  .date { border: 1px solid #ddd; border-radius: 12px; padding: 10px 4px; text-align: center; background: #fff; font-size: 15px; position: relative; }
  .date .d { font-weight: 700; }
  .date .w { font-size: 12px; color: #888; }
  .date .c { font-size: 12px; color: #d9532b; font-weight: 700; margin-top: 2px; min-height: 15px; }
  .date.has { background: #fff1ea; border-color: #f0a888; }
  .date.on { border: 2px solid #d9532b; }
  .date.done { background: #eee; color: #aaa; }
  .date.done .c { color: #2a8a4a; }
  .panel { margin-top: 14px; border-top: 1px dashed #ddd; padding-top: 12px; }
  .ptitle { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .menu { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
  .menu:last-of-type { border-bottom: none; }
  .menu .name { font-size: 16px; font-weight: 600; }
  .menu .price { font-size: 14px; color: #d9532b; margin-top: 2px; }
  .qty { display: flex; align-items: center; gap: 10px; }
  .qty button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid #ccc; background: #fff; font-size: 20px; }
  .qty span { min-width: 20px; text-align: center; font-size: 17px; font-weight: 600; }
  .tools { display: flex; gap: 8px; margin-top: 10px; }
  .tools button { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #ccc; background: #fafafa; font-size: 14px; }
  .pick { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f3f3f3; font-size: 14px; }
  .pick:last-child { border-bottom: none; }
  .pick b { white-space: nowrap; margin-left: 8px; }
  label { display: block; font-size: 14px; color: #666; margin: 12px 0 6px; }
  input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; font-family: inherit; }
  textarea { height: 70px; resize: none; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid #ddd; padding: 12px 16px; }
  .sum { font-size: 14px; color: #666; margin-bottom: 8px; }
  .sum b { font-size: 20px; color: #2b2b2b; }
  .submit { width: 100%; padding: 16px; border: none; border-radius: 12px; background: #d9532b; color: #fff; font-size: 17px; font-weight: 700; }
  .submit:disabled { background: #ccc; }
  .done { text-align: center; padding: 60px 20px; }
  .done h2 { font-size: 22px; margin-bottom: 10px; }
  .done button { margin-top: 24px; padding: 14px 24px; border-radius: 12px; border: none; background: #d9532b; color: #fff; font-size: 16px; }
  .hint { font-size: 13px; color: #999; margin-top: 8px; }
  .welcome { background: #eaf6ee; color: #2a6a3a; font-size: 14px; padding: 10px 12px; border-radius: 10px; margin: 12px 12px 0; }
</style>
</head>
<body>
<div id="form">
  <header>
    <h1>🍱 정기 보온도시락 신청</h1>
    <p>받고 싶은 날짜를 고르고, 날짜마다 도시락을 골라 주세요</p>
  </header>
  <div class="welcome" id="welcome" style="display:none"></div>

  <section>
    <h2>1. 날짜 고르기</h2>
    <p class="sub">날짜를 누르면 아래에서 그날 도시락을 고를 수 있어요</p>
    <div class="weeknav">
      <button id="wPrev">◀</button>
      <span id="wTitle"></span>
      <button id="wNext">▶</button>
    </div>
    <div class="grid" id="dates"></div>
    <div class="panel" id="panel"></div>
  </section>

  <section id="pickedBox" style="display:none">
    <h2>2. 고른 내역</h2>
    <div id="picked"></div>
  </section>

  <section>
    <h2>3. 받는 분 정보</h2>
    <div class="saved" id="savedBox" style="display:none"></div>
    <div id="infoForm">
    <label>연락처</label>
    <input id="phone" type="tel" placeholder="010-0000-0000">
    <label>이름</label>
    <input id="name" placeholder="홍길동">
    <label>배달 주소</label>
    <input id="addr" placeholder="주소와 상세주소">
    </div>
    <label>요청사항 (선택)</label>
    <textarea id="memo" placeholder="예) 문 앞에 놓아주세요"></textarea>
    <p class="hint">처음 한 번만 입력하면 이 휴대폰에 자동 등록돼서 다음부터는 날짜만 고르면 돼요.<br>결제는 신청 확인 후 가게에서 연락드려 안내해 드려요.</p>
  </section>
</div>

<div id="done" class="done" style="display:none">
  <h2>신청이 저장됐어요 ✅</h2>
  <p>가게에서 확인 후 연락드릴게요.</p>
  <button id="again">다시 보기 / 수정하기</button>
</div>

<div class="bar" id="bar">
  <div class="sum" id="sumText">날짜와 도시락을 골라주세요</div>
  <button class="submit" id="submit" disabled>신청하기</button>
</div>

<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyC2zCKXtWxY9vgHf2bS_L1bvuXUUvKQpSA",
  authDomain: "house-order-a689f.firebaseapp.com",
  projectId: "house-order-a689f",
  storageBucket: "house-order-a689f.firebasestorage.app",
  messagingSenderId: "621901289473",
  appId: "1:621901289473:web:952c5951744cd9f5b40800"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const db = getFirestore(initializeApp(firebaseConfig));

// ===== 설정 =====
const MENUS = [
  { id: "heat",  name: "발열도시락",   price: 7500 },
  { id: "warm",  name: "보온도시락",   price: 6600 },
  { id: "salad", name: "샐러드도시락", price: 6600 },
];
const CLOSED = [];          // 휴무 요일 넣으면 못 고름 (0=일, 6=토)
const MAX_WEEK = 1;         // 이번 주 + 다음 몇 주까지 볼 수 있게 할지
// ================

const WD = ["일", "월", "화", "수", "목", "금", "토"];
const won = n => n.toLocaleString("ko-KR") + "원";
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const label = s => { const d = new Date(s + "T00:00"); return `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})`; };

// 이 휴대폰에 저장된 손님 정보 (다음에 들어오면 자동으로 채워짐)
const LS = "dosirak_me";
let me = {};
try { me = JSON.parse(localStorage.getItem(LS) || "{}"); } catch {}
me.booked = me.booked || [];
me.subs = me.subs || [];   // 이 휴대폰에서 신청한 신청서 번호들

// 내일이 들어있는 주(월~일)부터 보여줌. 날짜는 열 때마다 자동으로 바뀜
const tomorrow = new Date(); tomorrow.setHours(0, 0, 0, 0); tomorrow.setDate(tomorrow.getDate() + 1);
const FIRST = ymd(tomorrow);
const baseMon = new Date(tomorrow); baseMon.setDate(tomorrow.getDate() - ((tomorrow.getDay() + 6) % 7));
let weekIdx = 0;
let DATES = [];
const ALL = [];   // 고를 수 있는 모든 날짜 (주 넘겨도 장바구니 유지)
function buildWeek() {
  DATES = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(baseMon); d.setDate(baseMon.getDate() + weekIdx * 7 + i);
    DATES.push(ymd(d));
  }
  for (let w = 0; w <= MAX_WEEK; w++) for (let i = 0; i < 7; i++) {
    const d = new Date(baseMon); d.setDate(baseMon.getDate() + w * 7 + i);
    const s = ymd(d); if (!ALL.includes(s)) ALL.push(s);
  }
}
buildWeek();
const canPick = s => s >= FIRST && !CLOSED.includes(new Date(s + "T00:00").getDay());

const cart = {};   // { "2026-11-24": {heat:1, warm:0, salad:2} }
let loaded = [];   // 이 휴대폰에서 예전에 신청한 내역 (수정 가능)
const owner = {};  // 날짜 → 그 날짜가 들어있는 신청서 번호
let orig = "{}";   // 불러온 직후 상태 (바뀐 게 있는지 비교용)
const nameToId = Object.fromEntries(MENUS.map(m => [m.name, m.id]));
const snapCart = () => JSON.stringify(Object.fromEntries(ALL.filter(canPick).map(d => [d, MENUS.map(m => (cart[d] && cart[d][m.id]) || 0)]).filter(([, v]) => v.some(x => x))));
const isChanged = () => snapCart() !== orig;
let active = null;
let lastPicked = null;

const dayCount = s => cart[s] ? MENUS.reduce((a, m) => a + (cart[s][m.id] || 0), 0) : 0;
const dayMoney = s => cart[s] ? MENUS.reduce((a, m) => a + m.price * (cart[s][m.id] || 0), 0) : 0;
const pickedDates = () => ALL.filter(s => dayCount(s) > 0);

function render() {
  document.getElementById("wTitle").textContent = `${label(DATES[0])} ~ ${label(DATES[6])}`;
  document.getElementById("wPrev").disabled = weekIdx === 0;
  document.getElementById("wNext").disabled = weekIdx >= MAX_WEEK;
  document.getElementById("dates").innerHTML = DATES.map(s => {
    const d = new Date(s + "T00:00");
    const n = dayCount(s);
    const done = false;
    const cls = ["date", n ? "has" : "", s === active ? "on" : "", done && !n ? "done" : ""].join(" ");
    return `<button class="${cls}" data-date="${s}" ${canPick(s) ? "" : "disabled"}>
      <div class="d">${d.getMonth() + 1}/${d.getDate()}</div>
      <div class="w">${WD[d.getDay()]}</div>
      <div class="c">${n ? n + "개" + (owner[s] ? " ✓" : "") : done ? "신청됨" : ""}</div>
    </button>`;
  }).join("");

  const panel = document.getElementById("panel");
  if (!active) {
    panel.innerHTML = `<p class="sub" style="margin:0">↑ 위에서 날짜를 눌러 주세요</p>`;
  } else {
    const c = cart[active] || {};
    const done = false;
    panel.innerHTML = `
      <div class="ptitle">${label(active)} 도시락</div>
      ${owner[active] ? `<p class="sub" style="margin:0 0 4px">✓ 이미 신청한 날이에요. 개수를 바꾸고 아래 버튼을 누르면 수정돼요. 0개로 만들면 이 날은 취소돼요.</p>` : ""}
      ${done ? `<p class="sub" style="margin:0 0 4px">이 날짜는 이미 신청하셨어요. 더 고르면 추가로 신청돼요.</p>` : ""}
      ${MENUS.map(m => `
        <div class="menu">
          <div><div class="name">${m.name}</div><div class="price">${won(m.price)}</div></div>
          <div class="qty">
            <button data-m="${m.id}" data-d="-1">−</button>
            <span>${c[m.id] || 0}</span>
            <button data-m="${m.id}" data-d="1">+</button>
          </div>
        </div>`).join("")}
      <div class="tools">
        ${lastPicked && lastPicked !== active && dayCount(lastPicked) ? `<button data-copy="1">${label(lastPicked)}과 똑같이</button>` : ""}
        ${dayCount(active) ? `<button data-clear="1">이 날 비우기</button>` : ""}
      </div>`;
  }

  const ps = pickedDates();
  document.getElementById("pickedBox").style.display = ps.length ? "block" : "none";
  document.getElementById("picked").innerHTML = ps.map(s => {
    const txt = MENUS.filter(m => cart[s][m.id]).map(m => `${m.name} ${cart[s][m.id]}`).join(", ");
    return `<div class="pick"><span>${label(s)} ${txt}</span><b>${won(dayMoney(s))}</b></div>`;
  }).join("");

  const total = ps.reduce((a, s) => a + dayMoney(s), 0);
  const boxes = ps.reduce((a, s) => a + dayCount(s), 0);
  document.getElementById("sumText").innerHTML = ps.length
    ? `${ps.length}일 · 도시락 ${boxes}개 = <b>${won(total)}</b>`
    : (loaded.length ? "모든 날을 취소하려면 아래 버튼을 눌러 주세요" : "날짜와 도시락을 골라주세요");
  const btn = document.getElementById("submit");
  if (btn.dataset.busy) return;
  btn.disabled = !isChanged();
  btn.textContent = loaded.length ? "신청 / 수정하기" : "신청하기";
  if (loaded.length && ps.length && !isChanged()) document.getElementById("sumText").innerHTML += `<br><span style="font-size:12px">개수를 바꾸거나 날짜를 추가하면 버튼이 켜져요</span>`;
}

document.addEventListener("click", e => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.date) { active = t.dataset.date; render(); }
  if (t.id === "wPrev" && weekIdx > 0) { weekIdx--; buildWeek(); active = null; render(); }
  if (t.id === "wNext" && weekIdx < MAX_WEEK) { weekIdx++; buildWeek(); active = null; render(); }
  if (t.id === "editInfo") { document.getElementById("infoForm").style.display = "block"; document.getElementById("savedBox").style.display = "none"; }
  if (t.dataset.m) {
    cart[active] = cart[active] || {};
    cart[active][t.dataset.m] = Math.max(0, (cart[active][t.dataset.m] || 0) + Number(t.dataset.d));
    if (dayCount(active)) lastPicked = active;
    render();
  }
  if (t.dataset.copy) { cart[active] = { ...cart[lastPicked] }; render(); }
  if (t.dataset.clear) { delete cart[active]; render(); }
});

// 이전에 신청한 정보 자동 채우기
if (me.phone) {
  ["phone", "name", "addr"].forEach(k => document.getElementById(k).value = me[k] || "");
  const w = document.getElementById("welcome");
  w.style.display = "block";
  w.textContent = `${me.name || ""}님, 다시 오셨네요! 날짜만 골라서 신청하시면 돼요.`;
  const sb = document.getElementById("savedBox");
  sb.style.display = "block";
  const esc = x => String(x ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  sb.innerHTML = `👤 ${esc(me.name)}<br>📞 ${esc(me.phone)}<br>📍 ${esc(me.addr)}<br><button id="editInfo">정보 수정</button>`;
  document.getElementById("memo").value = me.memo || "";
  document.getElementById("infoForm").style.display = "none";
}

// 예전에 신청한 내역 불러오기 → 개수 수정 가능
async function loadMine() {
  const keep = [];
  for (const id of me.subs) {
    try {
      const snap = await getDoc(doc(db, "subscriptions", id));
      if (!snap.exists()) continue;
      const d = snap.data();
      if (d.status === "종료") continue;
      keep.push(id);
      loaded.push({ id, ...d });
      (d.orders || []).forEach(o => {
        if (!ALL.includes(o.date) || !canPick(o.date)) return;
        owner[o.date] = owner[o.date] || id;
        cart[o.date] = cart[o.date] || {};
        o.items.forEach(i => { const k = nameToId[i.name]; if (k) cart[o.date][k] = (cart[o.date][k] || 0) + i.qty; });
      });
    } catch (e) { keep.push(id); }
  }
  me.subs = keep;
  orig = snapCart();
  if (loaded.length) {
    const w = document.getElementById("welcome");
    w.textContent = `${me.name || ""}님, 신청하신 내역을 불러왔어요. 개수를 바꾸거나 날짜를 추가할 수 있어요.`;
  }
  render();
}

document.getElementById("submit").addEventListener("click", async () => {
  const v = id => document.getElementById(id).value.trim();
  if (!v("name") || !v("phone") || !v("addr")) { alert("연락처, 이름, 주소를 입력해 주세요."); return; }
  const btn = document.getElementById("submit");
  btn.disabled = true; btn.textContent = "보내는 중..."; btn.dataset.busy = "1";
  const mk = d => ({
    date: d,
    items: MENUS.filter(m => cart[d] && cart[d][m.id]).map(m => ({ name: m.name, price: m.price, qty: cart[d][m.id] })),
    amount: dayMoney(d)
  });
  const editable = d => ALL.includes(d) && canPick(d);
  const used = new Set();
  const info = { name: v("name"), addr: v("addr"), memo: v("memo") };
  try {
    // 1) 예전 신청서 수정
    for (const L of loaded) {
      const before = L.orders || [];
      const keepOld = before.filter(o => !editable(o.date));
      const mine = [...new Set(before.filter(o => editable(o.date)).map(o => o.date))]
        .filter(d => owner[d] === L.id && !used.has(d));
      mine.forEach(d => used.add(d));
      const orders = [...keepOld, ...mine.filter(d => dayCount(d)).map(mk)].sort((a, b) => a.date < b.date ? -1 : 1);
      if (JSON.stringify(orders) === JSON.stringify(before)) continue;
      await updateDoc(doc(db, "subscriptions", L.id), {
        ...info, orders,
        total: orders.reduce((a, o) => a + o.amount, 0),
        status: orders.length ? "신청" : "종료",
        editedAt: serverTimestamp()
      });
      if (!orders.length) me.subs = me.subs.filter(x => x !== L.id);
    }
    // 2) 새로 고른 날짜는 새 신청서로
    const fresh = pickedDates().filter(d => !used.has(d) && !owner[d]);
    if (fresh.length) {
      const orders = fresh.map(mk);
      const ref = await addDoc(collection(db, "subscriptions"), {
        orders, phone: v("phone"), ...info,
        total: orders.reduce((a, o) => a + o.amount, 0),
        status: "신청", createdAt: serverTimestamp()
      });
      me.subs.push(ref.id);
    }
    me = { ...me, phone: v("phone"), ...info,
           booked: [...new Set([...me.booked, ...pickedDates()])].filter(d => d >= ymd(new Date())) };
    try { localStorage.setItem(LS, JSON.stringify(me)); } catch {}
    document.getElementById("form").style.display = "none";
    document.getElementById("bar").style.display = "none";
    document.getElementById("done").style.display = "block";
  } catch (err) {
    alert("저장에 실패했어요. 잠시 후 다시 시도해 주세요.");
    delete btn.dataset.busy;
    render();
  }
});
document.getElementById("again").onclick = () => location.reload();

render();
if (me.subs.length) loadMine();
</script>
</body>
</html>
