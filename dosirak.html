<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정기 도시락 신청</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; background: #f6f3ee; color: #2b2b2b; padding-bottom: 130px; }
  header { background: #d9532b; color: #fff; padding: 22px 18px; }
  header h1 { font-size: 22px; }
  header p { font-size: 14px; opacity: .9; margin-top: 4px; }
  section { background: #fff; margin: 12px; border-radius: 14px; padding: 16px; }
  h2 { font-size: 17px; margin-bottom: 6px; }
  .sub { font-size: 13px; color: #888; margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .mealbox { border: 1px dashed #e0b59f; border-radius: 12px; padding: 6px 4px; display: flex; flex-direction: column; gap: 4px; justify-content: center; background: #fffaf6; }
  .mealbox .mt { font-size: 11px; color: #a0583a; text-align: center; font-weight: 700; }
  .mealbox .mbtn { border: 1px solid #ddd; border-radius: 8px; background: #fff; font-size: 13px; padding: 4px 0; }
  .mealbox .mbtn.on { background: #d9532b; border-color: #d9532b; color: #fff; font-weight: 700; }
  .meal-tag { display: inline-block; font-size: 12px; font-weight: 700; color: #fff; background: #d9532b; border-radius: 8px; padding: 1px 7px; margin-left: 4px; vertical-align: middle; }
  .weeknav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .weeknav span { font-weight: 700; font-size: 15px; }
  .weeknav button { width: 40px; height: 36px; border-radius: 10px; border: 1px solid #ccc; background: #fff; font-size: 16px; }
  .weeknav button:disabled { opacity: .3; }
  .date:disabled { background: #f4f4f4; color: #ccc; border-color: #eee; }
  .saved { font-size: 15px; line-height: 1.6; }
  .saved button { margin-top: 8px; padding: 8px 14px; border-radius: 10px; border: 1px solid #ccc; background: #fafafa; font-size: 14px; }
  .date { border: 1px solid #ddd; border-radius: 12px; padding: 10px 4px; text-align: center; background: #fff; font-size: 15px; position: relative; }
  .date .d { font-weight: 700; }
  .date .w { font-size: 12px; color: #888; }
  .date .c { font-size: 12px; color: #d9532b; font-weight: 700; margin-top: 2px; min-height: 15px; }
  .date.has { background: #fff1ea; border-color: #f0a888; }
  .date.on { border: 2px solid #d9532b; }
  .date.done { background: #eee; color: #aaa; }
  .date.done .c { color: #2a8a4a; }
  .st { font-size: 11px; font-weight: 700; margin-top: 2px; }
  .st.ok { color: #2a8a4a; }
  .st.wait { color: #b07a00; }
  .alarm { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 24px; }
  .abox { background: #fff; border-radius: 18px; padding: 26px 22px; width: 100%; max-width: 340px; text-align: center; animation: pop .25s ease-out; }
  .aicon { font-size: 44px; }
  .amsg { font-size: 18px; font-weight: 700; margin: 10px 0 20px; line-height: 1.5; white-space: pre-line; }
  .abox button { width: 100%; padding: 14px; border: none; border-radius: 12px; background: #d9532b; color: #fff; font-size: 16px; font-weight: 700; }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .my { border: 1px solid #eee; border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
  .my .mh { display: flex; justify-content: space-between; align-items: center; }
  .my .md { font-weight: 700; font-size: 16px; }
  .my .mi { font-size: 14px; color: #555; margin: 4px 0; }
  .my .mb { display: flex; gap: 8px; margin-top: 6px; }
  .my .mb button { flex: 1; padding: 9px; border-radius: 10px; border: 1px solid #ccc; background: #fff; font-size: 14px; }
  .my .mb .cx { color: #c33; border-color: #e0a0a0; }
  .tag { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 10px; color: #fff; }
  .tag.wait { background: #e0a100; } .tag.ok { background: #2a8a4a; } .tag.done { background: #888; }
  .mysum { display: flex; justify-content: space-between; font-weight: 700; padding: 8px 2px 0; border-top: 1px solid #eee; margin-top: 4px; }
  details.mypast summary { font-size: 13px; color: #999; padding: 6px 0; cursor: pointer; }
  .addrRow { display: flex; gap: 8px; }
  .addrRow input { flex: 1; background: #fafafa; }
  .addrRow button { white-space: nowrap; padding: 0 14px; border-radius: 10px; border: none; background: #fee500; color: #3c1e1e; font-size: 15px; font-weight: 700; }
  .pcLayer { position: fixed; inset: 0; background: #fff; z-index: 60; display: none; flex-direction: column; }
  .pcHead { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #eee; font-weight: 700; font-size: 17px; }
  .pcHead button { border: none; background: none; font-size: 24px; }
  #pcBox { flex: 1; }
  .mrow { display: grid; grid-template-columns: 70px minmax(0,1fr); padding: 8px 4px; border-top: 1px solid #f0f0f0; font-size: 15px; }
  .mrow .dd { color: #555; }
  .mrow.past { color: #bbb; } .mrow.past .dd { color: #bbb; }
  .mrow.on { background: #fff1ea; border-radius: 8px; color: #8a3410; }
  .mrow .none { color: #aaa; font-size: 14px; }
  .mcards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0 6px; }
  .mcard { background: #fff1ea; border-radius: 10px; padding: 8px 10px; }
  .mcard .k { font-size: 12px; color: #b0583a; }
  .mcard .v { font-size: 16px; font-weight: 700; color: #7a2e12; }
  .panel { margin-top: 14px; border-top: 1px dashed #ddd; padding-top: 12px; }
  .ptitle { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .menu { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
  .menu:last-of-type { border-bottom: none; }
  .menu .name { font-size: 16px; font-weight: 600; }
  .menu .price { font-size: 14px; color: #d9532b; margin-top: 2px; }
  .qty { display: flex; align-items: center; gap: 10px; }
  .qty button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid #ccc; background: #fff; font-size: 20px; }
  .qty span { min-width: 20px; text-align: center; font-size: 17px; font-weight: 600; }
  .tools { display: flex; gap: 8px; margin-top: 10px; }
  .tools button { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #ccc; background: #fafafa; font-size: 14px; }
  .pick { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f3f3f3; font-size: 14px; }
  .pick:last-child { border-bottom: none; }
  .pick b { white-space: nowrap; margin-left: 8px; }
  label { display: block; font-size: 14px; color: #666; margin: 12px 0 6px; }
  input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; font-family: inherit; }
  textarea { height: 70px; resize: none; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid #ddd; padding: 12px 16px; }
  .sum { font-size: 14px; color: #666; margin-bottom: 8px; }
  .sum b { font-size: 20px; color: #2b2b2b; }
  .submit { width: 100%; padding: 16px; border: none; border-radius: 12px; background: #d9532b; color: #fff; font-size: 17px; font-weight: 700; }
  .submit:disabled { background: #ccc; }
  .done { text-align: center; padding: 60px 20px; }
  .done h2 { font-size: 22px; margin-bottom: 10px; }
  .done button { margin-top: 24px; padding: 14px 24px; border-radius: 12px; border: none; background: #d9532b; color: #fff; font-size: 16px; }
  .hint { font-size: 13px; color: #999; margin-top: 8px; }
  .welcome { background: #eaf6ee; color: #2a6a3a; font-size: 14px; padding: 10px 12px; border-radius: 10px; margin: 12px 12px 0; }
</style>
<script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
</head>
<body>
<div id="form">
  <header>
    <h1>🍱 정기 보온도시락 신청</h1>
    <p>받고 싶은 날짜를 고르고, 날짜마다 도시락을 골라 주세요</p>
  </header>
  <div class="welcome" id="welcome" style="display:none"></div>

  <section id="menuBox">
    <h2>🍱 이번 주 식단 <span style="font-size:13px;color:#888;font-weight:400">발열·보온 도시락</span></h2>
    <div id="menuList"></div>
  </section>

  <section id="myBox" style="display:none">
    <h2>📋 내 신청 내역</h2>
    <div id="myList"></div>
  </section>

  <section id="pickSec">
    <h2>1. 날짜 고르기</h2>
    <p class="sub">날짜를 누르면 아래에서 그날 도시락을 고를 수 있어요</p>
    <div class="weeknav">
      <button id="wPrev">◀</button>
      <span id="wTitle"></span>
      <button id="wNext">▶</button>
    </div>
    <div class="grid" id="dates"></div>
    <div class="panel" id="panel"></div>
  </section>

  <section id="pickedBox" style="display:none">
    <h2>2. 고른 내역</h2>
    <div id="picked"></div>
  </section>

  <section>
    <h2>3. 받는 분 정보</h2>
    <div class="saved" id="savedBox" style="display:none"></div>
    <div id="infoForm">
    <label>연락처</label>
    <input id="phone" type="tel" placeholder="010-0000-0000">
    <label>이름</label>
    <input id="name" placeholder="홍길동">
    <label>배달 주소</label>
    <div class="addrRow">
      <input id="addrMain" placeholder="주소 찾기를 눌러 주세요" readonly>
      <button type="button" id="findAddr">🔍 주소 찾기</button>
    </div>
    <input id="addrDetail" placeholder="상세주소 (동·호수, 층, 상호 등)" style="margin-top:8px">
    <input id="addr" type="hidden">
    </div>
    <label>요청사항 (선택)</label>
    <textarea id="memo" placeholder="예) 문 앞에 놓아주세요"></textarea>
    <p class="hint">처음 한 번만 입력하면 이 휴대폰에 자동 등록돼서 다음부터는 날짜만 고르면 돼요.<br>결제는 신청 확인 후 가게에서 연락드려 안내해 드려요.</p>
  </section>
</div>

<div class="pcLayer" id="pcLayer">
  <div class="pcHead"><span>📍 주소 찾기</span><button id="pcClose">✕</button></div>
  <div id="pcBox"></div>
</div>

<div id="alarm" class="alarm" style="display:none">
  <div class="abox">
    <div class="aicon">🔔</div>
    <div class="amsg" id="alarmMsg"></div>
    <button id="alarmOk">확인</button>
  </div>
</div>

<div id="done" class="done" style="display:none">
  <h2>신청이 저장됐어요 ✅</h2>
  <p>가게에서 확인 후 연락드릴게요.</p>
  <p class="hint" style="margin-top:14px">잠시 후 처음 화면으로 돌아가요…</p>
</div>

<div class="bar" id="bar">
  <div class="sum" id="sumText">날짜와 도시락을 골라주세요</div>
  <button class="submit" id="submit" disabled>신청하기</button>
</div>

<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyC2zCKXtWxY9vgHf2bS_L1bvuXUUvKQpSA",
  authDomain: "house-order-a689f.firebaseapp.com",
  projectId: "house-order-a689f",
  storageBucket: "house-order-a689f.firebasestorage.app",
  messagingSenderId: "621901289473",
  appId: "1:621901289473:web:952c5951744cd9f5b40800"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp, doc, getDoc, updateDoc, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const db = getFirestore(initializeApp(firebaseConfig));

// ===== 설정 =====
const MENUS = [
  { id: "heat",  name: "발열도시락",   price: 7500 },
  { id: "warm",  name: "보온도시락",   price: 6600 },
  { id: "salad", name: "샐러드도시락", price: 6600 },
  { id: "special", name: "5찬+국+특식", price: 10400 },
];
const CLOSED = [];          // 휴무 요일 넣으면 못 고름 (0=일, 6=토)
const MAX_WEEK = 1;         // 이번 주 + 다음 몇 주까지 볼 수 있게 할지
// ================

const WD = ["일", "월", "화", "수", "목", "금", "토"];
const won = n => n.toLocaleString("ko-KR") + "원";
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const label = s => { const d = new Date(s + "T00:00"); return `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})`; };

// 이 휴대폰에 저장된 손님 정보 (다음에 들어오면 자동으로 채워짐)
const LS = "dosirak_me";
let me = {};
try { me = JSON.parse(localStorage.getItem(LS) || "{}"); } catch {}
me.booked = me.booked || [];
me.subs = me.subs || [];   // 이 휴대폰에서 신청한 신청서 번호들

// 내일이 들어있는 주(월~일)부터 보여줌. 날짜는 열 때마다 자동으로 바뀜
const tomorrow = new Date(); tomorrow.setHours(0, 0, 0, 0); tomorrow.setDate(tomorrow.getDate() + 1);
const FIRST = ymd(tomorrow);
const baseMon = new Date(tomorrow); baseMon.setDate(tomorrow.getDate() - ((tomorrow.getDay() + 6) % 7));
let weekIdx = 0;
let DATES = [];
const ALL = [];   // 고를 수 있는 모든 날짜 (주 넘겨도 장바구니 유지)
function buildWeek() {
  DATES = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(baseMon); d.setDate(baseMon.getDate() + weekIdx * 7 + i);
    DATES.push(ymd(d));
  }
  for (let w = 0; w <= MAX_WEEK; w++) for (let i = 0; i < 7; i++) {
    const d = new Date(baseMon); d.setDate(baseMon.getDate() + w * 7 + i);
    const s = ymd(d); if (!ALL.includes(s)) ALL.push(s);
  }
}
buildWeek();
// ===== 당일 주문 =====
// 오늘 주문 마감 시간 (여기 없는 식사는 당일 주문 안 됨)
const SAME_DAY = { "점심": [8, 30], "저녁": [15, 0] };   // [시, 분] 24시간 기준
const TODAY_STR = ymd(new Date());
const nowMin = () => { const n = new Date(); return n.getHours() * 60 + n.getMinutes(); };
const isOpenToday = m => SAME_DAY[m] && nowMin() < SAME_DAY[m][0] * 60 + SAME_DAY[m][1];
const openMealsToday = () => ["아침", "점심", "저녁"].filter(isOpenToday);
const sameDayOpen = () => openMealsToday().length > 0;
const fmtTime = ([h, m]) => `${h < 12 ? "오전" : "오후"} ${h > 12 ? h - 12 : h}시${m ? " " + m + "분" : ""}`;
// ===== 날짜 + 식사 시간 = "칸" =====
// 날짜 하나에 아침·점심·저녁을 따로 담을 수 있어요. 칸 이름은 "2026-11-27|저녁"
const MEALS = ["아침", "점심", "저녁"];
const mealOf = o => o.meal || "점심";
const slot = (d, m) => d + "|" + m;
const slotDate = k => k.split("|")[0];
const slotMeal = k => k.split("|")[1];
const isClosedDay = d => CLOSED.includes(new Date(d + "T00:00").getDay());
const canSlot = (d, m) => !isClosedDay(d) && (d >= FIRST || (d === TODAY_STR && isOpenToday(m)));
const canPick = d => MEALS.some(m => canSlot(d, m));     // 날짜 칸을 누를 수 있나
const mealsFor = d => MEALS.filter(m => canSlot(d, m));
const ALL_SLOTS = () => ALL.flatMap(d => MEALS.map(m => slot(d, m)));
const orderSort = (a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : MEALS.indexOf(mealOf(a)) - MEALS.indexOf(mealOf(b));

const cart = {};   // { "2026-11-27|점심": {heat:1, warm:0} }
let loaded = [];   // 이 휴대폰에서 예전에 신청한 내역 (수정 가능)
let menus = {};    // 날짜 → {main, soup} (가게에서 입력한 식단)
const live = {};   // 신청서 번호 → 최신 내용 (실시간)
const owner = {};  // 칸 → 그 칸이 들어있는 신청서 번호
const pendingSlot = {}; // 아직 가게에서 확인 안 한 칸
let orig = "{}";   // 불러온 직후 상태 (바뀐 게 있는지 비교용)
const nameToId = Object.fromEntries(MENUS.map(m => [m.name, m.id]));
const slotCount = k => cart[k] ? MENUS.reduce((a, m) => a + (cart[k][m.id] || 0), 0) : 0;
const slotMoney = k => cart[k] ? MENUS.reduce((a, m) => a + m.price * (cart[k][m.id] || 0), 0) : 0;
const dateCount = d => MEALS.reduce((a, m) => a + slotCount(slot(d, m)), 0);
const pickedSlots = () => ALL_SLOTS().filter(k => slotCount(k) > 0);
const snapCart = () => JSON.stringify(Object.fromEntries(ALL_SLOTS().filter(k => canSlot(slotDate(k), slotMeal(k)))
  .map(k => [k, MENUS.map(m => (cart[k] && cart[k][m.id]) || 0)]).filter(([, v]) => v.some(x => x))));
const isChanged = () => snapCart() !== orig;
let active = null;       // 고른 날짜
let activeMeal = "점심";  // 고른 식사 시간
let lastPicked = null;   // 마지막으로 담은 칸 (똑같이 담기용)
const activeSlot = () => slot(active, activeMeal);
function pickDate(d, m) {
  active = d;
  const ok = mealsFor(d);
  activeMeal = m && ok.includes(m) ? m : (ok.find(x => slotCount(slot(d, x))) || (ok.includes("점심") ? "점심" : ok[0]) || "점심");
}

function renderMine() {
  const rows = [];
  Object.entries(live).forEach(([id, d]) => {
    if (d.status === "종료") return;
    (d.orders || []).forEach(o => rows.push({ id, o, st: d.status }));
  });
  const box = document.getElementById("myBox");
  box.style.display = rows.length ? "block" : "none";
  if (!rows.length) return;
  rows.sort((a, b) => orderSort(a.o, b.o));
  const today = ymd(new Date());
  const up = rows.filter(r => r.o.date >= today), past = rows.filter(r => r.o.date < today).reverse();
  const card = ({ o, st }) => {
    const tag = o.delivered ? `<span class="tag done">배달 완료</span>` : st === "신청" ? `<span class="tag wait">확인 대기</span>` : `<span class="tag ok">✓ 확인됨</span>`;
    const k = slot(o.date, mealOf(o));
    const can = ALL.includes(o.date) && canSlot(o.date, mealOf(o)) && !o.delivered;
    return `<div class="my">
      <div class="mh"><span class="md">${label(o.date)} <span class="meal-tag">${mealOf(o)}</span></span>${tag}</div>
      <div class="mi">${o.items.map(i => `${i.name} ${i.qty}개`).join(", ")} · <b>${won(o.amount)}</b></div>
      ${can ? `<div class="mb"><button data-myedit="${k}">✏️ 개수 수정</button><button class="cx" data-mycancel="${k}">이 식사 취소</button></div>`
            : (o.date >= today && !o.delivered ? `<div class="mi" style="font-size:12px;color:#999">마감·지난 주문은 가게로 연락해 주세요</div>` : "")}
    </div>`;
  };
  document.getElementById("myList").innerHTML =
    (up.map(card).join("") || `<p class="sub">앞으로 받을 도시락이 없어요</p>`) +
    (up.length ? `<div class="mysum"><span>앞으로 ${up.length}건</span><span>${won(up.reduce((a, r) => a + r.o.amount, 0))}</span></div>` : "") +
    (past.length ? `<details class="mypast"><summary>지난 내역 ${past.length}개 보기</summary>${past.map(card).join("")}</details>` : "");
}

function renderMenus() {
  const today = ymd(new Date());
  document.getElementById("menuList").innerHTML = DATES.map(d => {
    const m = menus[d];
    const txt = m && (m.main || m.soup)
      ? `<span><b>${escH(m.main || "-")}</b> · ${escH(m.soup || "-")}</span>`
      : `<span class="none">식단 준비 중</span>`;
    return `<div class="mrow ${d < today ? "past" : ""} ${d === active ? "on" : ""}"><span class="dd">${label(d)}</span>${txt}</div>`;
  }).join("");
}
const escH = x => String(x ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const short = { "아침": "아", "점심": "점", "저녁": "저" };

function render() {
  renderMine();
  renderMenus();
  document.getElementById("wTitle").textContent = `${label(DATES[0])} ~ ${label(DATES[6])}`;
  document.getElementById("wPrev").disabled = weekIdx === 0;
  document.getElementById("wNext").disabled = weekIdx >= MAX_WEEK;
  document.getElementById("dates").innerHTML = DATES.map(d => {
    const dt = new Date(d + "T00:00");
    const n = dateCount(d);
    const parts = MEALS.filter(m => slotCount(slot(d, m))).map(m => `${short[m]}${slotCount(slot(d, m))}`).join("·");
    const mine = MEALS.filter(m => owner[slot(d, m)] && slotCount(slot(d, m)));
    const wait = mine.some(m => pendingSlot[slot(d, m)]);
    const cls = ["date", n ? "has" : "", d === active ? "on" : ""].join(" ");
    return `<button class="${cls}" data-date="${d}" ${canPick(d) ? "" : "disabled"}>
      <div class="d">${dt.getMonth() + 1}/${dt.getDate()}</div>
      <div class="w">${WD[dt.getDay()]}</div>
      <div class="c">${n ? parts : ""}</div>
      ${mine.length ? `<div class="st ${wait ? "wait" : "ok"}">${wait ? "확인 대기" : "✓ 확인됨"}</div>` : ""}
    </button>`;
  }).join("") + `<div class="mealbox">${active && canPick(active)
      ? `<div class="mt">${active === TODAY_STR ? "오늘 마감 전" : "식사 시간"}</div>` + mealsFor(active).map(m => {
          const c = slotCount(slot(active, m));
          return `<button class="mbtn ${activeMeal === m ? "on" : ""}" data-meal="${m}">${m}${c ? ` ${c}` : ""}${active === TODAY_STR ? `<br><span style="font-size:10px">${fmtTime(SAME_DAY[m])}까지</span>` : ""}</button>`;
        }).join("")
      : `<div class="mt">날짜를 고르면<br>아침·점심·저녁<br>선택</div>`}</div>`;

  const panel = document.getElementById("panel");
  if (!active) {
    panel.innerHTML = `<p class="sub" style="margin:0">↑ 위에서 날짜를 눌러 주세요</p>`;
  } else {
    const k = activeSlot();
    const c = cart[k] || {};
    const am = menus[active];
    panel.innerHTML = `
      <div class="ptitle">${label(active)} <span class="meal-tag">${activeMeal}</span> 도시락</div>
      <p class="sub" style="margin:0 0 6px">같은 날 다른 식사도 받으려면 옆 칸에서 아침·점심·저녁을 바꿔서 담아 주세요</p>
      ${am && (am.main || am.soup) ? `<div class="mcards"><div class="mcard"><div class="k">메인</div><div class="v">${escH(am.main || "-")}</div></div><div class="mcard"><div class="k">국</div><div class="v">${escH(am.soup || "-")}</div></div></div>` : `<p class="sub" style="margin:4px 0">이 날 식단은 준비 중이에요</p>`}
      ${owner[k] ? `<p class="sub" style="margin:0 0 4px;color:${pendingSlot[k] ? "#d9532b" : "#2a8a4a"};font-weight:700">${pendingSlot[k] ? "⏳ 가게에서 확인 중이에요" : "✅ 가게에서 주문을 확인했어요"}</p>` : ""}
      ${owner[k] ? `<p class="sub" style="margin:0 0 4px">이미 신청한 ${activeMeal}이에요. 개수를 바꾸고 아래 버튼을 누르면 수정돼요. 0개로 만들면 취소돼요.</p>` : ""}
      ${MENUS.map(m => `
        <div class="menu">
          <div><div class="name">${m.name}</div><div class="price">${won(m.price)}</div></div>
          <div class="qty">
            <button data-m="${m.id}" data-d="-1">−</button>
            <span>${c[m.id] || 0}</span>
            <button data-m="${m.id}" data-d="1">+</button>
          </div>
        </div>`).join("")}
      <div class="tools">
        ${lastPicked && lastPicked !== k && slotCount(lastPicked) ? `<button data-copy="1">${label(slotDate(lastPicked))} ${slotMeal(lastPicked)}과 똑같이</button>` : ""}
        ${slotCount(k) ? `<button data-clear="1">이 식사 비우기</button>` : ""}
      </div>`;
  }

  const ps = pickedSlots();
  document.getElementById("pickedBox").style.display = ps.length ? "block" : "none";
  document.getElementById("picked").innerHTML = ps.map(k => {
    const txt = MENUS.filter(m => cart[k][m.id]).map(m => `${m.name} ${cart[k][m.id]}`).join(", ");
    return `<div class="pick"><span>${label(slotDate(k))} <span class="meal-tag">${slotMeal(k)}</span> ${txt}</span><b>${won(slotMoney(k))}</b></div>`;
  }).join("");

  const total = ps.reduce((a, k) => a + slotMoney(k), 0);
  const boxes = ps.reduce((a, k) => a + slotCount(k), 0);
  document.getElementById("sumText").innerHTML = ps.length
    ? `${ps.length}건 · 도시락 ${boxes}개 = <b>${won(total)}</b>`
    : (loaded.length ? "모두 취소하려면 아래 버튼을 눌러 주세요" : "날짜와 도시락을 골라주세요");
  const btn = document.getElementById("submit");
  if (btn.dataset.busy) return;
  btn.disabled = !isChanged();
  btn.textContent = loaded.length ? "신청 / 수정하기" : "신청하기";
  if (loaded.length && ps.length && !isChanged()) document.getElementById("sumText").innerHTML += `<br><span style="font-size:12px">개수를 바꾸거나 식사를 추가하면 버튼이 켜져요</span>`;
}

document.addEventListener("click", e => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.date) { pickDate(t.dataset.date); render(); }
  if (t.dataset.meal && active) {
    if (!canSlot(active, t.dataset.meal)) return;
    activeMeal = t.dataset.meal; render();
  }
  if (t.dataset.myedit) {
    const d = slotDate(t.dataset.myedit), m = slotMeal(t.dataset.myedit);
    const w = Math.floor((new Date(d + "T00:00") - baseMon) / (7 * 86400000));
    if (w !== weekIdx) { weekIdx = w; buildWeek(); }
    pickDate(d, m); render();
    document.getElementById("panel").scrollIntoView({ behavior: "smooth", block: "start" });
  }
  if (t.dataset.mycancel) {
    const k = t.dataset.mycancel;
    if (!confirm(`${label(slotDate(k))} ${slotMeal(k)} 주문을 취소할까요?`)) return;
    delete cart[k]; render();
    document.getElementById("submit").click();
  }
  if (t.id === "wPrev" && weekIdx > 0) { weekIdx--; buildWeek(); active = null; render(); }
  if (t.id === "wNext" && weekIdx < MAX_WEEK) { weekIdx++; buildWeek(); active = null; render(); }
  if (t.id === "editInfo") { document.getElementById("infoForm").style.display = "block"; document.getElementById("savedBox").style.display = "none"; }
  if (t.dataset.m && active) {
    const k = activeSlot();
    cart[k] = cart[k] || {};
    cart[k][t.dataset.m] = Math.max(0, (cart[k][t.dataset.m] || 0) + Number(t.dataset.d));
    if (slotCount(k)) lastPicked = k;
    render();
  }
  if (t.dataset.copy && active) { cart[activeSlot()] = { ...cart[lastPicked] }; render(); }
  if (t.dataset.clear && active) { delete cart[activeSlot()]; render(); }
});

// ===== 카카오(다음) 주소 찾기 =====
const syncAddr = () => {
  const m = document.getElementById("addrMain").value.trim(), d = document.getElementById("addrDetail").value.trim();
  document.getElementById("addr").value = [m, d].filter(Boolean).join(" ");
};
document.getElementById("addrDetail").addEventListener("input", syncAddr);
const pcLayer = document.getElementById("pcLayer");
document.getElementById("pcClose").onclick = () => { pcLayer.style.display = "none"; };
document.getElementById("findAddr").onclick = () => {
  if (!window.daum || !daum.Postcode) { alert("주소 찾기를 불러오지 못했어요. 잠시 후 다시 눌러 주세요."); return; }
  pcLayer.style.display = "flex";
  const box = document.getElementById("pcBox"); box.innerHTML = "";
  new daum.Postcode({
    oncomplete: data => {
      let a = data.roadAddress || data.jibunAddress || data.address;
      const extra = [data.bname, data.buildingName].filter(Boolean).join(", ");
      if (data.roadAddress && extra) a += ` (${extra})`;
      document.getElementById("addrMain").value = a;
      pcLayer.style.display = "none";
      syncAddr();
      document.getElementById("addrDetail").focus();
    },
    width: "100%", height: "100%"
  }).embed(box);
};

// 이전에 신청한 정보 자동 채우기
if (me.phone) {
  ["phone", "name", "addr"].forEach(k => document.getElementById(k).value = me[k] || "");
  document.getElementById("addrMain").value = me.addrMain || me.addr || "";
  document.getElementById("addrDetail").value = me.addrDetail || "";
  const w = document.getElementById("welcome");
  w.style.display = "block";
  w.textContent = `${me.name || ""}님, 다시 오셨네요! 날짜만 골라서 신청하시면 돼요.`;
  const sb = document.getElementById("savedBox");
  sb.style.display = "block";
  const esc = x => String(x ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  sb.innerHTML = `👤 ${esc(me.name)}<br>📞 ${esc(me.phone)}<br>📍 ${esc(me.addr)}<br><button id="editInfo">정보 수정</button>`;
  document.getElementById("memo").value = me.memo || "";
  document.getElementById("infoForm").style.display = "none";
}

// ===== 식단 실시간 =====
onSnapshot(query(collection(db, "dosirakMenus"), where("date", ">=", ALL[0]), where("date", "<=", ALL[ALL.length - 1])), snap => {
  menus = {};
  snap.docs.forEach(d => { menus[d.id] = d.data(); });
  render();
}, () => {});

// ===== 가게 알림 받기 (화면이 열려 있는 동안) =====
const SEEN = "dosirak_seen";
let seen = {};
try { seen = JSON.parse(localStorage.getItem(SEEN) || "{}"); } catch {}
const queue = [];
function beep() {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    [0, .25].forEach(t => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(.25, ac.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + t + .2);
      o.start(ac.currentTime + t); o.stop(ac.currentTime + t + .2);
    });
  } catch {}
  try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch {}
}
function showAlarm(msg) {
  queue.push(msg);
  if (queue.length > 1) return;
  document.getElementById("alarmMsg").textContent = msg;
  document.getElementById("alarm").style.display = "flex";
  beep();
}
document.getElementById("alarmOk").onclick = () => {
  queue.shift();
  if (queue.length) { document.getElementById("alarmMsg").textContent = queue[0]; beep(); }
  else document.getElementById("alarm").style.display = "none";
};
function listen(id) {
  onSnapshot(doc(db, "subscriptions", id), snap => {
    if (!snap.exists()) return;
    const d = snap.data();
    live[id] = d;
    // 확인됨/대기 표시 실시간 반영
    (d.orders || []).forEach(o => { const k = slot(o.date, mealOf(o)); if (owner[k] === id) { if (d.status === "신청") pendingSlot[k] = true; else delete pendingSlot[k]; } });
    render();
    // 새 알림이 있으면 띄우기 (안 본 것만)
    const a = d.alarm;
    if (a && a.at && a.at > (seen[id] || 0)) {
      seen[id] = a.at;
      try { localStorage.setItem(SEEN, JSON.stringify(seen)); } catch {}
      showAlarm(a.msg || "가게에서 알림이 왔어요");
    }
  }, () => {});
}

// 예전에 신청한 내역 불러오기 → 개수 수정 가능
async function loadMine() {
  const keep = [];
  for (const id of me.subs) {
    try {
      const snap = await getDoc(doc(db, "subscriptions", id));
      if (!snap.exists()) { dbg.push(`${id.slice(0,6)}: 없음(삭제됨)`); continue; }
      const d = snap.data();
      dbg.push(`${id.slice(0,6)}: ${d.status} · ${(d.orders || []).map(o => o.date.slice(5)).join(",")}`);
      if (d.status === "종료") continue;
      keep.push(id);
      loaded.push({ id, ...d });
      live[id] = d;
    } catch (e) { keep.push(id); dbg.push(`${id.slice(0,6)}: 오류 ${e.code || e.message}`); }
  }
  for (const L of loaded) {
    (L.orders || []).forEach(o => {
      const m = mealOf(o), k = slot(o.date, m);
      if (!ALL.includes(o.date) || !canSlot(o.date, m)) return;
      owner[k] = owner[k] || L.id;
      if (L.status === "신청") pendingSlot[k] = true;
      cart[k] = cart[k] || {};
      o.items.forEach(i => { const id = nameToId[i.name]; if (id) cart[k][id] = (cart[k][id] || 0) + i.qty; });
    });
  }
  me.subs = keep;
  keep.forEach(listen);
  orig = snapCart();
  if (loaded.length) {
    const w = document.getElementById("welcome");
    w.textContent = `${me.name || ""}님, 신청하신 내역을 불러왔어요. 개수를 바꾸거나 날짜를 추가할 수 있어요.`;
  }
  render();
}

document.getElementById("submit").addEventListener("click", async () => {
  if (document.getElementById("addrMain").value.trim()) syncAddr();
  const v = id => document.getElementById(id).value.trim();
  if (!v("name") || !v("phone") || !v("addr")) { alert("연락처, 이름을 입력하고 🔍 주소 찾기로 주소를 골라 주세요."); return; }
  const btn = document.getElementById("submit");
  // 오늘 마감이 지난 식사를 새로 담았으면 막기 (화면을 오래 켜 둔 경우)
  const late = pickedSlots().filter(k => slotDate(k) === TODAY_STR && !owner[k] && !isOpenToday(slotMeal(k)));
  if (late.length) {
    const m = slotMeal(late[0]);
    alert(SAME_DAY[m] ? `오늘 ${m} 신청은 ${fmtTime(SAME_DAY[m])}까지예요. 가게로 전화해 주세요.` : `오늘 ${m}은 당일 신청이 안 돼요. 가게로 전화해 주세요.`);
    late.forEach(k => delete cart[k]);
    render(); return;
  }
  btn.disabled = true; btn.textContent = "보내는 중..."; btn.dataset.busy = "1";
  const mk = k => ({
    date: slotDate(k),
    items: MENUS.filter(m => cart[k] && cart[k][m.id]).map(m => ({ name: m.name, price: m.price, qty: cart[k][m.id] })),
    amount: slotMoney(k),
    ...(slotMeal(k) !== "점심" ? { meal: slotMeal(k) } : {})
  });
  const editable = o => ALL.includes(o.date) && canSlot(o.date, mealOf(o));
  const used = new Set();
  const info = { name: v("name"), addr: v("addr"), memo: v("memo") };
  try {
    // 1) 예전 신청서 수정
    for (const L of loaded) {
      const before = L.orders || [];
      const keepOld = before.filter(o => !editable(o));
      const mine = [...new Set(before.filter(editable).map(o => slot(o.date, mealOf(o))))]
        .filter(k => owner[k] === L.id && !used.has(k));
      mine.forEach(k => used.add(k));
      const future = mine.filter(k => slotCount(k)).map(mk);
      const orders = [...keepOld, ...future].sort(orderSort);
      if (JSON.stringify(orders) === JSON.stringify([...before].sort(orderSort))) continue;
      const sum = list => list.reduce((a, o) => a + o.amount, 0);
      if (!keepOld.length) {
        // 지난 주문이 없으면 그대로 고치고 다시 확인 대기로
        await updateDoc(doc(db, "subscriptions", L.id), {
          ...info, orders, total: sum(orders),
          status: orders.length ? "신청" : "종료", editedAt: serverTimestamp()
        });
        if (!orders.length) me.subs = me.subs.filter(x => x !== L.id);
      } else {
        // 지난 주문(이미 확인·배달된 것)은 그대로 두고, 바뀐 것만 새 신청으로 다시 확인받기
        await updateDoc(doc(db, "subscriptions", L.id), { orders: keepOld, total: sum(keepOld), status: L.status });
        me.subs = me.subs.filter(x => x !== L.id);
        if (future.length) {
          const ref = await addDoc(collection(db, "subscriptions"), {
            orders: future, phone: L.phone || v("phone"), ...info, total: sum(future),
            status: "신청", editedAt: serverTimestamp(), createdAt: serverTimestamp()
          });
          me.subs.push(ref.id);
        }
      }
    }
    // 2) 새로 고른 칸은 새 신청서로
    const fresh = pickedSlots().filter(k => !used.has(k) && !owner[k]);
    if (fresh.length) {
      const orders = fresh.map(mk).sort(orderSort);
      const ref = await addDoc(collection(db, "subscriptions"), {
        orders, phone: v("phone"), ...info,
        total: orders.reduce((a, o) => a + o.amount, 0),
        status: "신청", createdAt: serverTimestamp()
      });
      me.subs.push(ref.id);
      listen(ref.id);
    }
    me = { ...me, phone: v("phone"), ...info, addrMain: v("addrMain"), addrDetail: v("addrDetail"),
           booked: [...new Set([...me.booked, ...pickedSlots().map(slotDate)])].filter(d => d >= ymd(new Date())) };
    try { localStorage.setItem(LS, JSON.stringify(me)); } catch {}
    document.getElementById("form").style.display = "none";
    document.getElementById("bar").style.display = "none";
    document.getElementById("done").style.display = "block";
    window.scrollTo(0, 0);
    setTimeout(() => location.reload(), 1800);
  } catch (err) {
    alert("저장에 실패했어요. 잠시 후 다시 시도해 주세요.");
    delete btn.dataset.busy;
    render();
  }
});

render();
// 점검 모드: 주소 끝에 ?debug=1
const dbg = [];
function showDebug() {
  if (!location.search.includes("debug")) return;
  let b = document.getElementById("dbg");
  if (!b) { b = document.createElement("pre"); b.id = "dbg"; b.style.cssText = "margin:12px;padding:12px;background:#222;color:#0f0;font-size:12px;border-radius:10px;white-space:pre-wrap"; document.body.appendChild(b); }
  b.textContent = `[점검]\n이름: ${me.name || "-"} / 전화: ${me.phone || "-"}\n저장된 신청번호: ${me.subs.length}개\n` + (dbg.join("\n") || "(불러온 것 없음)");
}
if (me.subs.length) loadMine().then(showDebug); else showDebug();
