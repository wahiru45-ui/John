<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도시락 신청 관리</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; background: #f2f2f2; color: #222; padding-bottom: 30px; }
  header { background: #333; color: #fff; padding: 16px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 19px; }
  header button { background: none; border: 1px solid #888; color: #fff; padding: 6px 10px; border-radius: 8px; }
  .login { max-width: 360px; margin: 60px auto; background: #fff; padding: 24px; border-radius: 14px; }
  .login input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; }
  .login button { width: 100%; padding: 14px; background: #d9532b; color: #fff; border: none; border-radius: 10px; font-size: 16px; }
  .box { margin: 12px; background: #fff; border-radius: 12px; padding: 14px; font-size: 15px; }
  .box.day { background: #fff3e8; }
  .box.all { background: #eef5ff; }
  .daynav { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .daynav button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid #ccc; background: #fff; font-size: 18px; }
  .daynav input { flex: 1; padding: 9px; border: 1px solid #ccc; border-radius: 10px; font-size: 16px; }
  .stitle { font-weight: 700; margin-bottom: 6px; }
  .sline { display: flex; justify-content: space-between; padding: 3px 0; }
  .total2 { border-top: 1px solid #ddd; margin-top: 4px; padding-top: 6px; font-weight: 700; }
  .deliv { border-top: 1px dashed #e3c3ad; margin-top: 10px; padding-top: 8px; }
  .dv { padding: 6px 0; border-bottom: 1px solid #f3e1d4; font-size: 14px; }
  .dv:last-child { border-bottom: none; }
  .dv .dn { font-weight: 700; }
  .dv .da { color: #666; }
  .dlv { margin-top: 6px; width: 100%; padding: 10px; border-radius: 10px; border: none; background: #2a8a4a; color: #fff; font-size: 15px; font-weight: 700; }
  .dv .btns button { padding: 9px 4px; }
  .dlv.done { background: #fff; color: #2a8a4a; border: 1px solid #2a8a4a; font-weight: 600; }
  .pend { color: #d9532b; font-size: 13px; margin-top: 6px; }
  .tabs { display: flex; gap: 8px; padding: 0 12px 12px; overflow-x: auto; }
  .tab { padding: 8px 14px; border-radius: 18px; border: 1px solid #ccc; background: #fff; white-space: nowrap; font-size: 15px; }
  .tab.on { background: #333; color: #fff; border-color: #333; }
  .card { background: #fff; margin: 0 12px 12px; border-radius: 12px; padding: 14px; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .top .nm { font-size: 17px; font-weight: 700; }
  .top .ct { font-weight: 700; color: #d9532b; }
  .row { font-size: 14px; color: #555; margin: 3px 0; }
  .row a { color: #1a6ad1; }
  .sub { border: 1px solid #eee; border-radius: 10px; padding: 10px; margin-top: 10px; }
  .shead { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #888; margin-bottom: 6px; }
  .badge { font-size: 12px; padding: 3px 9px; border-radius: 12px; color: #fff; }
  .신청 { background: #d9532b; } .진행중 { background: #2a8a4a; } .종료 { background: #999; }
  .od { display: flex; justify-content: space-between; font-size: 14px; padding: 3px 0; }
  .od.past { color: #aaa; }
  .od b { white-space: nowrap; margin-left: 8px; }
  .btns { display: flex; gap: 8px; margin-top: 8px; }
  .btns button { flex: 1; padding: 9px; border-radius: 8px; border: 1px solid #ccc; background: #fff; font-size: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; margin: 6px 0 4px; }
  th, td { padding: 6px 4px; border-bottom: 1px solid #dde6f3; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  th { color: #666; font-weight: 600; font-size: 13px; }
  tr.tot td { font-weight: 700; border-top: 2px solid #b9c9e0; border-bottom: none; }
  .gap { height: 14px; }
  .ed { background: #fffbe8; border-color: #f0d98a; }
  .ed label { display: block; font-size: 13px; color: #777; margin: 8px 0 4px; }
  .ed input { width: 100%; padding: 9px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; font-family: inherit; }
  .edday { border-top: 1px dashed #e6d48f; margin-top: 10px; padding-top: 8px; }
  .edhead { display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
  .edhead button { padding: 5px 10px; border-radius: 8px; border: 1px solid #e0a0a0; background: #fff; color: #c33; font-size: 13px; }
  .edm { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 14px; }
  .edm .q { display: flex; align-items: center; gap: 8px; }
  .edm .q button { width: 30px; height: 30px; border-radius: 50%; border: 1px solid #ccc; background: #fff; font-size: 16px; }
  .edm .q span { min-width: 18px; text-align: center; font-weight: 700; }
  .addday { display: flex; gap: 8px; margin-top: 10px; }
  .addday input { flex: 1; }
  .addday button { padding: 8px 12px; border-radius: 8px; border: 1px solid #ccc; background: #fff; }
  .btns .del { color: #c33; border-color: #e0a0a0; }
  .btns .save { background: #2a8a4a; color: #fff; border-color: #2a8a4a; }
  .addbtn { width: 100%; padding: 14px; border-radius: 12px; border: none; background: #d9532b; color: #fff; font-size: 16px; font-weight: 700; }
  .ed select { width: 100%; padding: 9px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; background: #fff; }
  .nav { position: sticky; top: 0; z-index: 10; display: flex; gap: 6px; padding: 10px 12px; background: #f2f2f2; }
  .nav button { flex: 1; padding: 12px 4px; border-radius: 12px; border: 1px solid #ccc; background: #fff; font-size: 15px; font-weight: 700; position: relative; }
  .nav button.on { background: #333; color: #fff; border-color: #333; }
  .nav .nb { position: absolute; top: -6px; right: -4px; background: #d9532b; color: #fff; font-size: 12px; border-radius: 10px; padding: 1px 7px; }
  .search { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 12px; font-size: 15px; }
  .chead { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .chead .nm { font-size: 17px; font-weight: 700; }
  .chead .info { font-size: 13px; color: #888; margin-top: 3px; }
  .chead .right { text-align: right; }
  .chead .ct { font-weight: 700; color: #d9532b; display: block; }
  .chead .arrow { font-size: 12px; color: #999; }
  .mini { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 10px; color: #fff; margin-left: 4px; vertical-align: middle; }
  details.past { margin: 4px 0; font-size: 13px; color: #999; }
  details.past summary { cursor: pointer; padding: 3px 0; }
  details.cust summary { cursor: pointer; font-weight: 700; padding: 4px 0; }
  .empty { text-align: center; color: #999; padding: 40px; }
</style>
</head>
<body>
<header><h1>🍱 도시락 신청 관리</h1><button id="logout" style="display:none">로그아웃</button></header>

<div class="login" id="login">
  <input id="email" type="email" placeholder="이메일">
  <input id="pw" type="password" placeholder="비밀번호">
  <button id="loginBtn">로그인</button>
</div>

<div id="app" style="display:none">
  <div class="nav" id="nav">
    <button data-view="day" class="on">📦 배달</button>
    <button data-view="list">📋 주문<span id="waitBadge"></span></button>
    <button data-view="week">📊 정산</button>
  </div>
  <div id="vDay">
  <div class="box day">
    <div class="daynav">
      <button id="prev">◀</button>
      <input type="date" id="pickDay">
      <button id="next">▶</button>
    </div>
    <div id="daySum"></div>
  </div>
  </div>
  <div id="vWeek" style="display:none">
  <div class="box all">
    <div class="daynav">
      <button id="wPrev">◀</button>
      <div id="wTitle" style="flex:1;text-align:center;font-weight:700"></div>
      <button id="wNext">▶</button>
    </div>
    <div id="allSum"></div>
  </div>
  </div>
  <div id="vList" style="display:none">
  <div style="margin:12px"><button id="addNew" class="addbtn">➕ 전화·문자 주문 직접 추가</button></div>
  <div id="newBox"></div>
  <div style="margin:0 12px 10px"><input id="q" class="search" placeholder="🔍 이름·전화번호·주소로 찾기"></div>
  <div class="tabs" id="tabs"></div>
  <div id="list"></div>
  </div>
</div>

<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyC2zCKXtWxY9vgHf2bS_L1bvuXUUvKQpSA",
  authDomain: "house-order-a689f.firebaseapp.com",
  projectId: "house-order-a689f",
  storageBucket: "house-order-a689f.firebasestorage.app",
  messagingSenderId: "621901289473",
  appId: "1:621901289473:web:952c5951744cd9f5b40800"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc, deleteDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const WD = ["일", "월", "화", "수", "목", "금", "토"];
const won = n => (n || 0).toLocaleString("ko-KR") + "원";
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const label = s => { const d = new Date(s + "T00:00"); return `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})`; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const TODAY = ymd(new Date());

const MENUS = [
  { name: "발열도시락",   price: 7500 },
  { name: "보온도시락",   price: 6600 },
  { name: "샐러드도시락", price: 6600 },
  { name: "5찬+국+특식",  price: 10400 },
];
// 배달 완료 문자 내용 ({이름} 자리에 손님 이름이 들어가요)
const ARRIVE_MSG = "{이름}님, 주문하신 도시락이 도착했어요 🍱 맛있게 드세요!";
// 주문 확인 문자 내용 ({이름}, {내역} 자리에 자동으로 들어가요)
const CONFIRM_MSG = "{이름}님, 정기 도시락 주문이 확인됐어요 ✅\n{내역}\n감사합니다!";
// 손님 화면 알람 내용
const ALARM_CONFIRM = "{이름}님, 주문이 확인됐어요 ✅";
const ALARM_ARRIVE = "{이름}님, 도시락이 도착했어요 🍱\n맛있게 드세요!";
const TABS = ["전체", "신청", "진행중", "종료"];
let editing = null;   // 수정 중인 신청 id
let view = "day";      // day | week | list
let q = "";            // 검색어
const open = {};       // 펼쳐진 손님 (전화번호)
let draft = null;     // 수정 중인 내용
let tab = "전체";
let subs = [];
let unsub = null;
let day = TODAY;

// 예전 방식(요일+주) 신청도 날짜별로 바꿔서 보여줌
function normalize(s) {
  if (Array.isArray(s.orders)) return s;
  const orders = [];
  if (s.start && s.days && s.weeks) {
    const st = new Date(s.start + "T00:00");
    for (let i = 0; i < s.weeks * 7; i++) {
      const d = new Date(st); d.setDate(st.getDate() + i);
      if (s.days.includes(WD[d.getDay()]))
        orders.push({ date: ymd(d), items: s.items, amount: s.items.reduce((a, x) => a + x.price * x.qty, 0) });
    }
  }
  return { ...s, orders };
}

document.getElementById("loginBtn").onclick = async () => {
  try {
    await signInWithEmailAndPassword(auth, document.getElementById("email").value, document.getElementById("pw").value);
  } catch { alert("로그인 실패. 이메일/비밀번호를 확인해 주세요."); }
};
document.getElementById("logout").onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  document.getElementById("login").style.display = user ? "none" : "block";
  document.getElementById("app").style.display = user ? "block" : "none";
  document.getElementById("logout").style.display = user ? "block" : "none";
  if (user && !unsub) {
    unsub = onSnapshot(query(collection(db, "subscriptions"), orderBy("createdAt", "desc")), snap => {
      subs = snap.docs.map(d => normalize({ id: d.id, ...d.data() }));
      render();
    }, err => { document.getElementById("list").innerHTML = `<div class="empty">불러오기 실패: ${esc(err.message)}</div>`; });
  }
  if (!user && unsub) { unsub(); unsub = null; }
});

// 날짜 고르기
const pick = document.getElementById("pickDay");
pick.value = day;
pick.onchange = () => { day = pick.value || TODAY; render(); };
const move = n => { const d = new Date(day + "T00:00"); d.setDate(d.getDate() + n); day = ymd(d); pick.value = day; render(); };
document.getElementById("prev").onclick = () => move(-1);
document.getElementById("next").onclick = () => move(1);

function countUp(list) {
  const count = {}; let boxes = 0, money = 0;
  list.forEach(o => o.items.forEach(i => {
    count[i.name] = (count[i.name] || 0) + i.qty; boxes += i.qty; money += i.price * i.qty;
  }));
  return { count, boxes, money };
}
const lines = r => (Object.entries(r.count).map(([k, v]) => `<div class="sline">${k}<span><b>${v}개</b></span></div>`).join("") || '<div class="sline">없음</div>')
  + `<div class="sline total2">합계<span>${r.boxes}개 · ${won(r.money)}</span></div>`;

// 선택한 날 배달 (진행중만)
function daySummary() {
  const rows = [];
  let pending = 0;
  subs.forEach(s => s.orders.filter(o => o.date === day).forEach(o => {
    if (s.status === "진행중") rows.push({ s, o });
    if (s.status === "신청") pending++;
  }));
  const r = countUp(rows.map(x => x.o));
  const who = rows.map(({ s, o }) => `
    <div class="dv"><span class="dn">${esc(s.name)}</span> · ${o.items.map(i => `${esc(i.name)} ${i.qty}`).join(", ")}
    <div class="da">📍 ${esc(s.addr)}${s.memo ? ` · 📝 ${esc(s.memo)}` : ""}</div>
    <div class="btns">
      ${o.delivered
        ? `<button class="dlv done" style="margin:0" disabled>✅ 배달 완료됨</button>`
        : `<button class="dlv" style="margin:0" data-arrive="${s.id}" data-date="${o.date}">🚚 배달 완료</button>`}
      <button data-alarm="${s.id}" data-kind="arrive">🔔 알람${s.alarm?.kind === "arrive" && s.alarm?.date === o.date ? " ✓" : ""}</button>
      <button data-sms="${s.id}" data-kind="arrive">💬 문자</button>
    </div>
    </div>`).join("");
  return `<div class="stitle">📦 ${label(day)}${day === TODAY ? " 오늘" : ""} 배달 · ${rows.length}곳</div>
    ${lines(r)}
    ${who ? `<div class="deliv">${who}</div>` : ""}
    ${pending ? `<div class="pend">⚠️ 이 날짜에 아직 확인 안 한 신청이 ${pending}건 있어요</div>` : ""}`;
}

// 주간 정산 (월~일)
const monOf = s => { const d = new Date(s + "T00:00"); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ymd(d); };
let weekMon = monOf(TODAY);
let custOpen = false;
document.addEventListener("toggle", e => { if (e.target.id === "custDet") custOpen = e.target.open; }, true);
const weekDates = () => [...Array(7)].map((_, i) => { const d = new Date(weekMon + "T00:00"); d.setDate(d.getDate() + i); return ymd(d); });
const moveWeek = n => { const d = new Date(weekMon + "T00:00"); d.setDate(d.getDate() + n * 7); weekMon = ymd(d); render(); };
document.getElementById("wPrev").onclick = () => moveWeek(-1);
document.getElementById("wNext").onclick = () => moveWeek(1);

function allSummary() {
  const W = weekDates();
  document.getElementById("wTitle").textContent = `📊 주간 정산 ${label(W[0])} ~ ${label(W[6])}`;
  const ok = subs.filter(s => s.status === "진행중");
  const inWeek = s => s.orders.filter(o => W.includes(o.date));

  // 요일별
  const dayRows = W.map(d => {
    const r = countUp(ok.flatMap(s => s.orders.filter(o => o.date === d)));
    return `<tr><td>${label(d)}</td><td>${r.boxes}개</td><td>${won(r.money)}</td></tr>`;
  }).join("");
  const all = countUp(ok.flatMap(inWeek));

  // 메뉴별
  const menuRows = Object.entries(all.count).map(([k, v]) => {
    const price = ok.flatMap(inWeek).flatMap(o => o.items).find(i => i.name === k)?.price || 0;
    return `<tr><td>${k}</td><td>${v}개</td><td>${won(v * price)}</td></tr>`;
  }).join("");

  // 손님별 (전화번호 기준)
  const per = {};
  ok.forEach(s => inWeek(s).forEach(o => {
    const p = per[s.phone] = per[s.phone] || { name: s.name, days: new Set(), boxes: 0, money: 0 };
    p.days.add(o.date); o.items.forEach(i => p.boxes += i.qty); p.money += o.amount;
  }));
  const custRows = Object.values(per).sort((a, b) => b.money - a.money)
    .map(p => `<tr><td>${esc(p.name)}</td><td>${p.days.size}일 · ${p.boxes}개</td><td>${won(p.money)}</td></tr>`).join("");

  const wait = countUp(subs.filter(s => s.status === "신청").flatMap(inWeek));

  return `
    <div class="stitle">요일별</div>
    <table><tr><th>날짜</th><th>개수</th><th>금액</th></tr>${dayRows}
    <tr class="tot"><td>합계</td><td>${all.boxes}개</td><td>${won(all.money)}</td></tr></table>
    <div class="gap"></div>
    <div class="stitle">메뉴별</div>
    <table><tr><th>메뉴</th><th>개수</th><th>금액</th></tr>${menuRows || '<tr><td colspan="3">없음</td></tr>'}</table>
    <div class="gap"></div>
    <details class="cust" ${custOpen ? "open" : ""} id="custDet">
    <summary>손님별 정산 · ${Object.keys(per).length}명 · ${won(all.money)} (눌러서 보기)</summary>
    <table><tr><th>손님</th><th>받는 날</th><th>금액</th></tr>${custRows || '<tr><td colspan="3">없음</td></tr>'}
    <tr class="tot"><td>${Object.keys(per).length}명</td><td></td><td>${won(all.money)}</td></tr></table>
    </details>
    ${wait.boxes ? `<div class="pend">⚠️ 이 주에 아직 확인 안 한 신청: ${wait.boxes}개 · ${won(wait.money)} (정산에 미포함)</div>` : ""}`;
}

function render() {
  ["day", "week", "list"].forEach(v => document.getElementById("v" + v[0].toUpperCase() + v.slice(1)).style.display = v === view ? "block" : "none");
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.view === view));
  const waitN = subs.filter(s => s.status === "신청").length;
  document.getElementById("waitBadge").innerHTML = waitN ? `<span class="nb">${waitN}</span>` : "";
  if (view === "day") document.getElementById("daySum").innerHTML = daySummary();
  if (view === "week") document.getElementById("allSum").innerHTML = allSummary();

  document.getElementById("tabs").innerHTML = TABS.map(t => {
    const n = t === "전체" ? subs.length : subs.filter(s => s.status === t).length;
    const nm = { 신청: "확인 대기", 진행중: "확인됨", 종료: "취소/종료" }[t] || t;
    return `<button class="tab ${t === tab ? "on" : ""}" data-tab="${t}">${nm} ${n}</button>`;
  }).join("");

  // 손님(전화번호)별로 묶기
  const kw = q.trim().replace(/-/g, "");
  const shown = (tab === "전체" ? subs : subs.filter(s => s.status === tab))
    .filter(s => !kw || [s.name, s.phone, s.addr].some(x => String(x || "").replace(/-/g, "").includes(kw)));
  const groups = {};
  shown.forEach(s => { (groups[s.phone] = groups[s.phone] || []).push(s); });

  document.getElementById("newBox").innerHTML = editing === "new" ? `<div style="margin:0 12px 12px">${editView()}</div>` : "";
  document.getElementById("addNew").style.display = editing === "new" ? "none" : "block";

  const BADGE = { 신청: "확인 대기", 진행중: "확인됨", 종료: "취소/종료" };
  const COLOR = { 신청: "#d9532b", 진행중: "#2a8a4a", 종료: "#999" };
  // 확인 대기 손님을 맨 위로
  const list = Object.values(groups).sort((a, b) => (b.some(s => s.status === "신청") ? 1 : 0) - (a.some(s => s.status === "신청") ? 1 : 0));
  document.getElementById("list").innerHTML = list.map(g => {
    const f = g[0];
    const live = g.filter(s => s.status !== "종료");
    const sum = live.reduce((a, s) => a + s.orders.reduce((b, o) => b + o.amount, 0), 0);
    const next = live.flatMap(s => s.orders.map(o => o.date)).filter(d => d >= TODAY).sort()[0];
    const waiting = g.filter(s => s.status === "신청").length;
    const isOpen = open[f.phone] || g.some(s => s.id === editing);
    return `
    <div class="card">
      <div class="chead" data-open="${esc(f.phone)}">
        <div>
          <span class="nm">${esc(f.name)}</span>${waiting ? `<span class="mini" style="background:${COLOR.신청}">확인 대기 ${waiting}</span>` : ""}
          <div class="info">${next ? `다음 배달 ${label(next)}` : "남은 배달 없음"} · 신청 ${g.length}건</div>
        </div>
        <div class="right"><span class="ct">${won(sum)}</span><span class="arrow">${isOpen ? "접기 ▲" : "자세히 ▼"}</span></div>
      </div>
      ${!isOpen ? "" : `
      <div class="row" style="margin-top:8px">📞 <a href="tel:${esc(f.phone)}">${esc(f.phone)}</a></div>
      <div class="row">📍 ${esc(f.addr)}</div>
      ${g.map(s => {
        if (editing === s.id) return editView();
        const up = s.orders.filter(o => o.date >= TODAY), past = s.orders.filter(o => o.date < TODAY);
        const line = o => `<div class="od ${o.date < TODAY ? "past" : ""}"><span>${label(o.date)} ${o.items.map(i => `${esc(i.name)} ${i.qty}`).join(", ")}${o.delivered ? " ✅" : ""}</span><b>${won(o.amount)}</b></div>`;
        return `
        <div class="sub">
          <div class="shead">
            <span>${s.createdAt?.toDate ? s.createdAt.toDate().toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) + " 신청" : ""}${s.by ? " · 직접 추가" : ""}</span>
            <span class="badge ${s.status}">${BADGE[s.status] || s.status}</span>
          </div>
          ${s.editedAt && s.status === "신청" ? `<div class="row" style="color:#d9532b;font-weight:700">✏️ 손님이 개수를 수정했어요 → 다시 확인해 주세요</div>` : ""}
          ${s.memo ? `<div class="row">📝 ${esc(s.memo)}</div>` : ""}
          ${up.map(line).join("") || `<div class="row">남은 배달 없음</div>`}
          ${past.length ? `<details class="past"><summary>지난 날짜 ${past.length}개 보기</summary>${past.map(line).join("")}</details>` : ""}
          <div class="od" style="font-weight:700;border-top:1px solid #eee;margin-top:4px;padding-top:6px"><span>총 ${s.orders.length}일</span><b>${won(s.orders.reduce((a, o) => a + o.amount, 0))}</b></div>
          <div class="btns">
            ${s.status !== "진행중" ? `<button data-id="${s.id}" data-st="진행중">✅ 확인</button>` : ""}
            <button data-sms="${s.id}" data-kind="confirm">💬 문자</button>
          </div>
          <div class="btns">
            <button data-edit="${s.id}">✏️ 수정</button>
            <button class="del" data-del="${s.id}">🗑 삭제</button>
          </div>
        </div>`;
      }).join("")}`}
    </div>`;
  }).join("") || `<div class="empty">${kw ? "찾는 손님이 없어요" : "신청이 없어요"}</div>`;
}

// ===== 수정 화면 =====
function editView() {
  const d = draft;
  const days = [...d.orders].sort((a, b) => a.date < b.date ? -1 : 1);
  const total = days.reduce((a, o) => a + MENUS.reduce((b, m) => b + m.price * (o.q[m.name] || 0), 0), 0);
  return `
  <div class="sub ed">
    <div class="stitle">${editing === "new" ? "➕ 직접 주문 추가" : "✏️ 신청 수정"}</div>
    ${editing === "new" && customers().length ? `<label>기존 손님 불러오기</label>
      <select id="pickCust"><option value="">새 손님 (직접 입력)</option>
      ${customers().map(c => `<option value="${esc(c.phone)}">${esc(c.name)} · ${esc(c.phone)}</option>`).join("")}</select>` : ""}
    <label>이름</label><input data-f="name" value="${esc(d.name)}">
    <label>연락처</label><input data-f="phone" value="${esc(d.phone)}">
    <label>주소</label><input data-f="addr" value="${esc(d.addr)}">
    <label>요청사항</label><input data-f="memo" value="${esc(d.memo)}">
    ${days.map(o => `
      <div class="edday">
        <div class="edhead"><span>${label(o.date)}</span><button data-rmday="${o.date}">이 날 빼기</button></div>
        ${MENUS.map(m => `
          <div class="edm"><span>${m.name}</span>
            <div class="q"><button data-dd="${o.date}" data-mn="${m.name}" data-v="-1">−</button>
            <span>${o.q[m.name] || 0}</span>
            <button data-dd="${o.date}" data-mn="${m.name}" data-v="1">+</button></div>
          </div>`).join("")}
      </div>`).join("")}
    <div class="addday"><input type="date" id="newDay"><button data-addday="1">날짜 추가</button></div>
    <div class="od" style="font-weight:700;margin-top:10px"><span>합계</span><b>${won(total)}</b></div>
    <div class="btns">
      <button data-cancel="1">닫기</button>
      <button class="save" data-save="1">저장</button>
    </div>
  </div>`;
}

// 전화번호별 손님 목록 (가장 최근 정보)
function customers() {
  const m = {};
  subs.forEach(s => { if (s.phone && !m[s.phone]) m[s.phone] = { name: s.name, phone: s.phone, addr: s.addr, memo: s.memo }; });
  return Object.values(m);
}
function startNew() {
  draft = { name: "", phone: "", addr: "", memo: "", orders: [] };
  editing = "new"; view = "list"; render();
  document.getElementById("newBox").scrollIntoView({ behavior: "smooth" });
}

function startEdit(id) {
  const s = subs.find(x => x.id === id);
  draft = {
    name: s.name || "", phone: s.phone || "", addr: s.addr || "", memo: s.memo || "",
    orders: s.orders.map(o => ({ date: o.date, delivered: !!o.delivered, q: Object.fromEntries(o.items.map(i => [i.name, i.qty])) }))
  };
  editing = id; render();
}

async function saveEdit() {
  const orders = draft.orders
    .map(o => {
      const items = MENUS.filter(m => o.q[m.name] > 0).map(m => ({ name: m.name, price: m.price, qty: o.q[m.name] }));
      return { date: o.date, items, amount: items.reduce((a, i) => a + i.price * i.qty, 0), ...(o.delivered ? { delivered: true } : {}) };
    })
    .filter(o => o.items.length)
    .sort((a, b) => a.date < b.date ? -1 : 1);
  if (!orders.length) { alert(editing === "new" ? "날짜를 추가하고 도시락 개수를 골라 주세요." : "도시락이 하나도 없어요. 신청을 지우려면 '삭제'를 눌러 주세요."); return; }
  if (editing === "new") {
    if (!draft.name.trim() || !draft.phone.trim()) { alert("이름과 연락처를 입력해 주세요."); return; }
    try {
      await addDoc(collection(db, "subscriptions"), {
        name: draft.name.trim(), phone: draft.phone.trim(), addr: draft.addr.trim(), memo: draft.memo.trim(),
        orders, total: orders.reduce((a, o) => a + o.amount, 0),
        status: "진행중", by: "사장님 직접 추가", createdAt: serverTimestamp()
      });
      editing = null; draft = null; render();
      alert("추가했어요 ✅");
    } catch (err) { alert("저장 실패: " + err.message); }
    return;
  }
  try {
    await updateDoc(doc(db, "subscriptions", editing), {
      name: draft.name.trim(), phone: draft.phone.trim(), addr: draft.addr.trim(), memo: draft.memo.trim(),
      orders, total: orders.reduce((a, o) => a + o.amount, 0)
    });
    editing = null; draft = null; render();
  } catch (err) { alert("저장 실패: " + err.message); }
}

document.addEventListener("change", e => {
  if (e.target.id === "pickCust" && draft) {
    const c = customers().find(x => x.phone === e.target.value);
    Object.assign(draft, c ? { name: c.name || "", phone: c.phone || "", addr: c.addr || "", memo: c.memo || "" } : { name: "", phone: "", addr: "", memo: "" });
    render();
    const sel = document.getElementById("pickCust"); if (sel) sel.value = c ? c.phone : "";
  }
});

document.addEventListener("click", e => {
  const h = e.target.closest(".chead");
  if (h && !e.target.closest("button, a")) { open[h.dataset.open] = !open[h.dataset.open]; render(); }
});

document.addEventListener("input", e => {
  if (e.target.id === "q") { q = e.target.value; render(); return; }
  if (draft && e.target.dataset.f) draft[e.target.dataset.f] = e.target.value;
});

document.addEventListener("click", async e => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; render(); }
  if (t.id === "addNew") { startNew(); return; }
  if (t.dataset.view) { view = t.dataset.view; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.arrive) {
    const s = subs.find(x => x.id === t.dataset.arrive);
    if (!s) return;
    const orders = s.orders.map(o => o.date === t.dataset.date ? { ...o, delivered: true } : o);
    try { await updateDoc(doc(db, "subscriptions", s.id), { orders }); }
    catch (err) { alert("완료 표시 저장 실패: " + err.message); }
  }
  if (t.dataset.st) {
    await updateDoc(doc(db, "subscriptions", t.dataset.id), { status: t.dataset.st });
  }
  if (t.dataset.alarm) {
    const s = subs.find(x => x.id === t.dataset.alarm);
    if (!s) return;
    const kind = t.dataset.kind;
    const msg = (kind === "arrive" ? ALARM_ARRIVE : ALARM_CONFIRM).replace("{이름}", s.name || "고객");
    try {
      await updateDoc(doc(db, "subscriptions", s.id), { alarm: { msg, kind, date: kind === "arrive" ? day : null, at: Date.now() } });
      alert("손님 화면으로 알람을 보냈어요 🔔\n(손님이 화면을 열면 바로 떠요)");
    } catch (err) { alert("알람 보내기 실패: " + err.message); }
  }
  if (t.dataset.sms) {
    const s = subs.find(x => x.id === t.dataset.sms);
    if (!s || !s.phone) return;
    let msg;
    if (t.dataset.kind === "arrive") msg = ARRIVE_MSG.replace("{이름}", s.name || "고객");
    else {
      const list = s.orders.map(o => `${label(o.date)} ${o.items.map(i => `${i.name} ${i.qty}`).join(", ")}`).join("\n");
      msg = CONFIRM_MSG.replace("{이름}", s.name || "고객").replace("{내역}", list);
    }
    location.href = `sms:${s.phone.replace(/[^0-9]/g, "")}?body=${encodeURIComponent(msg)}`;
  }
  if (t.dataset.edit) startEdit(t.dataset.edit);
  if (t.dataset.cancel) { editing = null; draft = null; render(); }
  if (t.dataset.save) saveEdit();
  if (t.dataset.dd) {
    const o = draft.orders.find(x => x.date === t.dataset.dd);
    o.q[t.dataset.mn] = Math.max(0, (o.q[t.dataset.mn] || 0) + Number(t.dataset.v));
    render();
  }
  if (t.dataset.rmday) { draft.orders = draft.orders.filter(x => x.date !== t.dataset.rmday); render(); }
  if (t.dataset.addday) {
    const v = document.getElementById("newDay").value;
    if (!v) { alert("추가할 날짜를 골라 주세요."); return; }
    if (draft.orders.some(x => x.date === v)) { alert("이미 있는 날짜예요."); return; }
    draft.orders.push({ date: v, q: {} }); render();
  }
  if (t.dataset.del) {
    const s = subs.find(x => x.id === t.dataset.del);
    if (!confirm(`${s?.name || ""}님의 이 신청을 완전히 삭제할까요?\n삭제하면 되돌릴 수 없어요.`)) return;
    try { await deleteDoc(doc(db, "subscriptions", t.dataset.del)); }
    catch (err) { alert("삭제 실패: Firebase 규칙에 delete 권한이 있는지 확인해 주세요."); }
  }
});
</script>
</body>
</html>
