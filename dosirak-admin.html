<script type="module">
const firebaseConfig = {

const WD = ["일", "월", "화", "수", "목", "금", "토"];
const won = n => (n || 0).toLocaleString("ko-KR") + "원";
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const label = s => { const d = new Date(s + "T00:00"); return `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})`; };
// 주소 → 카카오맵 검색 (앱이 있으면 앱으로, 없으면 웹으로 열려요)
const mapUrl = a => "https://map.kakao.com/link/search/" + encodeURIComponent(String(a || "").replace(/\s*\(.*?\)\s*/g, " ").trim());
// 손님 구분: 전화번호 + 이름 (전화번호를 0000처럼 대충 넣어도 이름이 다르면 다른 손님)
const custKey = s => String(s.phone || "").replace(/[^0-9]/g, "") + "|" + String(s.name || "").trim();
// 식사 시간: 없으면 점심
const MEALS = ["아침", "점심", "저녁"];
const mealOf = o => o.meal || "점심";
// 주소에서 동 이름 뽑기: "(화정동)", "농성동 유탑", "쌍촌동1325" → 화정동/농성동/쌍촌동. 없으면 "기타"
const dongOf = a => {
  const m = String(a || "").match(/\(([가-힣0-9]+동)[,)]/) || String(a || "").match(/([가-힣]+[0-9]*동)(?=[^가-힣]|$)/);
  return m ? m[1].replace(/[0-9]+동$/, "동") : "기타";
};
const mealTag = o => `<span class="mtag m${MEALS.indexOf(mealOf(o))}">${mealOf(o)}</span>`;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const TODAY = ymd(new Date());

const MENUS = [
  { name: "발열도시락",   price: 7500 },
  { name: "보온도시락",   price: 6600 },
  { name: "샐러드도시락", price: 6600 },

];

const ARRIVE_MSG = "{이름}님, 주문하신 도시락이 도착했어요 🍱 맛있게 드세요!";
// 주문 확인 문자 내용 ({이름}, {내역} 자리에 자동으로 들어가요)
const CONFIRM_MSG = "{이름}님, 정기 도시락 주문이 확인됐어요 ✅\n{내역}\n감사합니다!";
// 손님 화면 알람 내용
const ALARM_CONFIRM = "{이름}님, 주문이 확인됐어요 ✅";
const ALARM_ARRIVE = "{이름}님, 도시락이 도착했어요 🍱\n맛있게 드세요!";
const TABS = ["전체", "신청", "진행중", "종료"];
let editing = null;   // 수정 중인 신청 id
let view = "day";      // day | week | list
let q = "";            // 검색어
const open = {};       // 펼쳐진 손님 (전화번호)
let draft = null;
let uidSeq = 0;      // 수정 화면에서 날짜·식사 칸을 구분하는 번호     // 수정 중인 내용
let tab = "전체";
let subs = [];
let unsub = null;
let day = TODAY;

// 예전 방식(요일+주) 신청도 날짜별로 바꿔서 보여줌
function normalize(s) {
  if (Array.isArray(s.orders)) return s;
  const orders = [];
  if (s.start && s.days && s.weeks) {
    const st = new Date(s.start + "T00:00");
    for (let i = 0; i < s.weeks * 7; i++) {
      const d = new Date(st); d.setDate(st.getDate() + i);
      if (s.days.includes(WD[d.getDay()]))
        orders.push({ date: ymd(d), items: s.items, amount: s.items.reduce((a, x) => a + x.price * x.qty, 0) });
    }
  }
  return { ...s, orders };
}

  "auth/user-disabled": "이 계정이 사용 중지돼 있어요."

function countUp(list) {
  const count = {}; let boxes = 0, money = 0;
  list.forEach(o => o.items.forEach(i => {
    count[i.name] = (count[i.name] || 0) + i.qty; boxes += i.qty; money += i.price * i.qty;
  }));
  return { count, boxes, money };
}
const lines = r => (Object.entries(r.count).map(([k, v]) => `<div class="sline">${k}<span><b>${v}개</b></span></div>`).join("") || '<div class="sline">없음</div>')
  + `<div class="sline total2">합계<span>${r.boxes}개 · ${won(r.money)}</span></div>`;

// ===== 식단 =====
let menus = {};          // 날짜 → {main, soup}
let menuDraft = {};      // 고치는 중인 값
let menuMon = (() => { const d = new Date(TODAY + "T00:00"); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ymd(d); })();
let menuUnsub = null;
const addDays = (s, n) => { const d = new Date(s + "T00:00"); d.setDate(d.getDate() + n); return ymd(d); };
const menuWeek = () => [...Array(7)].map((_, i) => addDays(menuMon, i));
function watchMenus() {
  if (menuUnsub) return;
  menuUnsub = onSnapshot(collection(db, "dosirakMenus"), snap => {
    menus = {};
    snap.docs.forEach(d => { menus[d.id] = d.data(); });
    if (view === "day") render();
    if (view === "menu" && !Object.keys(menuDraft).length) renderMenu();
    document.getElementById("menuErr").style.display = "none";
  }, err => {
    document.getElementById("menuErr").style.display = "block";
    document.getElementById("menuErr").textContent = "⚠️ 식단을 불러오지 못했어요 (" + (err.code || err.message) + "). Firebase 규칙에 식단(dosirakMenus) 부분이 빠졌는지 확인해 주세요.";
  });
}
function val(date, key) {
  if (menuDraft[date] && key in menuDraft[date]) return menuDraft[date][key];
  return (menus[date] && menus[date][key]) || "";
}
function renderMenu() {
  const W = menuWeek();
  document.getElementById("mTitle").textContent = `🍱 ${label(W[0])} ~ ${label(W[6])}`;
  document.getElementById("menuRows").innerHTML = W.map(d => {
    const dirty = k => menuDraft[d] && k in menuDraft[d] && menuDraft[d][k] !== ((menus[d] && menus[d][k]) || "");
    return `<div class="mgrid">
      <span class="md ${d < TODAY ? "past" : ""}">${label(d)}</span>
      <input data-md="${d}" data-mk="main" value="${esc(val(d, "main"))}" placeholder="메인" class="${dirty("main") ? "dirty" : ""}">
      <input data-md="${d}" data-mk="soup" value="${esc(val(d, "soup"))}" placeholder="국" class="${dirty("soup") ? "dirty" : ""}">
    </div>`;
  }).join("");
}
document.addEventListener("input", e => {
  const t = e.target;
  if (!t.dataset || !t.dataset.md) return;
  (menuDraft[t.dataset.md] = menuDraft[t.dataset.md] || {})[t.dataset.mk] = t.value;
  t.classList.add("dirty");
});
const confirmLeave = () => !Object.keys(menuDraft).length || confirm("저장 안 한 식단이 있어요. 그래도 넘어갈까요?");
document.getElementById("mPrev").onclick = () => { if (!confirmLeave()) return; menuDraft = {}; menuMon = addDays(menuMon, -7); renderMenu(); };
document.getElementById("mNext").onclick = () => { if (!confirmLeave()) return; menuDraft = {}; menuMon = addDays(menuMon, 7); renderMenu(); };
document.getElementById("mCopy").onclick = () => {
  const W = menuWeek();
  let n = 0;
  W.forEach(d => {
    const prev = menus[addDays(d, -7)];

  renderMenu();

document.getElementById("mSave").onclick = async () => {

// 선택한 날 배달 (진행중만)
function daySummary() {
  const rows = [];
  let pending = 0;
  subs.forEach(s => s.orders.filter(o => o.date === day).forEach(o => {
    if (s.status === "진행중") rows.push({ s, o });
    if (s.status === "신청") pending++;
  }));
  const r = countUp(rows.map(x => x.o));
  const left = rows.filter(x => !x.o.delivered).length;
  // 남은 곳 먼저 → 아침·점심·저녁 → 동 이름 순 (기타는 맨 뒤)
  const dk = x => { const d = dongOf(x.s.addr); return d === "기타" ? "힣힣" : d; };
  rows.sort((a, b) => ((a.o.delivered ? 1 : 0) - (b.o.delivered ? 1 : 0))
    || (MEALS.indexOf(mealOf(a.o)) - MEALS.indexOf(mealOf(b.o)))
    || dk(a).localeCompare(dk(b), "ko") || String(a.s.addr).localeCompare(String(b.s.addr), "ko"));
  const byMeal = MEALS.map(m => {
    const n = rows.filter(x => mealOf(x.o) === m).reduce((a, x) => a + x.o.items.reduce((b, i) => b + i.qty, 0), 0);
    return n ? `<span>${mealTag({ meal: m })}${n}개</span>` : "";
  }).join("");
  let lastGroup = "";
  const who = rows.map(({ s, o }) => {
    const g = (o.delivered ? "done" : mealOf(o)) + "|" + dongOf(s.addr);
    const cnt = rows.filter(x => (x.o.delivered ? "done" : mealOf(x.o)) + "|" + dongOf(x.s.addr) === g).length;
    const head = g !== lastGroup ? `<div class="dong">${o.delivered ? "✅ 완료 · " : ""}📍 ${esc(dongOf(s.addr))} <span>${cnt}곳</span></div>` : "";
    lastGroup = g;
    return head + `
    <div class="dv">${mealTag(o)}<span class="dn">${esc(s.name)}</span> · ${o.items.map(i => `${esc(i.name)} ${i.qty}`).join(", ")}
    <div class="da"><a class="map" href="${mapUrl(s.addr)}" target="_blank">📍 ${esc(s.addr)}</a></div>
    ${s.memo ? `<div class="memo">📝 요청사항: ${esc(s.memo)}</div>` : ""}
    <div class="btns">
      ${o.delivered
        ? `<button class="dlv done" style="margin:0" disabled>✅ 배달 완료됨</button>`
        : `<button class="dlv" style="margin:0" data-arrive="${s.id}" data-date="${o.date}" data-ameal="${mealOf(o)}">🚚 배달 완료</button>`}
      <button data-alarm="${s.id}" data-kind="arrive">🔔 알람${s.alarm?.kind === "arrive" && s.alarm?.date === o.date ? " ✓" : ""}</button>
      <button data-sms="${s.id}" data-kind="arrive">💬 문자</button>
    </div>
    </div>`; }).join("");
  const mm = menus[day];
  const menuLine = mm && (mm.main || mm.soup) ? `<div class="todayMenu">🍖 <b>${esc(mm.main || "-")}</b> · 🍲 ${esc(mm.soup || "-")}</div>` : "";
  return menuLine + `<div class="stitle">📦 ${label(day)}${day === TODAY ? " 오늘" : ""} 배달 · <span style="color:#d9532b">남은 ${left}곳</span> / 전체 ${rows.length}곳${rows.length && !left ? " 🎉" : ""}</div>
    ${byMeal ? `<div class="mealsum">${byMeal}</div>` : ""}
    ${lines(r)}
    ${who ? `<div class="deliv">${who}</div>` : ""}
    ${pending ? `<div class="pend">⚠️ 이 날짜에 아직 확인 안 한 신청이 ${pending}건 있어요</div>` : ""}`;
}


// ===== 합계 출력 (배달 화면 위쪽 합계 부분만) =====
function printSummaryHtml(d) {
  const rows = [];
  subs.forEach(s => s.status === "진행중" && s.orders.filter(o => o.date === d).forEach(o => rows.push({ s, o })));
  const r = countUp(rows.map(x => x.o));
  const byMeal = MEALS.map(m => {
    const n = rows.filter(x => mealOf(x.o) === m).reduce((a, x) => a + x.o.items.reduce((b, i) => b + i.qty, 0), 0);
    return n ? `${m} ${n}개` : "";
  }).filter(Boolean).join(" · ");
  const now = new Date();
  const mm = menus[d];
  const menuP = mm && (mm.main || mm.soup)
    ? `<div class="pmenu">🍖 ${esc(mm.main || "-")}<br>🍲 ${esc(mm.soup || "-")}</div>`
    : `<div class="pmenu">식단 미입력</div>`;
  return `<h2>📦 ${label(d)} 배달 · 전체 ${rows.length}곳</h2>
    ${menuP}
    ${byMeal ? `<div class="pm">${byMeal}</div>` : ""}
    ${lines(r)}
    <div class="pt">출력 ${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}</div>`;
}
// ----- COM(시리얼) 영수증 프린터 -----
const PR_KEY = "dosirak_autoprint";
let prSet = {};
try { prSet = JSON.parse(localStorage.getItem(PR_KEY) || "{}"); } catch {}
const prSaveSet = () => { try { localStorage.setItem(PR_KEY, JSON.stringify(prSet)); } catch {} };
let comPort = null;
let EUC = null;   // 글자 → EUC-KR 바이트 (한글 영수증 프린터용)
function eucMap() {
  if (EUC) return EUC;
  EUC = new Map();
  const dec = new TextDecoder("euc-kr");
  for (let a = 0x81; a <= 0xFE; a++) for (let b = 0x41; b <= 0xFE; b++) {
    const ch = dec.decode(new Uint8Array([a, b]));
    if (ch.length === 1 && ch !== "�" && !EUC.has(ch)) EUC.set(ch, [a, b]);
  }
  return EUC;
}
function encKR(str) {
  const m = eucMap(), out = [];
  for (const ch of str) {
    const c = ch.codePointAt(0);
    if (c < 0x80) out.push(c);
    else if (m.has(ch)) out.push(...m.get(ch));
    else out.push(0x3F);   // 출력 못 하는 글자(이모지 등)는 ?
  }
  return out;
}
const dispW = t => [...t].reduce((a, ch) => a + (ch.codePointAt(0) < 0x80 ? 1 : 2), 0);
const lr = (l, r, cols) => l + " ".repeat(Math.max(1, cols - dispW(l) - dispW(r))) + r;
function escposBytes(d) {
  const cols = Number(prSet.cols || 42);
  const rows = [];
  subs.forEach(s => s.status === "진행중" && s.orders.filter(o => o.date === d).forEach(o => rows.push({ s, o })));
  const r = countUp(rows.map(x => x.o));
  const byMeal = MEALS.map(m => {
    const n = rows.filter(x => mealOf(x.o) === m).reduce((a, x) => a + x.o.items.reduce((b, i) => b + i.qty, 0), 0);
    return n ? `${m} ${n}개` : "";
  }).filter(Boolean).join(" · ");
  const mm = menus[d];
  const now = new Date();
  const B = [];
  const raw = (...x) => B.push(...x);
  const text = t => B.push(...encKR(t), 0x0A);
  const size = n => raw(0x1D, 0x21, n);          // 0: 보통, 0x11: 가로·세로 2배, 0x01: 세로 2배
  const bold = on => raw(0x1B, 0x45, on ? 1 : 0);
  const align = n => raw(0x1B, 0x61, n);         // 0 왼쪽, 1 가운데
  const line = ch => text(ch.repeat(cols));
  raw(0x1B, 0x40);                               // 초기화
  raw(0x1C, 0x26);                               // 한글 모드 (일부 기종)
  align(0);
  // 화면 출력 모양 그대로: 제목 → 식단 칸 → 식사별 개수 → 메뉴별 개수 → 합계 → 출력 시각
  size(0x01); bold(1); text(`${label(d)} 배달 · 전체 ${rows.length}곳`); bold(0); size(0);
  line("-");
  size(0x01); bold(1);
  if (mm && (mm.main || mm.soup)) { if (mm.main) text(mm.main); if (mm.soup) text(mm.soup); }
  else text("식단 미입력");
  bold(0); size(0);
  line("-");
  if (byMeal) text(byMeal);
  const ent = Object.entries(r.count);
  if (!ent.length) text("주문 없음");
  ent.forEach(([k, v], i) => {
    size(0x01); text(lr(k, v + "개", cols)); size(0);
    text(". ".repeat(Math.floor(cols / 2)).trimEnd());
  });
  line("=");
  size(0x01); bold(1); text(lr("합계", `${r.boxes}개 · ${won(r.money)}`, cols)); bold(0); size(0);
  text(`출력 ${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`);
  raw(0x0A, 0x0A, 0x0A, 0x0A, 0x0A);             // 자르지 않고 여유 있게 밀어 올림 (손으로 뜯기)
  return new Uint8Array(B);
}
async function openCom(port) {
  try { await port.open({ baudRate: Number(prSet.baud || 9600) }); }
  catch (e) { if (!String(e.message).includes("already open")) throw e; }
  comPort = port;
  updCom();
}
async function comPrint(d) {
  const w = comPort.writable.getWriter();
  try { await w.write(escposBytes(d)); } finally { w.releaseLock(); }
}
function updCom() {
  const b = document.getElementById("prCom");
  b.classList.toggle("on", !!comPort);
  b.textContent = comPort ? "✅ 프린터 연결됨" : "🔌 프린터(COM) 연결";
  prNote();
}
document.getElementById("prCom").onclick = async () => {
  if (!("serial" in navigator)) { alert("이 기기·브라우저는 COM 프린터 연결이 안 돼요.\n프린터가 꽂힌 컴퓨터(윈도우)의 크롬이나 엣지에서 열어 주세요."); return; }
  try {
    if (comPort) { try { await comPort.close(); } catch {} comPort = null; }
    const port = await navigator.serial.requestPort();   // 목록에서 COM1 선택
    await openCom(port);
    alert("프린터가 연결됐어요. 이제 '합계 출력'을 누르면 바로 영수증으로 나와요.");
  } catch (e) { if (e.name !== "NotFoundError") alert("연결 실패: " + e.message); }
};
// 한 번 고른 COM 포트는 다음부터 자동으로 다시 연결
if ("serial" in navigator) {
  navigator.serial.getPorts().then(ps => { if (ps[0]) openCom(ps[0]).catch(() => {}); });
  navigator.serial.addEventListener("disconnect", () => { comPort = null; updCom(); });
}

async function printDay(d) {
  if (comPort) {
    try { await comPrint(d); return; }
    catch (e) { alert("COM 프린터 출력 실패: " + e.message + "\n일반 인쇄 창으로 대신 열게요."); }
  }
  let pa = document.getElementById("printArea");
  if (!pa) { pa = document.createElement("div"); pa.id = "printArea"; document.body.appendChild(pa); }
  pa.innerHTML = printSummaryHtml(d);
  setTimeout(() => window.print(), 100);
}
document.getElementById("prNow").onclick = () => printDay(day);

const prSave = () => {

prNote();

// 주간 정산 (월~일)
const monOf = s => { const d = new Date(s + "T00:00"); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ymd(d); };
let weekMon = monOf(TODAY);
let custOpen = false;
document.addEventListener("toggle", e => { if (e.target.id === "custDet") custOpen = e.target.open; }, true);
const weekDates = () => [...Array(7)].map((_, i) => { const d = new Date(weekMon + "T00:00"); d.setDate(d.getDate() + i); return ymd(d); });
const moveWeek = n => { const d = new Date(weekMon + "T00:00"); d.setDate(d.getDate() + n * 7); weekMon = ymd(d); render(); };
document.getElementById("wPrev").onclick = () => moveWeek(-1);
document.getElementById("wNext").onclick = () => moveWeek(1);

function allSummary() {
  const W = weekDates();
  document.getElementById("wTitle").textContent = `📊 주간 정산 ${label(W[0])} ~ ${label(W[6])}`;
  const ok = subs.filter(s => s.status === "진행중");
  const inWeek = s => s.orders.filter(o => W.includes(o.date));

  // 요일별
  const dayRows = W.map(d => {
    const r = countUp(ok.flatMap(s => s.orders.filter(o => o.date === d)));
    return `<tr><td>${label(d)}</td><td>${r.boxes}개</td><td>${won(r.money)}</td></tr>`;
  }).join("");
  const all = countUp(ok.flatMap(inWeek));

  // 메뉴별
  const menuRows = Object.entries(all.count).map(([k, v]) => {
    const price = ok.flatMap(inWeek).flatMap(o => o.items).find(i => i.name === k)?.price || 0;
    return `<tr><td>${k}</td><td>${v}개</td><td>${won(v * price)}</td></tr>`;
  }).join("");

  // 손님별 (전화번호 기준)
  const per = {};
  ok.forEach(s => inWeek(s).forEach(o => {
    const p = per[custKey(s)] = per[custKey(s)] || { name: s.name, days: new Set(), boxes: 0, money: 0 };
    p.days.add(o.date); o.items.forEach(i => p.boxes += i.qty); p.money += o.amount;
  }));
  const custRows = Object.values(per).sort((a, b) => b.money - a.money)
    .map(p => `<tr><td>${esc(p.name)}</td><td>${p.days.size}일 · ${p.boxes}개</td><td>${won(p.money)}</td></tr>`).join("");

  const wait = countUp(subs.filter(s => s.status === "신청").flatMap(inWeek));

  return `
    <div class="stitle">요일별</div>
    <table><tr><th>날짜</th><th>개수</th><th>금액</th></tr>${dayRows}
    <tr class="tot"><td>합계</td><td>${all.boxes}개</td><td>${won(all.money)}</td></tr></table>
    <div class="gap"></div>
    <div class="stitle">메뉴별</div>
    <table><tr><th>메뉴</th><th>개수</th><th>금액</th></tr>${menuRows || '<tr><td colspan="3">없음</td></tr>'}</table>
    <div class="gap"></div>
    <details class="cust" ${custOpen ? "open" : ""} id="custDet">
    <summary>손님별 정산 · ${Object.keys(per).length}명 · ${won(all.money)} (눌러서 보기)</summary>
    <table><tr><th>손님</th><th>받는 날</th><th>금액</th></tr>${custRows || '<tr><td colspan="3">없음</td></tr>'}
    <tr class="tot"><td>${Object.keys(per).length}명</td><td></td><td>${won(all.money)}</td></tr></table>
    </details>
    ${wait.boxes ? `<div class="pend">⚠️ 이 주에 아직 확인 안 한 신청: ${wait.boxes}개 · ${won(wait.money)} (정산에 미포함)</div>` : ""}`;
}

function render() {
  ["day", "week", "list", "menu"].forEach(v => document.getElementById("v" + v[0].toUpperCase() + v.slice(1)).style.display = v === view ? "block" : "none");
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.view === view));
  const waitN = subs.filter(s => s.status === "신청").length;
  document.getElementById("waitBadge").innerHTML = waitN ? `<span class="nb">${waitN}</span>` : "";
  if (view === "day") document.getElementById("daySum").innerHTML = daySummary();
  if (view === "week") document.getElementById("allSum").innerHTML = allSummary();

  document.getElementById("tabs").innerHTML = TABS.map(t => {
    const n = t === "전체" ? subs.length : subs.filter(s => s.status === t).length;
    const nm = { 신청: "확인 대기", 진행중: "확인됨", 종료: "취소/종료" }[t] || t;
    return `<button class="tab ${t === tab ? "on" : ""}" data-tab="${t}">${nm} ${n}</button>`;
  }).join("");

  // 손님(전화번호)별로 묶기
  const kw = q.trim().replace(/-/g, "");
  const shown = (tab === "전체" ? subs : subs.filter(s => s.status === tab))
    .filter(s => !kw || [s.name, s.phone, s.addr].some(x => String(x || "").replace(/-/g, "").includes(kw)));
  const groups = {};
  shown.forEach(s => { const k = custKey(s); (groups[k] = groups[k] || []).push(s); });

  document.getElementById("newBox").innerHTML = editing === "new" ? `<div style="margin:0 12px 12px">${editView()}</div>` : "";
  document.getElementById("addNew").style.display = editing === "new" ? "none" : "block";

  const BADGE = { 신청: "확인 대기", 진행중: "확인됨", 종료: "취소/종료" };
  const COLOR = { 신청: "#d9532b", 진행중: "#2a8a4a", 종료: "#999" };
  // 확인 대기 손님을 맨 위로
  const list = Object.values(groups).sort((a, b) => (b.some(s => s.status === "신청") ? 1 : 0) - (a.some(s => s.status === "신청") ? 1 : 0));
  document.getElementById("list").innerHTML = list.map(g => {
    const f = g[0];
    const live = g.filter(s => s.status !== "종료");
    const sum = live.reduce((a, s) => a + s.orders.reduce((b, o) => b + o.amount, 0), 0);
    const next = live.flatMap(s => s.orders.map(o => o.date)).filter(d => d >= TODAY).sort()[0];
    const waiting = g.filter(s => s.status === "신청").length;
    const isOpen = open[custKey(f)] || g.some(s => s.id === editing);
    return `
    <div class="card">
      <div class="chead" data-open="${esc(custKey(f))}">
        <div>
          <span class="nm">${esc(f.name)}</span>${waiting ? `<span class="mini" style="background:${COLOR.신청}">확인 대기 ${waiting}</span>` : ""}
          <div class="info">${next ? `다음 배달 ${label(next)}` : "남은 배달 없음"} · 신청 ${g.length}건</div>
        </div>
        <div class="right"><span class="ct">${won(sum)}</span><span class="arrow">${isOpen ? "접기 ▲" : "자세히 ▼"}</span></div>
      </div>
      ${!isOpen ? "" : `
      <div class="row" style="margin-top:8px">📞 <a href="tel:${esc(f.phone)}">${esc(f.phone)}</a></div>
      <div class="row"><a class="map" href="${mapUrl(f.addr)}" target="_blank">📍 ${esc(f.addr)}</a> <span style="font-size:12px;color:#999">(카카오맵)</span></div>
      ${g.map(s => {
        if (editing === s.id) return editView();
        const up = s.orders.filter(o => o.date >= TODAY), past = s.orders.filter(o => o.date < TODAY);
        const line = o => `<div class="od ${o.date < TODAY ? "past" : ""}"><span>${label(o.date)} ${mealTag(o)}${o.items.map(i => `${esc(i.name)} ${i.qty}`).join(", ")}${o.delivered ? " ✅" : ""}</span><b>${won(o.amount)}</b></div>`;
        return `
        <div class="sub">
          <div class="shead">
            <span>${s.createdAt?.toDate ? s.createdAt.toDate().toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) + " 신청" : ""}${s.by ? " · 직접 추가" : ""}</span>
            <span class="badge ${s.status}">${BADGE[s.status] || s.status}</span>
          </div>
          ${s.editedAt && s.status === "신청" ? `<div class="row" style="color:#d9532b;font-weight:700">✏️ 손님이 개수를 수정했어요 → 다시 확인해 주세요</div>` : ""}
          ${s.memo ? `<div class="memo">📝 요청사항: ${esc(s.memo)}</div>` : ""}
          ${up.map(line).join("") || `<div class="row">남은 배달 없음</div>`}
          ${past.length ? `<details class="past"><summary>지난 날짜 ${past.length}개 보기</summary>${past.map(line).join("")}</details>` : ""}
          <div class="od" style="font-weight:700;border-top:1px solid #eee;margin-top:4px;padding-top:6px"><span>총 ${s.orders.length}일</span><b>${won(s.orders.reduce((a, o) => a + o.amount, 0))}</b></div>
          <div class="btns">
            ${s.status !== "진행중" ? `<button data-id="${s.id}" data-st="진행중">✅ 확인</button>` : ""}
            <button data-sms="${s.id}" data-kind="confirm">💬 문자</button>
          </div>
          <div class="btns">
            <button data-edit="${s.id}">✏️ 수정</button>
            <button class="del" data-del="${s.id}">🗑 삭제</button>
          </div>
        </div>`;
      }).join("")}`}
    </div>`;
  }).join("") || `<div class="empty">${kw ? "찾는 손님이 없어요" : "신청이 없어요"}</div>`;
}

// ===== 수정 화면 =====
function editView() {
  const d = draft;
  const days = [...d.orders].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : MEALS.indexOf(a.meal || "점심") - MEALS.indexOf(b.meal || "점심"));
  const total = days.reduce((a, o) => a + MENUS.reduce((b, m) => b + m.price * (o.q[m.name] || 0), 0), 0);
  return `
  <div class="sub ed">
    <div class="stitle">${editing === "new" ? "➕ 직접 주문 추가" : "✏️ 신청 수정"}</div>
    ${editing === "new" && customers().length ? `<label>기존 손님 불러오기</label>
      <select id="pickCust"><option value="">새 손님 (직접 입력)</option>
      ${customers().map(c => `<option value="${esc(custKey(c))}">${esc(c.name)} · ${esc(c.phone)}</option>`).join("")}</select>` : ""}
    <label>이름</label><input data-f="name" value="${esc(d.name)}">
    <label>연락처</label><input data-f="phone" value="${esc(d.phone)}">
    <label>주소</label><input data-f="addr" value="${esc(d.addr)}">
    <label>요청사항</label><input data-f="memo" value="${esc(d.memo)}">
    ${days.map(o => `
      <div class="edday">
        <div class="edhead"><span>${label(o.date)}<select class="msel" data-mealday="${o.uid}">${MEALS.map(m => `<option ${(o.meal || "점심") === m ? "selected" : ""}>${m}</option>`).join("")}</select></span><button data-rmday="${o.uid}">이 식사 빼기</button></div>
        ${MENUS.map(m => `
          <div class="edm"><span>${m.name}</span>
            <div class="q"><button data-dd="${o.uid}" data-mn="${m.name}" data-v="-1">−</button>
            <span>${o.q[m.name] || 0}</span>
            <button data-dd="${o.uid}" data-mn="${m.name}" data-v="1">+</button></div>
          </div>`).join("")}
      </div>`).join("")}
    <div class="addday"><input type="date" id="newDay" value="${nextFreeDay(d)}"><button data-addday="1">날짜·식사 추가</button></div>
    <div class="od" style="font-weight:700;margin-top:10px"><span>합계</span><b>${won(total)}</b></div>
    <div class="btns">
      <button data-cancel="1">닫기</button>
      <button class="save" data-save="1">저장</button>
    </div>
  </div>`;
}

// 날짜 칸 기본값: 내일부터 시작해서 아직 빈 식사가 있는 첫 날
function nextFreeDay(d) {
  let v = addDays(ymd(new Date()), 1);
  for (let i = 0; i < 60; i++) {
    if (MEALS.some(m => !d.orders.some(x => x.date === v && x.meal === m))) return v;
    v = addDays(v, 1);
  }
  return v;
}

// 전화번호별 손님 목록 (가장 최근 정보)
function customers() {
  const m = {};
  subs.forEach(s => { const k = custKey(s); if ((s.phone || s.name) && !m[k]) m[k] = { name: s.name, phone: s.phone, addr: s.addr, memo: s.memo }; });
  return Object.values(m);
}
function startNew() {
  draft = { name: "", phone: "", addr: "", memo: "", orders: [{ uid: String(++uidSeq), date: addDays(ymd(new Date()), 1), meal: "점심", q: {} }] };
  editing = "new"; view = "list"; render();
  document.getElementById("newBox").scrollIntoView({ behavior: "smooth" });
}

function startEdit(id) {
  const s = subs.find(x => x.id === id);
  draft = {
    name: s.name || "", phone: s.phone || "", addr: s.addr || "", memo: s.memo || "",
    orders: s.orders.map(o => ({ uid: String(++uidSeq), date: o.date, meal: mealOf(o), delivered: !!o.delivered, q: Object.fromEntries(o.items.map(i => [i.name, i.qty])) }))
  };
  editing = id; render();
}

async function saveEdit() {
  const orders = draft.orders
    .map(o => {
      const items = MENUS.filter(m => o.q[m.name] > 0).map(m => ({ name: m.name, price: m.price, qty: o.q[m.name] }));
      return { date: o.date, items, amount: items.reduce((a, i) => a + i.price * i.qty, 0), ...(o.meal && o.meal !== "점심" ? { meal: o.meal } : {}), ...(o.delivered ? { delivered: true } : {}) };
    })
    .filter(o => o.items.length)
    .sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : MEALS.indexOf(mealOf(a)) - MEALS.indexOf(mealOf(b)));
  if (!orders.length) { alert(editing === "new" ? "날짜를 추가하고 도시락 개수를 골라 주세요." : "도시락이 하나도 없어요. 신청을 지우려면 '삭제'를 눌러 주세요."); return; }
  if (editing === "new") {
    if (!draft.name.trim() || !draft.phone.trim()) { alert("이름과 연락처를 입력해 주세요."); return; }
    try {
      await addDoc(collection(db, "subscriptions"), {
        name: draft.name.trim(), phone: draft.phone.trim(), addr: draft.addr.trim(), memo: draft.memo.trim(),
        orders, total: orders.reduce((a, o) => a + o.amount, 0),
        status: "진행중", by: "사장님 직접 추가", createdAt: serverTimestamp()
      });
      editing = null; draft = null; render();
      alert("추가했어요 ✅");
    } catch (err) { alert("저장 실패: " + err.message); }
    return;
  }
  try {
    await updateDoc(doc(db, "subscriptions", editing), {
      name: draft.name.trim(), phone: draft.phone.trim(), addr: draft.addr.trim(), memo: draft.memo.trim(),
      orders, total: orders.reduce((a, o) => a + o.amount, 0)
    });
    editing = null; draft = null; render();
  } catch (err) { alert("저장 실패: " + err.message); }
}

document.addEventListener("change", e => {
  if (e.target.dataset && e.target.dataset.mealday && draft) {
    const o = draft.orders.find(x => x.uid === e.target.dataset.mealday);
    if (!o) return;
    if (draft.orders.some(x => x !== o && x.date === o.date && x.meal === e.target.value)) {
      alert(`${label(o.date)} ${e.target.value}은 이미 있어요. 그 칸에서 개수를 바꿔 주세요.`); render(); return;
    }
    o.meal = e.target.value;
    render();
    return;
  }
  if (e.target.id === "pickCust" && draft) {
    const c = customers().find(x => custKey(x) === e.target.value);
    Object.assign(draft, c ? { name: c.name || "", phone: c.phone || "", addr: c.addr || "", memo: c.memo || "" } : { name: "", phone: "", addr: "", memo: "" });
    render();
    const sel = document.getElementById("pickCust"); if (sel) sel.value = c ? custKey(c) : "";
  }
});

document.addEventListener("click", e => {
  const h = e.target.closest(".chead");
  if (h && !e.target.closest("button, a")) { open[h.dataset.open] = !open[h.dataset.open]; render(); }
});

document.addEventListener("input", e => {
  if (e.target.id === "q") { q = e.target.value; render(); return; }
  if (draft && e.target.dataset.f) draft[e.target.dataset.f] = e.target.value;
});

document.addEventListener("click", async e => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; render(); }
  if (t.id === "addNew") { startNew(); return; }
  if (t.dataset.view) { view = t.dataset.view; render(); if (view === "menu") renderMenu(); window.scrollTo(0, 0); return; }
  if (t.dataset.arrive) {
    const s = subs.find(x => x.id === t.dataset.arrive);
    if (!s) return;
    const orders = s.orders.map(o => o.date === t.dataset.date && mealOf(o) === (t.dataset.ameal || "점심") ? { ...o, delivered: true } : o);
    try { await updateDoc(doc(db, "subscriptions", s.id), { orders }); }
    catch (err) { alert("완료 표시 저장 실패: " + err.message); }
  }
  if (t.dataset.st) {
    await updateDoc(doc(db, "subscriptions", t.dataset.id), { status: t.dataset.st });
  }
  if (t.dataset.alarm) {
    const s = subs.find(x => x.id === t.dataset.alarm);
    if (!s) return;
    const kind = t.dataset.kind;
    const msg = (kind === "arrive" ? ALARM_ARRIVE : ALARM_CONFIRM).replace("{이름}", s.name || "고객");
    try {
      await updateDoc(doc(db, "subscriptions", s.id), { alarm: { msg, kind, date: kind === "arrive" ? day : null, at: Date.now() } });
      alert("손님 화면으로 알람을 보냈어요 🔔\n(손님이 화면을 열면 바로 떠요)");
    } catch (err) { alert("알람 보내기 실패: " + err.message); }
  }
  if (t.dataset.sms) {
    const s = subs.find(x => x.id === t.dataset.sms);
    if (!s || !s.phone) return;
    let msg;
    if (t.dataset.kind === "arrive") msg = ARRIVE_MSG.replace("{이름}", s.name || "고객");
    else {
      const list = s.orders.map(o => `${label(o.date)} ${o.items.map(i => `${i.name} ${i.qty}`).join(", ")}`).join("\n");
      msg = CONFIRM_MSG.replace("{이름}", s.name || "고객").replace("{내역}", list);
    }
    location.href = `sms:${s.phone.replace(/[^0-9]/g, "")}?body=${encodeURIComponent(msg)}`;
  }
  if (t.dataset.edit) startEdit(t.dataset.edit);
  if (t.dataset.cancel) { editing = null; draft = null; render(); }
  if (t.dataset.save) saveEdit();
  if (t.dataset.dd) {
    const o = draft.orders.find(x => x.uid === t.dataset.dd);
    o.q[t.dataset.mn] = Math.max(0, (o.q[t.dataset.mn] || 0) + Number(t.dataset.v));
    render();
  }
  if (t.dataset.rmday) { draft.orders = draft.orders.filter(x => x.uid !== t.dataset.rmday); render(); }
  if (t.dataset.addday) {
    const v = document.getElementById("newDay").value;
    if (!v) { alert("추가할 날짜를 골라 주세요."); return; }
    const free = MEALS.filter(m => !draft.orders.some(x => x.date === v && x.meal === m));
    if (!free.length) { alert("그 날짜는 아침·점심·저녁이 다 있어요."); return; }
    draft.orders.push({ uid: String(++uidSeq), date: v, meal: free.includes("점심") ? "점심" : free[0], q: {} }); render();
  }
  if (t.dataset.del) {
    const s = subs.find(x => x.id === t.dataset.del);
    if (!confirm(`${s?.name || ""}님의 이 신청을 완전히 삭제할까요?\n삭제하면 되돌릴 수 없어요.`)) return;
    try { await deleteDoc(doc(db, "subscriptions", t.dataset.del)); }
    catch (err) { alert("삭제 실패: Firebase 규칙에 delete 권한이 있는지 확인해 주세요."); }
  }
});
</script>
</body>
</html>
