<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도시락 신청 관리</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; background: #f2f2f2; color: #222; padding-bottom: 30px; }
  header { background: #333; color: #fff; padding: 16px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 19px; }
  header button { background: none; border: 1px solid #888; color: #fff; padding: 6px 10px; border-radius: 8px; }
  .login { max-width: 360px; margin: 60px auto; background: #fff; padding: 24px; border-radius: 14px; }
  .login input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; }
  .login button { width: 100%; padding: 14px; background: #d9532b; color: #fff; border: none; border-radius: 10px; font-size: 16px; }
  .box { margin: 12px; background: #fff; border-radius: 12px; padding: 14px; font-size: 15px; }
  .box.day { background: #fff3e8; }
  .box.all { background: #eef5ff; }
  .daynav { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .daynav button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid #ccc; background: #fff; font-size: 18px; }
  .daynav input { flex: 1; padding: 9px; border: 1px solid #ccc; border-radius: 10px; font-size: 16px; }
  .stitle { font-weight: 700; margin-bottom: 6px; }
  .sline { display: flex; justify-content: space-between; padding: 3px 0; }
  .total2 { border-top: 1px solid #ddd; margin-top: 4px; padding-top: 6px; font-weight: 700; }
  .deliv { border-top: 1px dashed #e3c3ad; margin-top: 10px; padding-top: 8px; }
  .dv { padding: 6px 0; border-bottom: 1px solid #f3e1d4; font-size: 14px; }
  .dv:last-child { border-bottom: none; }
  .dv .dn { font-weight: 700; }
  .dv .da { color: #666; }
  .pend { color: #d9532b; font-size: 13px; margin-top: 6px; }
  .tabs { display: flex; gap: 8px; padding: 0 12px 12px; overflow-x: auto; }
  .tab { padding: 8px 14px; border-radius: 18px; border: 1px solid #ccc; background: #fff; white-space: nowrap; font-size: 15px; }
  .tab.on { background: #333; color: #fff; border-color: #333; }
  .card { background: #fff; margin: 0 12px 12px; border-radius: 12px; padding: 14px; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .top .nm { font-size: 17px; font-weight: 700; }
  .top .ct { font-weight: 700; color: #d9532b; }
  .row { font-size: 14px; color: #555; margin: 3px 0; }
  .row a { color: #1a6ad1; }
  .sub { border: 1px solid #eee; border-radius: 10px; padding: 10px; margin-top: 10px; }
  .shead { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #888; margin-bottom: 6px; }
  .badge { font-size: 12px; padding: 3px 9px; border-radius: 12px; color: #fff; }
  .신청 { background: #d9532b; } .진행중 { background: #2a8a4a; } .종료 { background: #999; }
  .od { display: flex; justify-content: space-between; font-size: 14px; padding: 3px 0; }
  .od.past { color: #aaa; }
  .od b { white-space: nowrap; margin-left: 8px; }
  .btns { display: flex; gap: 8px; margin-top: 8px; }
  .btns button { flex: 1; padding: 9px; border-radius: 8px; border: 1px solid #ccc; background: #fff; font-size: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; margin: 6px 0 4px; }
  th, td { padding: 6px 4px; border-bottom: 1px solid #dde6f3; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  th { color: #666; font-weight: 600; font-size: 13px; }
  tr.tot td { font-weight: 700; border-top: 2px solid #b9c9e0; border-bottom: none; }
  .gap { height: 14px; }
  .empty { text-align: center; color: #999; padding: 40px; }
</style>
</head>
<body>
<header><h1>🍱 도시락 신청 관리</h1><button id="logout" style="display:none">로그아웃</button></header>

<div class="login" id="login">
  <input id="email" type="email" placeholder="이메일">
  <input id="pw" type="password" placeholder="비밀번호">
  <button id="loginBtn">로그인</button>
</div>

<div id="app" style="display:none">
  <div class="box day">
    <div class="daynav">
      <button id="prev">◀</button>
      <input type="date" id="pickDay">
      <button id="next">▶</button>
    </div>
    <div id="daySum"></div>
  </div>
  <div class="box all">
    <div class="daynav">
      <button id="wPrev">◀</button>
      <div id="wTitle" style="flex:1;text-align:center;font-weight:700"></div>
      <button id="wNext">▶</button>
    </div>
    <div id="allSum"></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="list"></div>
</div>

<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyC2zCKXtWxY9vgHf2bS_L1bvuXUUvKQpSA",
  authDomain: "house-order-a689f.firebaseapp.com",
  projectId: "house-order-a689f",
  storageBucket: "house-order-a689f.firebasestorage.app",
  messagingSenderId: "621901289473",
  appId: "1:621901289473:web:952c5951744cd9f5b40800"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const WD = ["일", "월", "화", "수", "목", "금", "토"];
const won = n => (n || 0).toLocaleString("ko-KR") + "원";
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const label = s => { const d = new Date(s + "T00:00"); return `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})`; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const TODAY = ymd(new Date());

const TABS = ["전체", "신청", "진행중", "종료"];
let tab = "전체";
let subs = [];
let unsub = null;
let day = TODAY;

// 예전 방식(요일+주) 신청도 날짜별로 바꿔서 보여줌
function normalize(s) {
  if (Array.isArray(s.orders)) return s;
  const orders = [];
  if (s.start && s.days && s.weeks) {
    const st = new Date(s.start + "T00:00");
    for (let i = 0; i < s.weeks * 7; i++) {
      const d = new Date(st); d.setDate(st.getDate() + i);
      if (s.days.includes(WD[d.getDay()]))
        orders.push({ date: ymd(d), items: s.items, amount: s.items.reduce((a, x) => a + x.price * x.qty, 0) });
    }
  }
  return { ...s, orders };
}

document.getElementById("loginBtn").onclick = async () => {
  try {
    await signInWithEmailAndPassword(auth, document.getElementById("email").value, document.getElementById("pw").value);
  } catch { alert("로그인 실패. 이메일/비밀번호를 확인해 주세요."); }
};
document.getElementById("logout").onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  document.getElementById("login").style.display = user ? "none" : "block";
  document.getElementById("app").style.display = user ? "block" : "none";
  document.getElementById("logout").style.display = user ? "block" : "none";
  if (user && !unsub) {
    unsub = onSnapshot(query(collection(db, "subscriptions"), orderBy("createdAt", "desc")), snap => {
      subs = snap.docs.map(d => normalize({ id: d.id, ...d.data() }));
      render();
    }, err => { document.getElementById("list").innerHTML = `<div class="empty">불러오기 실패: ${esc(err.message)}</div>`; });
  }
  if (!user && unsub) { unsub(); unsub = null; }
});

// 날짜 고르기
const pick = document.getElementById("pickDay");
pick.value = day;
pick.onchange = () => { day = pick.value || TODAY; render(); };
const move = n => { const d = new Date(day + "T00:00"); d.setDate(d.getDate() + n); day = ymd(d); pick.value = day; render(); };
document.getElementById("prev").onclick = () => move(-1);
document.getElementById("next").onclick = () => move(1);

function countUp(list) {
  const count = {}; let boxes = 0, money = 0;
  list.forEach(o => o.items.forEach(i => {
    count[i.name] = (count[i.name] || 0) + i.qty; boxes += i.qty; money += i.price * i.qty;
  }));
  return { count, boxes, money };
}
const lines = r => (Object.entries(r.count).map(([k, v]) => `<div class="sline">${k}<span><b>${v}개</b></span></div>`).join("") || '<div class="sline">없음</div>')
  + `<div class="sline total2">합계<span>${r.boxes}개 · ${won(r.money)}</span></div>`;

// 선택한 날 배달 (진행중만)
function daySummary() {
  const rows = [];
  let pending = 0;
  subs.forEach(s => s.orders.filter(o => o.date === day).forEach(o => {
    if (s.status === "진행중") rows.push({ s, o });
    if (s.status === "신청") pending++;
  }));
  const r = countUp(rows.map(x => x.o));
  const who = rows.map(({ s, o }) => `
    <div class="dv"><span class="dn">${esc(s.name)}</span> · ${o.items.map(i => `${esc(i.name)} ${i.qty}`).join(", ")}
    <div class="da">📍 ${esc(s.addr)}${s.memo ? ` · 📝 ${esc(s.memo)}` : ""}</div></div>`).join("");
  return `<div class="stitle">📦 ${label(day)}${day === TODAY ? " 오늘" : ""} 배달 · ${rows.length}곳</div>
    ${lines(r)}
    ${who ? `<div class="deliv">${who}</div>` : ""}
    ${pending ? `<div class="pend">⚠️ 이 날짜에 아직 확인 안 한 신청이 ${pending}건 있어요</div>` : ""}`;
}

// 주간 정산 (월~일)
const monOf = s => { const d = new Date(s + "T00:00"); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ymd(d); };
let weekMon = monOf(TODAY);
const weekDates = () => [...Array(7)].map((_, i) => { const d = new Date(weekMon + "T00:00"); d.setDate(d.getDate() + i); return ymd(d); });
const moveWeek = n => { const d = new Date(weekMon + "T00:00"); d.setDate(d.getDate() + n * 7); weekMon = ymd(d); render(); };
document.getElementById("wPrev").onclick = () => moveWeek(-1);
document.getElementById("wNext").onclick = () => moveWeek(1);

function allSummary() {
  const W = weekDates();
  document.getElementById("wTitle").textContent = `📊 주간 정산 ${label(W[0])} ~ ${label(W[6])}`;
  const ok = subs.filter(s => s.status === "진행중");
  const inWeek = s => s.orders.filter(o => W.includes(o.date));

  // 요일별
  const dayRows = W.map(d => {
    const r = countUp(ok.flatMap(s => s.orders.filter(o => o.date === d)));
    return `<tr><td>${label(d)}</td><td>${r.boxes}개</td><td>${won(r.money)}</td></tr>`;
  }).join("");
  const all = countUp(ok.flatMap(inWeek));

  // 메뉴별
  const menuRows = Object.entries(all.count).map(([k, v]) => {
    const price = ok.flatMap(inWeek).flatMap(o => o.items).find(i => i.name === k)?.price || 0;
    return `<tr><td>${k}</td><td>${v}개</td><td>${won(v * price)}</td></tr>`;
  }).join("");

  // 손님별 (전화번호 기준)
  const per = {};
  ok.forEach(s => inWeek(s).forEach(o => {
    const p = per[s.phone] = per[s.phone] || { name: s.name, days: new Set(), boxes: 0, money: 0 };
    p.days.add(o.date); o.items.forEach(i => p.boxes += i.qty); p.money += o.amount;
  }));
  const custRows = Object.values(per).sort((a, b) => b.money - a.money)
    .map(p => `<tr><td>${esc(p.name)}</td><td>${p.days.size}일 · ${p.boxes}개</td><td>${won(p.money)}</td></tr>`).join("");

  const wait = countUp(subs.filter(s => s.status === "신청").flatMap(inWeek));

  return `
    <div class="stitle">요일별</div>
    <table><tr><th>날짜</th><th>개수</th><th>금액</th></tr>${dayRows}
    <tr class="tot"><td>합계</td><td>${all.boxes}개</td><td>${won(all.money)}</td></tr></table>
    <div class="gap"></div>
    <div class="stitle">메뉴별</div>
    <table><tr><th>메뉴</th><th>개수</th><th>금액</th></tr>${menuRows || '<tr><td colspan="3">없음</td></tr>'}</table>
    <div class="gap"></div>
    <div class="stitle">손님별 정산</div>
    <table><tr><th>손님</th><th>받는 날</th><th>금액</th></tr>${custRows || '<tr><td colspan="3">없음</td></tr>'}
    <tr class="tot"><td>${Object.keys(per).length}명</td><td></td><td>${won(all.money)}</td></tr></table>
    ${wait.boxes ? `<div class="pend">⚠️ 이 주에 아직 확인 안 한 신청: ${wait.boxes}개 · ${won(wait.money)} (정산에 미포함)</div>` : ""}`;
}

function render() {
  document.getElementById("daySum").innerHTML = daySummary();
  document.getElementById("allSum").innerHTML = allSummary();

  document.getElementById("tabs").innerHTML = TABS.map(t => {
    const n = t === "전체" ? subs.length : subs.filter(s => s.status === t).length;
    const nm = { 신청: "확인 대기", 진행중: "확인됨", 종료: "취소/종료" }[t] || t;
    return `<button class="tab ${t === tab ? "on" : ""}" data-tab="${t}">${nm} ${n}</button>`;
  }).join("");

  // 손님(전화번호)별로 묶기
  const shown = tab === "전체" ? subs : subs.filter(s => s.status === tab);
  const groups = {};
  shown.forEach(s => { (groups[s.phone] = groups[s.phone] || []).push(s); });

  document.getElementById("list").innerHTML = Object.values(groups).map(g => {
    const f = g[0];
    const sum = g.filter(s => s.status !== "종료").reduce((a, s) => a + s.orders.reduce((b, o) => b + o.amount, 0), 0);
    return `
    <div class="card">
      <div class="top"><span class="nm">${esc(f.name)}</span><span class="ct">${won(sum)}</span></div>
      <div class="row">📞 <a href="tel:${esc(f.phone)}">${esc(f.phone)}</a></div>
      <div class="row">📍 ${esc(f.addr)}</div>
      ${g.map(s => `
        <div class="sub">
          <div class="shead">
            <span>${s.createdAt?.toDate ? s.createdAt.toDate().toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) + " 신청" : ""}</span>
            <span class="badge ${s.status}">${{ 신청: "확인 대기", 진행중: "확인됨", 종료: "취소/종료" }[s.status] || s.status}</span>
          </div>
          ${s.memo ? `<div class="row">📝 ${esc(s.memo)}</div>` : ""}
          ${s.orders.map(o => `<div class="od ${o.date < TODAY ? "past" : ""}"><span>${label(o.date)} ${o.items.map(i => `${esc(i.name)} ${i.qty}`).join(", ")}</span><b>${won(o.amount)}</b></div>`).join("")}
          <div class="od" style="font-weight:700;border-top:1px solid #eee;margin-top:4px;padding-top:6px"><span>${s.orders.length}일</span><b>${won(s.orders.reduce((a, o) => a + o.amount, 0))}</b></div>
          <div class="btns">
            ${s.status !== "진행중" ? `<button data-id="${s.id}" data-st="진행중">✅ 확인</button>` : ""}
            ${s.status !== "종료" ? `<button data-id="${s.id}" data-st="종료">취소/종료</button>` : ""}
          </div>
        </div>`).join("")}
    </div>`;
  }).join("") || `<div class="empty">신청이 없어요</div>`;
}

document.addEventListener("click", async e => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; render(); }
  if (t.dataset.st) {
    if (t.dataset.st === "종료" && !confirm("이 신청을 취소/종료할까요?")) return;
    await updateDoc(doc(db, "subscriptions", t.dataset.id), { status: t.dataset.st });
  }
});
</script>
</body>
</html>
