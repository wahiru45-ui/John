<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>생선구이 현황</title>
<style>
:root{--bg:#f2f4f3;--card:#fff;--line:#d9e0de;--text:#1c2b2a;--muted:#5d6d6b;--accent:#1f7a5a;--accent-text:#fff;--warn:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#121917;--card:#1b2522;--line:#32413d;--text:#eef3f1;--muted:#9fb0ab;--accent:#3fb68b;--accent-text:#06110d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans KR","Malgun Gothic",sans-serif;min-height:100vh;display:flex;flex-direction:column}
.hide{display:none!important}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);padding:0 8px;position:sticky;top:0;background:var(--bg);z-index:2}
.tab{flex:1;padding:14px 8px;border:0;background:none;color:var(--muted);font:inherit;font-size:18px;font-weight:800;border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--text);border-color:var(--accent)}
.st{font-size:13px;color:var(--muted);padding:6px 14px;display:flex;justify-content:space-between}
.st b.ok{color:var(--accent)}.st b.err{color:var(--warn)}
.wrap{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;padding:10px 14px 20px}
.fc{background:var(--card);border:2px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 10px;min-height:300px}
.fn{font-size:clamp(30px,5vw,52px);font-weight:900}
.fv{font-size:clamp(80px,16vw,150px);font-weight:900;line-height:1.05;color:var(--accent)}
.fv.z{color:var(--muted)}
.sb{display:flex;gap:12px;width:100%;margin-top:14px}
.sb button{flex:1;height:190px;border-radius:24px;border:4px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:100px;line-height:1;font-weight:900;cursor:pointer;touch-action:manipulation}
.sb .plus{flex:1.4;background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.eta{min-height:30px;font-size:clamp(18px,3vh,26px);font-weight:800;color:var(--accent);text-align:center;margin-top:2px}
.rs{margin-top:10px;min-height:64px;padding:0 28px;border:0;background:none;color:var(--muted);font:inherit;font-size:20px;font-weight:700;text-decoration:underline;cursor:pointer}
.all{padding:0 14px 16px}
.all button{width:100%;height:84px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--muted);font:inherit;font-size:26px;font-weight:800;cursor:pointer}
@media (min-width:700px) and (orientation:landscape){
html,body{height:100%}
body{height:100vh;height:100dvh;overflow:hidden}
.wrap{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:minmax(0,1fr);min-height:0;padding:6px 10px 6px;gap:10px}
.fc{min-height:0;padding:6px 6px;overflow:hidden}
.fn{font-size:clamp(22px,7vh,48px);line-height:1.1}
.fv{font-size:clamp(46px,20vh,150px)}
.sb{margin-top:6px;gap:8px}
.sb button{height:clamp(64px,24vh,190px);font-size:clamp(44px,15vh,100px);border-radius:18px}
.rs{min-height:40px;margin-top:4px;font-size:clamp(16px,3.5vh,24px)}
.all{padding:0 10px 8px}.all button{height:clamp(44px,9vh,84px);font-size:clamp(18px,3.5vh,26px)}
.st{padding:3px 12px}
}
body.v .fc{min-height:0}
#alerts{position:fixed;left:0;right:0;top:0;z-index:50;display:flex;flex-direction:column;gap:8px;padding:8px}
.al{border-radius:16px;padding:16px 18px;font-size:clamp(26px,6vh,44px);font-weight:900;color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.35);animation:blink 1s steps(2) infinite;cursor:pointer}
.al.a1{background:#d68910}.al.a2{background:#c0392b}
.al small{display:block;font-size:.5em;font-weight:700;opacity:.9}
@keyframes blink{50%{filter:brightness(1.35)}}
.snd{font-size:13px;font-weight:800}
.login{max-width:360px;margin:12vh auto;padding:0 20px}
.login h1{font-size:24px}.inp{width:100%;height:52px;margin:6px 0;border:2px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-size:18px;background:var(--card);color:var(--text)}
.lgo{width:100%;height:56px;margin-top:8px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-text);font:inherit;font-size:20px;font-weight:800}
.lerr{color:var(--warn);min-height:22px;font-weight:700}
</style></head><body>
<div id="login" class="login hide">
  <h1>생선구이 현황 로그인</h1>
  <input id="em" class="inp" type="email" placeholder="이메일" autocomplete="username">
  <input id="pw" class="inp" type="password" placeholder="비밀번호" autocomplete="current-password">
  <div class="lerr" id="lerr"></div>
  <button class="lgo" id="lgo">로그인</button>
</div>
<div id="app" class="hide" style="display:contents">
  <div class="st"><span><b id="net" class="err">연결 중…</b></span><span><span class="snd" id="snd">🔇 화면을 한 번 터치하면 알람 소리가 켜져요</span> · 버전 11</span></div>
  <div id="alerts" aria-live="assertive"></div>
  <div class="wrap" id="wrap"></div>
  <div class="all" id="all"><button id="rall" type="button">전체 0으로 되돌리기</button></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
var FIREBASE_CONFIG={apiKey:"AIzaSyC2zCKXtWxY9vgHf2bS_L1bvuXUUvKQpSA",authDomain:"house-order-a689f.firebaseapp.com",projectId:"house-order-a689f",storageBucket:"house-order-a689f.firebasestorage.app",messagingSenderId:"621901289473",appId:"1:621901289473:web:952c5951744cd9f5b40800"};
var FISH=[{k:"mack",n:"고등어"},{k:"sam",n:"삼치"},{k:"gal",n:"갈치"},{k:"gul",n:"영광굴비"}];
var $=function(i){return document.getElementById(i)},auth,fs,cnt={mack:[],sam:[],gal:[],gul:[]},GT={mack:13,sam:15,gal:14,gul:15},EXP=7200000,mode="staff",unsub=null;
function ref(){return fs.collection("orders").doc("fish_state")}
function mark(o){o.time=Date.now();o.ts=o.time;o.closed=true;o.status="done";o.items=[];o.table="";return o}
function net(t,c){$("net").textContent=t;$("net").className=c}
function live(k){var now=Date.now();return(cnt[k]||[]).filter(function(t){return now-t<EXP}).sort(function(a,b){return a-b})}
function etaText(k){
  var a=live(k);if(!a.length)return"";var now=Date.now(),done=0,rem=null;
  a.forEach(function(t){var r=t+GT[k]*60000-now;if(r<=0)done++;else if(rem===null||r<rem)rem=r});
  var p=[];if(done)p.push("🔔 완료 "+done);if(rem!==null)p.push("약 "+Math.max(1,Math.round(rem/60000))+"분 후");return p.join(" · ");
}
function draw(){
  var v=mode==="view";document.body.classList.toggle("v",v);
  $("all").classList.toggle("hide",v);
  $("wrap").innerHTML=FISH.map(function(f){
    var n=live(f.k).length;
    return '<div class="fc"><div class="fn">'+f.n+'</div><div class="fv'+(n?'':' z')+'" aria-live="polite">'+n+'</div><div class="eta">'+(etaText(f.k)||"&nbsp;")+'</div>'+
      '<div class="sb"><button type="button" data-k="'+f.k+'" data-d="-1" aria-label="'+f.n+' 1 빼기">−</button><button type="button" class="plus" data-k="'+f.k+'" data-d="1" aria-label="'+f.n+' 1 더하기">＋</button></div><button type="button" class="rs" data-k="'+f.k+'" data-d="0">0으로</button></div>';
  }).join("");
}
function change(k,d){
  var upd={},F=firebase.firestore.FieldValue,key=k+"_t",a=live(k);
  if(d>0){var t=Date.now()+Math.random();cnt[key]=cnt[key]||[];cnt[k]=(cnt[k]||[]).concat([t]);upd[key]=F.arrayUnion(t)}
  else if(d<0){if(!a.length)return;var o=a[0];cnt[k]=(cnt[k]||[]).filter(function(x){return x!==o});upd[key]=F.arrayRemove(o)}
  else{cnt[k]=[];upd[key]=[]}
  draw();mark(upd);
  ref().set(upd,{merge:true}).catch(function(){net("저장 실패 — 인터넷을 확인하세요","err")});
}
$("wrap").addEventListener("click",function(e){var b=e.target.closest("[data-k]");if(!b)return;change(b.dataset.k,+b.dataset.d)});
$("rall").onclick=function(){if(!confirm("전체를 0으로 되돌릴까요?"))return;FISH.forEach(function(f){cnt[f.k]=[]});draw();ref().set(mark({mack_t:[],sam_t:[],gal_t:[],gul_t:[]}),{merge:true})};
function setMode(m){mode=m;draw()}
/* ===== 알람: 첫 알람 7분, 두 번째는 생선별 ===== */
var AL={mack:{d:2},sam:{d:7},gal:{d:4}},A1=7,fired={},snd=false,actx=null;
function nm(k){for(var i=0;i<FISH.length;i++)if(FISH[i].k===k)return FISH[i].n}
function unlockSound(){
  if(snd)return;snd=true;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume()}catch(e){}
  try{if(window.speechSynthesis){var u=new SpeechSynthesisUtterance(" ");u.lang="ko-KR";u.volume=0;speechSynthesis.speak(u)}}catch(e){}
  try{if(navigator.wakeLock)navigator.wakeLock.request("screen").catch(function(){})}catch(e){}
  $("snd").textContent="🔊 알람 소리 켜짐";
}
document.addEventListener("pointerdown",unlockSound);
function beep(){
  try{if(!actx)return;var o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.type="sine";o.frequency.value=880;g.gain.setValueAtTime(.4,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.6);o.start();o.stop(actx.currentTime+.6)}catch(e){}
}
function say(text){
  beep();
  try{if(window.speechSynthesis){var u=new SpeechSynthesisUtterance(text);u.lang="ko-KR";u.rate=.95;u.volume=1;speechSynthesis.speak(u)}}catch(e){}
}
function alarm(k,kind){
  var msg=kind===1?"생선을 확인해주세요":"나갈 준비해주세요",text=nm(k)+", "+msg,n=0;
  var d=document.createElement("div");d.className="al a"+kind;d.innerHTML=nm(k)+'<small>'+msg+' (터치하면 꺼져요)</small>';
  $("alerts").appendChild(d);
  function stop(){clearInterval(iv);if(d.parentNode)d.remove()}
  /* 첫 소리 후 3초 뒤부터 확인하라고 다시 알려줌 (최대 6번, 터치하면 멈춤) */
  say(text);
  var iv=setInterval(function(){n++;if(n>6||!d.parentNode){stop();return}beep();setTimeout(function(){if(d.parentNode)say(text)},400)},5000);
  d.onclick=stop;
}
function checkAlarms(){
  var now=Date.now();
  Object.keys(AL).forEach(function(k){
    (cnt[k]||[]).forEach(function(t){
      [[1,A1*60000],[2,(A1+AL[k].d)*60000]].forEach(function(p){
        var id=k+t+"_"+p[0],due=t+p[1];
        if(fired[id]||now<due)return;
        fired[id]=1;
        if(now-due<60000)alarm(k,p[0]);
      });
    });
  });
}
setInterval(checkAlarms,1000);

function start(){
  $("login").classList.add("hide");$("app").classList.remove("hide");
  setMode("staff");
  unsub=ref().onSnapshot(function(s){
    var d=s.exists?s.data():{};
    FISH.forEach(function(f){cnt[f.k]=Array.isArray(d[f.k+"_t"])?d[f.k+"_t"]:[]});
    draw();net(s.metadata.fromCache?"연결 확인 중…":"● 실시간 연결됨",s.metadata.fromCache?"err":"ok");
  },function(){net("연결 실패 — 로그인/권한을 확인하세요","err")});
}
function showLogin(msg){$("app").classList.add("hide");$("login").classList.remove("hide");$("lerr").textContent=msg||""}
function doLogin(){$("lerr").textContent="";auth.signInWithEmailAndPassword($("em").value.trim(),$("pw").value).catch(function(){$("lerr").textContent="이메일 또는 비밀번호가 맞지 않아요."})}
$("lgo").onclick=doLogin;$("pw").addEventListener("keydown",function(e){if(e.key==="Enter")doLogin()});
setInterval(function(){if(!$("app").classList.contains("hide"))draw()},20000);
firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();fs=firebase.firestore();
auth.onAuthStateChanged(function(u){if(u)start();else{if(unsub){unsub();unsub=null}showLogin()}});
</script></body></html>
