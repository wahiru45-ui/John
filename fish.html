<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>생선구이 현황</title>
<style>
:root{--bg:#f2f4f3;--card:#fff;--line:#d9e0de;--text:#1c2b2a;--muted:#5d6d6b;--accent:#1f7a5a;--accent-text:#fff;--warn:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#121917;--card:#1b2522;--line:#32413d;--text:#eef3f1;--muted:#9fb0ab;--accent:#3fb68b;--accent-text:#06110d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans KR","Malgun Gothic",sans-serif;min-height:100vh;display:flex;flex-direction:column}
.hide{display:none!important}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);padding:0 8px;position:sticky;top:0;background:var(--bg);z-index:2}
.tab{flex:1;padding:14px 8px;border:0;background:none;color:var(--muted);font:inherit;font-size:18px;font-weight:800;border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--text);border-color:var(--accent)}
.st{font-size:13px;color:var(--muted);padding:6px 14px;display:flex;justify-content:space-between}
.st b.ok{color:var(--accent)}.st b.err{color:var(--warn)}
.wrap{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;padding:10px 14px 20px}
.fc{background:var(--card);border:2px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 10px;min-height:300px}
.fn{font-size:clamp(30px,5vw,52px);font-weight:900}
.fv{font-size:clamp(80px,18vw,170px);font-weight:900;line-height:1.05;color:var(--accent)}
.fv.z{color:var(--muted)}
.sb{display:flex;gap:10px;width:100%;margin-top:12px}
.sb button{flex:1;height:130px;border-radius:20px;border:3px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:64px;font-weight:900;cursor:pointer;touch-action:manipulation}
.sb .plus{flex:2;background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.rs{margin-top:8px;min-height:52px;padding:0 24px;border:0;background:none;color:var(--muted);font:inherit;font-size:20px;font-weight:700;text-decoration:underline;cursor:pointer}
.all{padding:0 14px 16px}
.all button{width:100%;height:68px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--muted);font:inherit;font-size:22px;font-weight:800;cursor:pointer}
body.v .fc{min-height:0}
.login{max-width:360px;margin:12vh auto;padding:0 20px}
.login h1{font-size:24px}.inp{width:100%;height:52px;margin:6px 0;border:2px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-size:18px;background:var(--card);color:var(--text)}
.lgo{width:100%;height:56px;margin-top:8px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-text);font:inherit;font-size:20px;font-weight:800}
.lerr{color:var(--warn);min-height:22px;font-weight:700}
</style></head><body>
<div id="login" class="login hide">
  <h1>생선구이 현황 로그인</h1>
  <input id="em" class="inp" type="email" placeholder="이메일" autocomplete="username">
  <input id="pw" class="inp" type="password" placeholder="비밀번호" autocomplete="current-password">
  <div class="lerr" id="lerr"></div>
  <button class="lgo" id="lgo">로그인</button>
</div>
<div id="app" class="hide" style="display:contents">
  <div class="st"><span><b id="net" class="err">연결 중…</b></span><span>직원용 · 누르면 주문 앱 손님 화면에 표시 · 버전 5</span></div>
  <div class="wrap" id="wrap"></div>
  <div class="all" id="all"><button id="rall" type="button">전체 0으로 되돌리기</button></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
var FIREBASE_CONFIG={apiKey:"AIzaSyC2zCKXtWxY9vgHf2bS_L1bvuXUUvKQpSA",authDomain:"house-order-a689f.firebaseapp.com",projectId:"house-order-a689f",storageBucket:"house-order-a689f.firebasestorage.app",messagingSenderId:"621901289473",appId:"1:621901289473:web:952c5951744cd9f5b40800"};
var FISH=[{k:"mack",n:"고등어"},{k:"sam",n:"삼치"},{k:"gal",n:"갈치"},{k:"gul",n:"영광굴비"}];
var $=function(i){return document.getElementById(i)},auth,fs,cnt={mack:0,sam:0,gal:0,gul:0},mode="staff",unsub=null;
function ref(){return fs.collection("orders").doc("fish_state")}
function mark(o){o.time=Date.now();o.ts=o.time;o.closed=true;o.status="done";o.items=[];o.table="";return o}
function net(t,c){$("net").textContent=t;$("net").className=c}
function draw(){
  var v=mode==="view";document.body.classList.toggle("v",v);
  $("all").classList.toggle("hide",v);
  $("wrap").innerHTML=FISH.map(function(f){
    var n=cnt[f.k]||0;
    return '<div class="fc"><div class="fn">'+f.n+'</div><div class="fv'+(n?'':' z')+'" aria-live="polite">'+n+'</div>'+
      (v?'':'<div class="sb"><button type="button" data-k="'+f.k+'" data-d="-1" aria-label="'+f.n+' 1 빼기">−</button><button type="button" class="plus" data-k="'+f.k+'" data-d="1" aria-label="'+f.n+' 1 더하기">＋</button></div><button type="button" class="rs" data-k="'+f.k+'" data-d="0">0으로</button>')+'</div>';
  }).join("");
}
function change(k,d){
  var upd={};
  var next=d===0?0:Math.max(0,(cnt[k]||0)+d);
  cnt[k]=next;draw();
  upd[k]=d===0?0:firebase.firestore.FieldValue.increment(d);
  mark(upd);
  ref().set(upd,{merge:true}).catch(function(){net("저장 실패 — 인터넷을 확인하세요","err")});
}
$("wrap").addEventListener("click",function(e){var b=e.target.closest("[data-k]");if(!b)return;change(b.dataset.k,+b.dataset.d)});
$("rall").onclick=function(){if(!confirm("전체를 0으로 되돌릴까요?"))return;FISH.forEach(function(f){cnt[f.k]=0});draw();ref().set(mark({mack:0,sam:0,gal:0,gul:0}),{merge:true})};
function setMode(m){mode=m;draw()}
function start(){
  $("login").classList.add("hide");$("app").classList.remove("hide");
  setMode("staff");
  unsub=ref().onSnapshot(function(s){
    var d=s.exists?s.data():{};
    FISH.forEach(function(f){cnt[f.k]=Math.max(0,+d[f.k]||0)});
    draw();net(s.metadata.fromCache?"연결 확인 중…":"● 실시간 연결됨",s.metadata.fromCache?"err":"ok");
  },function(){net("연결 실패 — 로그인/권한을 확인하세요","err")});
}
function showLogin(msg){$("app").classList.add("hide");$("login").classList.remove("hide");$("lerr").textContent=msg||""}
function doLogin(){$("lerr").textContent="";auth.signInWithEmailAndPassword($("em").value.trim(),$("pw").value).catch(function(){$("lerr").textContent="이메일 또는 비밀번호가 맞지 않아요."})}
$("lgo").onclick=doLogin;$("pw").addEventListener("keydown",function(e){if(e.key==="Enter")doLogin()});
firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();fs=firebase.firestore();
auth.onAuthStateChanged(function(u){if(u)start();else{if(unsub){unsub();unsub=null}showLogin()}});
</script></body></html>
