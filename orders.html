<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>배달·포장 주문 접수</title>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e8;--card:#fff;--ink:#1f1a15;--soft:#6f6358;--line:#e3d7c4;--red:#c3321c;--ok:#2f7d4f;--blue:#2556a8;--amber:#b7791f;--chip:#f4eadb}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Noto Sans KR",system-ui,sans-serif}
button,input,textarea{font:inherit}
button{touch-action:manipulation;cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.top h1{font:400 24px "Do Hyeon",sans-serif;margin:0;flex:1 1 auto}
.top button{border:0;border-radius:10px;padding:9px 14px;font-weight:700;background:#fff;color:var(--ink);min-height:40px}
.top button.on{background:var(--ok);color:#fff}
#muteBtn{background:#ffd34d;color:var(--ink);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.tabs{display:flex;gap:8px;padding:12px 16px 0;overflow-x:auto}
.tabs button{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:700;min-height:42px}
.tabs button.on{background:var(--red);border-color:var(--red);color:#fff}
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:12px 16px 0}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.sum small{display:block;color:var(--soft);font-size:13px}
.sum b{font-size:18px;white-space:nowrap}
h2{font:400 22px "Do Hyeon",sans-serif;margin:18px 16px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;padding:0 16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card.new{border-color:var(--red);box-shadow:0 0 0 4px rgba(195,50,28,.12)}
.head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.code{font:400 26px "Do Hyeon",sans-serif}
.tag{border-radius:999px;padding:3px 10px;font-size:14px;font-weight:700;color:#fff}
.t-delivery{background:var(--blue)}.t-pickup{background:var(--amber)}.t-table{background:var(--ok)}
.time{margin-left:auto;color:var(--soft);font-size:14px}
.edited{font-size:13px;color:var(--blue);font-weight:700}
.items{margin:0;padding:6px 0;list-style:none;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line)}
.items li{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.items b{white-space:nowrap}
.line{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.line span:first-child{color:var(--soft);flex:none}
.line a{color:var(--blue);font-weight:700}
.pay{font-weight:700}
.memo{background:#fff6d6;border-radius:10px;padding:8px 10px;font-size:15px}
.total{font-size:18px;font-weight:700;text-align:right}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts button{flex:1;border:0;border-radius:12px;padding:12px;font-weight:700;min-height:48px;color:#fff;background:var(--ink)}
.acts .go{background:var(--red)}
.acts .sub{flex:0 0 auto;background:#eee;color:var(--ink)}
.acts .warn{flex:0 0 auto;background:#eee;color:var(--red)}
.acts .warn.sure{background:var(--red);color:#fff}
.st{font-weight:700;color:var(--soft);font-size:14px}
.empty{padding:6px 16px;color:var(--soft)}
.login{max-width:380px;margin:60px auto;padding:0 16px}
.login input{display:block;width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;margin-top:10px;font-size:16px}
.login button{width:100%;margin-top:14px;border:0;border-radius:12px;padding:14px;background:var(--red);color:#fff;font-weight:700;font-size:17px}
.err{color:var(--red);min-height:22px;margin-top:8px}
.hide{display:none!important}
details{margin:0 16px 40px}
summary{font:400 20px "Do Hyeon",sans-serif;padding:10px 0;cursor:pointer}
/* 수정 창 */
.modal{position:fixed;inset:0;z-index:30;background:rgba(31,26,21,.45);display:flex;align-items:flex-end;justify-content:center;opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
.modal.on{opacity:1;visibility:visible;transition:opacity .2s}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:0 16px 20px;transform:translateY(30px);transition:transform .25s;overscroll-behavior:contain}
.modal.on .sheet{transform:none}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:20px}}
.shead{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:10px;padding:14px 0 10px;border-bottom:1px solid var(--line);z-index:2}
.shead h3{font:400 24px "Do Hyeon",sans-serif;margin:0;flex:1}
.shead button{border:0;background:var(--chip);border-radius:10px;height:42px;padding:0 14px;font-weight:700}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px}
.box h4{margin:0 0 8px;font-size:16px}
.erow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed var(--line)}
.erow:first-child{border-top:0}
.erow .nm{flex:1}
.erow small{display:block;color:var(--soft)}
.step{display:flex;align-items:center;gap:4px}
.step button{border:1.5px solid var(--line);background:var(--card);border-radius:10px;width:40px;height:40px;font-size:20px;font-weight:700}
.step b{min-width:24px;text-align:center}
.del{border:0;background:none;color:var(--red);font-weight:700;padding:8px;min-height:40px}
.find{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;margin-top:8px;font-size:16px}
.found button{display:flex;justify-content:space-between;width:100%;border:0;border-bottom:1px dashed var(--line);background:none;padding:10px 4px;text-align:left}
.found button:active{background:var(--chip)}
.seg{display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:8px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0}
.seg span{display:block;text-align:center;padding:10px 6px;border:1.5px solid var(--line);border-radius:10px;font-weight:700;font-size:15px}
.seg input:checked+span{border-color:var(--red);background:var(--red);color:#fff}
.field{display:block;margin-top:8px}
.field span{display:block;font-size:14px;color:var(--soft);margin-bottom:3px}
.field input,.field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:16px}
.field textarea{min-height:64px;resize:vertical}
.save{display:block;width:100%;border:0;background:var(--red);color:#fff;border-radius:14px;padding:16px;font-weight:700;font-size:17px;margin-top:14px}
.save:disabled{opacity:.5}
.etotal{display:flex;justify-content:space-between;font-weight:700;font-size:18px;padding-top:8px;border-top:1px solid var(--line);margin-top:6px}
.state{border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px;background:#555}
.state.open{background:var(--ok)}.state.shut{background:var(--red)}
.paid{background:#e7f1ea;color:var(--ok);border-radius:8px;padding:3px 8px;font-size:14px;font-weight:700;margin-left:6px}
.unpaid{background:#fdecea;color:var(--red);border-radius:8px;padding:3px 8px;font-size:14px;font-weight:700;margin-left:6px}
.money{font-size:15px}
.money .line b{white-space:nowrap}
.money .dc{color:var(--red)}
.hrow{display:grid;grid-template-columns:44px 74px minmax(0,1fr) 14px minmax(0,1fr);gap:6px;align-items:center;padding:6px 0;border-top:1px dashed var(--line)}
.hrow:first-of-type{border-top:0}
.hrow b{font-size:17px}
.hrow select{width:100%;padding:9px 4px;border:1.5px solid var(--line);border-radius:8px;font-size:16px;background:#fff;color:var(--ink)}
.hrow select:disabled{opacity:.35}
.tog{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700}
.tog input{width:20px;height:20px;accent-color:var(--red)}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,.8fr) auto 36px;gap:6px;align-items:center;padding:5px 0;font-size:14px}
.trow input{width:100%;padding:9px 8px;border:1.5px solid var(--line);border-radius:8px;font-size:16px}
.tdel{border:0;background:#eee;border-radius:8px;height:36px;color:var(--red);font-weight:700}
.pause{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pause input{width:24px;height:24px;accent-color:var(--red)}
.sum{grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:600px){.sum{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div id="loginView" class="login hide">
  <h1 style="font:400 30px 'Do Hyeon',sans-serif">배달·포장 주문 접수</h1>
  <p style="color:var(--soft)">직원용 이메일 계정으로 로그인하세요.</p>
  <input id="email" type="email" placeholder="이메일" autocomplete="username">
  <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
  <button id="loginBtn">로그인</button>
  <p class="err" id="loginErr"></p>
</div>

<div id="app" class="hide">
  <div class="top">
    <h1>배달·포장 주문</h1>
    <span class="state" id="statePill">확인 중</span>
    <button id="setBtn">⚙ 영업시간·할인</button>
    <button id="muteBtn" class="hide">🔕 알림 멈추기</button>
    <button id="soundBtn">🔔 알림 소리 켜기</button>
    <button id="logout">로그아웃</button>
  </div>
  <div class="tabs" id="tabs">
    <button data-f="all" class="on">전체</button>
    <button data-f="delivery">배달</button>
    <button data-f="pickup">포장</button>
  </div>
  <div class="sum" id="sum"></div>
  <h2 id="newTitle">새 주문</h2><div class="grid" id="newList"></div>
  <h2 id="workTitle">진행 중</h2><div class="grid" id="workList"></div>
  <details><summary id="doneTitle">완료·취소</summary><div class="grid" id="doneList" style="padding:0"></div></details>
</div>

<!-- 주문 수정 창 -->
<div class="modal" id="modal">
  <div class="sheet">
    <div class="shead"><h3 id="eTitle">주문 수정</h3><button id="eClose">닫기</button></div>
    <div class="box"><h4>메뉴</h4>
      <div id="eItems"></div>
      <div class="etotal"><span>합계</span><span id="eTotal"></span></div>
      <input class="find" id="eFind" type="search" placeholder="메뉴 추가: 이름으로 찾기">
      <div class="found" id="eFound"></div>
    </div>
    <div class="box"><h4>받는 방법</h4>
      <div class="seg"><label><input type="radio" name="eHow" value="delivery"><span>배달</span></label><label><input type="radio" name="eHow" value="pickup"><span>포장</span></label></div>
      <label class="field"><span>이름</span><input id="eName"></label>
      <label class="field"><span>전화번호</span><input id="ePhone" type="tel" inputmode="numeric"></label>
      <label class="field" id="eAddrF"><span>배달 주소</span><input id="eAddr"></label>
    </div>
    <div class="box"><h4>결제</h4>
      <div class="seg" style="--n:3"><label><input type="radio" name="ePay" value="card"><span>카드</span></label><label><input type="radio" name="ePay" value="transfer"><span>계좌이체</span></label><label><input type="radio" name="ePay" value="cash"><span>현금</span></label></div>
      <label class="field" id="eDepF"><span>입금자명</span><input id="eDep"></label>
      <div id="eRcBox">
        <h4 style="margin:12px 0 8px">현금영수증</h4>
        <div class="seg" style="--n:3"><label><input type="radio" name="eRc" value="no"><span>필요 없음</span></label><label><input type="radio" name="eRc" value="personal"><span>개인</span></label><label><input type="radio" name="eRc" value="business"><span>사업자</span></label></div>
        <label class="field" id="eRcF"><span id="eRcL">휴대폰 번호</span><input id="eRcNo" inputmode="numeric"></label>
      </div>
    </div>
    <div class="box"><h4>요청사항</h4><label class="field" style="margin-top:0"><textarea id="eMemo"></textarea></label></div>
    <p class="err" id="eErr"></p>
    <button class="save" id="eSave">수정 저장</button>
  </div>
</div>

<!-- 영업시간·할인 설정 창 -->
<div class="modal" id="setModal">
  <div class="sheet">
    <div class="shead"><h3>영업시간·할인 설정</h3><button id="sClose">닫기</button></div>
    <div class="box">
      <div class="pause"><div><b>지금 주문 잠시 멈추기</b><div style="font-size:13px;color:var(--soft)">바쁠 때 켜면 영업시간이어도 손님 주문이 막혀요.</div></div><input type="checkbox" id="sPause"></div>
    </div>
    <div class="box"><h4>요일별 주문 받는 시간</h4><div id="sHours"></div>
      <p style="font-size:13px;color:var(--soft);margin:8px 0 0">마감 시간이 시작보다 이르면 다음 날 새벽까지로 계산해요.</p>
    </div>
    <div class="box"><h4>최소 주문금액·할인</h4>
      <p style="font-size:13px;color:var(--soft);margin:0 0 6px">상품 금액이 기준 이상이면 결제 금액에서 한 번 할인돼요. 여러 구간에 해당하면 가장 큰 할인 하나만 적용돼요.</p>
      <label class="field" style="margin:0 0 12px"><span>최소 주문금액 (원, 이 금액보다 적으면 손님이 주문할 수 없어요. 0이면 제한 없음)</span><input id="sMin" type="number" inputmode="numeric" min="0" step="1000"></label>
      <div id="sTiers"></div>
      <button type="button" id="sAddTier" style="margin-top:8px;border:1.5px dashed var(--line);background:#fff;border-radius:10px;padding:10px;width:100%;font-weight:700">+ 할인 구간 추가</button>
    </div>
    <p class="err" id="sErr"></p>
    <button class="save" id="sSave">설정 저장</button>
  </div>
</div>

// ===== 영업시간·할인 설정 =====
const DAYS = ["일", "월", "화", "수", "목", "금", "토"];
const DEFAULTS = { hours: { 0: { closed: true, open: "10:00", close: "20:00" } }, paused: false, minOrder: 15000, tiers: [{ min: 15000, amount: 3000 }, { min: 35000, amount: 5000 }, { min: 50000, amount: 7000 }] };
let S = DEFAULTS, unsubS = null;
// 결제 금액 구간별 할인: 상품 금액이 min 이상이면 amount 할인 (가장 큰 구간 하나만)
const tiersOf = s => (Array.isArray(s.tiers) ? s.tiers : (s.discount ? [{ min: s.discountMin || 0, amount: s.discount }] : []))
  .filter(t => t.amount > 0).sort((a, b) => a.min - b.min);
const tierDiscount = (s, sub) => { let d = 0; for (const t of tiersOf(s)) if (sub > 0 && sub >= t.min) d = Math.max(d, t.amount); return Math.min(d, sub); };
const nextTier = (s, sub) => tiersOf(s).find(t => t.min > sub && t.amount > tierDiscount(s, sub));
const dayHours = d => (S.hours || {})[d] || { closed: false, open: "00:00", close: "24:00" };
function shopOpen() {
  if (S.paused) return false;
  const k = new Date(Date.now() + 9 * 3600e3), h = dayHours(k.getUTCDay()), hm = k.toISOString().slice(11, 16);
  if (h.closed) return false;
  return h.close > h.open ? (hm >= h.open && hm < h.close) : (hm >= h.open || hm < h.close);
}
function showState() {
  const o = shopOpen();
  $("statePill").textContent = S.paused ? "주문 멈춤" : o ? "주문 받는 중" : "영업시간 아님";
  $("statePill").className = "state " + (o ? "open" : "shut");
}
function listenSettings() {
  unsubS = onSnapshot(doc(db, "settings", "shop"), s => { S = s.exists() ? { ...DEFAULTS, ...s.data() } : DEFAULTS; showState(); },
    e => { console.error(e); $("statePill").textContent = "설정 규칙 확인 필요"; });
}
setInterval(showState, 30000);
const TIMES = Array.from({ length: 49 }, (_, k) => String(Math.floor(k / 2)).padStart(2, "0") + (k % 2 ? ":30" : ":00"));
const timeOpts = v => (TIMES.includes(v) ? TIMES : [...TIMES, v].sort()).map(t => `<option ${t === v ? "selected" : ""}>${t}</option>`).join("");
$("setBtn").onclick = () => {
  $("sPause").checked = !!S.paused;
  drawTiers(tiersOf(S));
  $("sMin").value = S.minOrder ?? 15000;
  $("sHours").innerHTML = DAYS.map((d, i) => {
    const h = dayHours(i), op = h.open === "00:00" && h.close === "24:00" ? "10:00" : h.open, cl = h.close === "24:00" ? "21:00" : h.close;
    return `<div class="hrow"><b>${d}</b><label class="tog"><input type="checkbox" data-day="${i}" class="sOff" ${h.closed ? "checked" : ""}>휴무</label>
      <select id="sO${i}" ${h.closed ? "disabled" : ""}>${timeOpts(op)}</select><span>~</span><select id="sC${i}" ${h.closed ? "disabled" : ""}>${timeOpts(cl)}</select></div>`;
  }).join("");
  $("sErr").textContent = "";

};
$("sHours").addEventListener("change", e => {

});
function drawTiers(ts) {
  $("sTiers").innerHTML = ts.map(t => `<div class="trow"><input class="tmin" type="number" inputmode="numeric" step="1000" value="${t.min}" aria-label="기준 금액"><span>원 이상 →</span><input class="tamt" type="number" inputmode="numeric" step="500" value="${t.amount}" aria-label="할인 금액"><span>원 할인</span><button type="button" class="tdel" aria-label="구간 삭제">✕</button></div>`).join("") || `<p style="color:var(--soft);font-size:14px">할인 없음</p>`;
}
const readTiers = () => [...document.querySelectorAll("#sTiers .trow")].map(r => ({ min: +r.querySelector(".tmin").value || 0, amount: +r.querySelector(".tamt").value || 0 }));
$("sAddTier").onclick = () => { const ts = readTiers(); const last = ts[ts.length - 1]; ts.push({ min: last ? last.min + 10000 : 15000, amount: last ? last.amount + 1000 : 3000 }); drawTiers(ts); };
$("sTiers").addEventListener("click", e => { const d = e.target.closest(".tdel"); if (!d) return; d.closest(".trow").remove(); if (!readTiers().length) drawTiers([]); });

    const closed = document.querySelector(`.sOff[data-day="${i}"]`).checked, open = $("sO" + i).value, close = $("sC" + i).value;
    if (!closed && (!open || !close || open === close)) { $("sErr").textContent = `${DAYS[i]}요일 시간을 확인해 주세요.`; return; }
    hours[i] = { closed, open: open || "10:00", close: close || "20:00" };
  }
  const tiers = [...document.querySelectorAll("#sTiers .trow")].map(r => ({ min: Math.max(0, parseInt(r.querySelector(".tmin").value, 10) || 0), amount: Math.max(0, parseInt(r.querySelector(".tamt").value, 10) || 0) }))
    .filter(t => t.amount > 0).sort((a, b) => a.min - b.min);
  $("sSave").disabled = true; $("sSave").textContent = "저장 중…";
  try { await setDoc(doc(db, "settings", "shop"), { hours, paused: $("sPause").checked, minOrder: Math.max(0, parseInt($("sMin").value, 10) || 0), tiers, updatedAt: serverTimestamp() }); closeSet(); }
  catch (err) { console.error(err); $("sErr").textContent = "저장하지 못했어요. Firebase 규칙에 settings가 추가됐는지 확인해 주세요."; }
  finally { $("sSave").disabled = false; $("sSave").textContent = "설정 저장"; }
};
function listen() {
  const kst = new Date(Date.now() + 9 * 3600e3);
  const start = new Date(Date.UTC(kst.getUTCFullYear(), kst.getUTCMonth(), kst.getUTCDate()) - 9 * 3600e3);
  const q = query(collection(db, "onlineOrders"), where("createdAt", ">=", Timestamp.fromDate(start)), orderBy("createdAt", "desc"));
  unsub = onSnapshot(q, snap => {
    orders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
    ringCheck();
  }, e => { console.error(e); $("newList").innerHTML = `<p class="empty">주문을 불러오지 못했어요. Firestore 규칙을 확인해 주세요.</p>`; });
}

// ===== 알림: "주문 왔어요" 음성 + 띵동 소리 =====
// 새 주문이 들어오면 접수할 때까지 5초마다 반복하고, 주문 들어온 지 2분이 지나면 멈춰요.
const RING_MS = 2 * 60 * 1000, EVERY_MS = 5000;
let ac = null, soundOn = false, ringTimer = null, wake = null;
const muted = new Set();
const pendingRing = () => orders.filter(o => o.status === "new" && !muted.has(o.id) &&
  Date.now() - (o.createdAt?.toMillis ? o.createdAt.toMillis() : o.createdAt?.toDate ? o.createdAt.toDate().getTime() : Date.now()) < RING_MS);
function koVoice() { try { return speechSynthesis.getVoices().find(v => /^ko/i.test(v.lang)); } catch { return null; } }
function speak(text) {
  try {
    if (!("speechSynthesis" in window)) return false;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ko-KR"; u.rate = 1; u.pitch = 1.05; u.volume = 1;
    const v = koVoice(); if (v) u.voice = v;
    speechSynthesis.speak(u); return true;
  } catch { return false; }
}
function dingdong() {
  if (!ac) return;
  [[0, 988], [0.28, 784]].forEach(([t, f]) => { const o = ac.createOscillator(), g = ac.createGain(); o.type = "sine"; o.frequency.value = f; o.connect(g); g.connect(ac.destination); g.gain.setValueAtTime(0.5, ac.currentTime + t); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + t + 0.6); o.start(ac.currentTime + t); o.stop(ac.currentTime + t + 0.6); });
}
function ringOnce() {
  const n = pendingRing().length; if (!n) return stopRing();
  if (soundOn) { dingdong(); setTimeout(() => speak(n > 1 ? `주문 ${n}건 왔어요` : "주문 왔어요"), 700); }
  try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch {}
  document.title = document.title.startsWith("🔔") ? "배달·포장 주문 접수" : `🔔 새 주문 ${n}건!`;
}
function ringCheck() {
  const n = pendingRing().length;
  $("muteBtn").classList.toggle("hide", !n);
  if (n && !ringTimer) { ringOnce(); ringTimer = setInterval(ringOnce, EVERY_MS); }
  if (!n) stopRing();
}
function stopRing() { clearInterval(ringTimer); ringTimer = null; document.title = "배달·포장 주문 접수"; $("muteBtn").classList.add("hide"); try { speechSynthesis.cancel(); } catch {} }
setInterval(ringCheck, 15000); // 2분이 지나면 저절로 멈추도록 확인
$("muteBtn").onclick = () => { pendingRing().forEach(o => muted.add(o.id)); stopRing(); };
async function keepAwake() { try { if (soundOn && "wakeLock" in navigator && document.visibilityState === "visible") wake = await navigator.wakeLock.request("screen"); } catch {} }
document.addEventListener("visibilitychange", keepAwake);
$("soundBtn").onclick = () => {
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch {}
  soundOn = true; dingdong(); setTimeout(() => speak("주문 알림을 켰어요"), 700);
  keepAwake();
  $("soundBtn").textContent = "🔔 알림 켜짐"; $("soundBtn").classList.add("on");
};
try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; } catch {}

$("tabs").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  filter = b.dataset.f;
  $("tabs").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  render();
};

function payText(o) {
  if (o.type === "table") return "카운터 계산";
  const p = o.payment || {};
  if (p.method === "card") return "💳 카드 (받을 때 결제)";
  let t = p.method === "transfer" ? `🏦 계좌이체${p.depositor ? " (입금자 " + esc(p.depositor) + ")" : ""}${p.paid ? '<span class="paid">입금 확인</span>' : '<span class="unpaid">입금 전</span>'}` : "💵 현금 (받을 때 결제)";
  t += p.receipt ? ` · 현금영수증 ${p.receiptType === "business" ? "사업자" : "개인"} ${esc(p.receiptType === "business" ? p.receiptNo : fmtPhone(p.receiptNo))}` : " · 현금영수증 필요 없음";
  return t;
}
function nextAction(o) {
  if (o.status === "new") return ["accepted", "접수하기"];
  if (o.status === "accepted") return ["ready", "조리 완료"];
  if (o.status === "ready") return o.type === "delivery" ? ["out", "배달 출발"] : ["done", o.type === "table" ? "서빙 완료" : "손님 픽업 완료"];
  if (o.status === "out") return ["done", "배달 완료"];
  return null;
}
function card(o) {
  const t = o.createdAt?.toDate ? o.createdAt.toDate() : new Date();
  const time = t.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Seoul" });
  const c = o.customer || {}, act = nextAction(o);
  const closed = ["done", "canceled"].includes(o.status);
  return `<div class="card ${o.status === "new" ? "new" : ""}">
    <div class="head"><span class="code">${esc(o.code)}</span><span class="tag t-${o.type}">${TYPE[o.type] || ""}${o.type === "table" ? " " + esc(o.table) + "번" : ""}</span><span class="st">${ST[o.status] || ""}</span>${o.editedAt ? `<span class="edited">수정됨</span>` : ""}<span class="time">${time}</span></div>
    <ul class="items">${(o.items || []).map(i => `<li><span>${esc(i.name)}</span><b>× ${i.qty}</b></li>`).join("")}</ul>
    ${o.discount ? `<div class="money"><div class="line"><span>상품 금액</span><b>${won(o.subtotal)}</b></div><div class="line dc"><span>할인</span><b>−${won(o.discount)}</b></div></div>` : ""}
    <div class="total">${o.discount ? "결제 " : ""}${won(o.total)}</div>
    ${o.type !== "table" ? `
      ${c.name ? `<div class="line"><span>이름</span><b>${esc(c.name)}</b></div>` : ""}
      <div class="line"><span>전화</span><a href="tel:${esc(c.phone)}">${esc(fmtPhone(c.phone))}</a></div>
      ${o.type === "delivery" ? `<div class="line"><span>주소</span><b style="text-align:right">${esc(c.address)}</b></div>` : ""}` : ""}
    <div class="pay">${payText(o)}</div>
    ${o.memo ? `<div class="memo">요청: ${esc(o.memo)}</div>` : ""}
    <div class="acts">
      ${act ? `<button class="go" data-id="${o.id}" data-to="${act[0]}">${act[1]}</button>` : ""}
      ${o.payment?.method === "transfer" && !o.payment?.paid && o.status !== "canceled" ? `<button class="sub" data-paid="${o.id}">입금 확인</button>` : ""}
      ${!closed ? `<button class="sub" data-edit="${o.id}">수정</button>` : ""}
      ${["new", "accepted"].includes(o.status) ? `<button class="warn" data-id="${o.id}" data-to="canceled">취소</button>` : ""}
      ${closed ? `<button class="sub" data-id="${o.id}" data-to="accepted">되돌리기</button><button class="warn" data-delete="${o.id}">삭제</button>` : ""}
    </div>
  </div>`;
}
function render() {
  const list = orders.filter(o => filter === "all" || o.type === filter);
  const g = { n: list.filter(o => o.status === "new"), w: list.filter(o => ["accepted", "ready", "out"].includes(o.status)), d: list.filter(o => ["done", "canceled"].includes(o.status)) };
  $("newTitle").textContent = `새 주문 (${g.n.length})`;
  $("workTitle").textContent = `진행 중 (${g.w.length})`;
  $("doneTitle").textContent = `완료·취소 (${g.d.length})`;
  $("newList").innerHTML = g.n.map(card).join("") || `<p class="empty">새 주문이 없어요.</p>`;
  $("workList").innerHTML = g.w.map(card).join("") || `<p class="empty">진행 중인 주문이 없어요.</p>`;
  $("doneList").innerHTML = g.d.map(card).join("") || `<p class="empty">아직 없어요.</p>`;
  const live = orders.filter(o => o.status !== "canceled" && o.type !== "table");
  const sumBy = f => live.filter(f).reduce((s, o) => s + (o.total || 0), 0);
  $("sum").innerHTML = `
    <div><small>오늘 배달·포장</small><b>${live.length}건</b></div>
    <div><small>합계</small><b>${won(sumBy(() => true))}</b></div>
    <div><small>카드</small><b>${won(sumBy(o => o.payment?.method === "card"))}</b></div>
    <div><small>계좌이체</small><b>${won(sumBy(o => o.payment?.method === "transfer"))}</b></div>
    <div><small>현금 (영수증 ${live.filter(o => o.payment?.receipt).length}건)</small><b>${won(sumBy(o => o.payment?.method === "cash"))}</b></div>`;
}

// 버튼 처리: 상태 변경, 취소, 삭제, 수정
const confirmTap = (b, label) => {
  if (b.classList.contains("sure")) return true;
  b.classList.add("sure"); const old = b.textContent; b.textContent = label;
  setTimeout(() => { b.classList.remove("sure"); b.textContent = old; }, 3000);
  return false;
};
document.addEventListener("click", async e => {
  const pd = e.target.closest("[data-paid]");
  if (pd) {
    if (!confirmTap(pd, "입금 확인했나요?")) return;
    pd.disabled = true;
    try { await updateDoc(doc(db, "onlineOrders", pd.dataset.paid), { "payment.paid": true }); } catch (err) { console.error(err); pd.disabled = false; }
    return;
  }
  const ed = e.target.closest("[data-edit]");
  if (ed) { openEdit(ed.dataset.edit); return; }
  const del = e.target.closest("[data-delete]");
  if (del) {
    if (!confirmTap(del, "정말 삭제?")) return;
    del.disabled = true;
    try { await deleteDoc(doc(db, "onlineOrders", del.dataset.delete)); } catch (err) { console.error(err); del.disabled = false; del.textContent = "다시 눌러주세요"; }
    return;
  }
  const b = e.target.closest("button[data-to]"); if (!b) return;
  if (b.dataset.to === "canceled" && !confirmTap(b, "정말 취소?")) return;
  b.disabled = true;
  try { await updateDoc(doc(db, "onlineOrders", b.dataset.id), { status: b.dataset.to }); }
  catch (err) { console.error(err); b.disabled = false; b.textContent = "다시 눌러주세요"; }
});

// ===== 주문 수정 =====
let edit = null; // { id, type, items:[{name,price,qty}] }
const radio = (name, v) => { const r = document.querySelector(`input[name=${name}][value="${v}"]`); if (r) r.checked = true; };
const val = name => document.querySelector(`input[name=${name}]:checked`)?.value;
function openEdit(id) {
  const o = orders.find(x => x.id === id); if (!o) return;
  edit = { id, type: o.type, discount: o.discount || 0, paid: !!o.payment?.paid, items: (o.items || []).map(i => ({ ...i, price: Number(i.price ?? ALL.find(m => m.name === i.name)?.price) || 0 })) };
  $("eTitle").textContent = `${o.code} 주문 수정`;
  const c = o.customer || {}, p = o.payment || {};
  radio("eHow", o.type === "delivery" ? "delivery" : "pickup");
  $("eName").value = c.name || ""; $("ePhone").value = c.phone || ""; $("eAddr").value = c.address || "";
  radio("ePay", p.method || "card");
  radio("eRc", p.receipt ? (p.receiptType || "personal") : "no");
  $("eRcNo").value = p.receiptNo || "";
  $("eDep").value = p.depositor || "";
  $("eMemo").value = o.memo || "";
  $("eFind").value = ""; $("eFound").innerHTML = ""; $("eErr").textContent = "";
  document.querySelectorAll("#modal .box")[1].classList.toggle("hide", o.type === "table");
  document.querySelectorAll("#modal .box")[2].classList.toggle("hide", o.type === "table");
  syncEdit(); drawItems();
  $("modal").classList.add("on"); $("modal").querySelector(".sheet").scrollTop = 0; document.body.style.overflow = "hidden";
}
function closeEdit() { $("modal").classList.remove("on"); document.body.style.overflow = ""; edit = null; }
$("eClose").onclick = closeEdit;
$("modal").addEventListener("click", e => { if (e.target === $("modal")) closeEdit(); });
const eSub = () => edit.items.reduce((s, i) => s + i.price * i.qty, 0);
const eDisc = () => tierDiscount(S, eSub());
const eTotal = () => eSub() - eDisc();
function drawItems() {
  $("eItems").innerHTML = edit.items.map((i, k) => `<div class="erow"><span class="nm">${esc(i.name)}<small>${won(i.price)}</small></span>
    <div class="step"><button data-eq="${k}" data-d="-1" aria-label="빼기">−</button><b>${i.qty}</b><button data-eq="${k}" data-d="1" aria-label="더하기">+</button></div>
    <button class="del" data-erm="${k}">삭제</button></div>`).join("") || `<p class="empty" style="padding:6px 0">메뉴가 없어요. 아래에서 추가하세요.</p>`;
  $("eTotal").textContent = eDisc() ? `${won(eSub())} − 할인 ${won(eDisc())} = ${won(eTotal())}` : won(eTotal());
}
$("eItems").addEventListener("click", e => {
  const q = e.target.closest("[data-eq]"), rm = e.target.closest("[data-erm]");
  if (q) { const it = edit.items[+q.dataset.eq]; it.qty = Math.max(1, Math.min(30, it.qty + +q.dataset.d)); drawItems(); }
  if (rm) { edit.items.splice(+rm.dataset.erm, 1); drawItems(); }
});
$("eFind").addEventListener("input", () => {
  const w = $("eFind").value.replace(/\s/g, "");
  const hits = w ? ALL.filter(m => m.name.replace(/\s/g, "").includes(w)).slice(0, 8) : [];
  $("eFound").innerHTML = hits.map((m, k) => `<button data-add="${ALL.indexOf(m)}"><span>+ ${esc(m.name)}</span><b>${won(m.price)}</b></button>`).join("");
});
$("eFound").addEventListener("click", e => {
  const b = e.target.closest("[data-add]"); if (!b) return;
  const m = ALL[+b.dataset.add];
  const ex = edit.items.find(i => i.name === m.name && i.price === m.price);
  if (ex) ex.qty = Math.min(30, ex.qty + 1); else edit.items.push({ name: m.name, price: m.price, qty: 1 });
  $("eFind").value = ""; $("eFound").innerHTML = ""; drawItems();
});
function syncEdit() {
  $("eAddrF").classList.toggle("hide", val("eHow") !== "delivery");
  $("eRcBox").classList.toggle("hide", val("ePay") === "card");
  $("eDepF").classList.toggle("hide", val("ePay") !== "transfer");
  const rc = val("eRc");
  $("eRcF").classList.toggle("hide", rc === "no");
  $("eRcL").textContent = rc === "business" ? "사업자등록번호 (10자리)" : "휴대폰 번호";
}
document.querySelectorAll("#modal input[type=radio]").forEach(r => r.addEventListener("change", syncEdit));
$("eSave").onclick = async () => {
  if (!edit) return;
  $("eErr").textContent = "";
  if (!edit.items.length) { $("eErr").textContent = "메뉴가 하나 이상 있어야 해요. 주문을 없애려면 취소를 누르세요."; return; }
  const upd = { items: edit.items, subtotal: eSub(), discount: eDisc(), total: eTotal(), memo: $("eMemo").value.trim().slice(0, 300), editedAt: serverTimestamp() };
  if (edit.type !== "table") {
    const type = val("eHow"), phone = digits($("ePhone").value), address = $("eAddr").value.trim();
    if (phone.length < 10 || phone.length > 11) { $("eErr").textContent = "전화번호를 확인해 주세요."; return; }
    if (type === "delivery" && address.length < 5) { $("eErr").textContent = "배달 주소를 입력해 주세요."; return; }
    upd.type = type;
    upd.customer = { name: $("eName").value.trim().slice(0, 30), phone, address: type === "delivery" ? address.slice(0, 150) : "" };
    const pay = { method: val("ePay"), receipt: false };
    const rc = val("eRc");
    if (pay.method === "transfer") { pay.depositor = $("eDep").value.trim().slice(0, 30); pay.paid = edit.paid; }
    if (pay.method !== "card" && rc !== "no") {
      const no = digits($("eRcNo").value);
      if (rc === "business" ? no.length !== 10 : (no.length < 10 || no.length > 11)) { $("eErr").textContent = rc === "business" ? "사업자등록번호 10자리를 확인해 주세요." : "현금영수증 휴대폰 번호를 확인해 주세요."; return; }
      Object.assign(pay, { receipt: true, receiptType: rc, receiptNo: no });
    }
    upd.payment = pay;
  }
  $("eSave").disabled = true; $("eSave").textContent = "저장 중…";
  try { await updateDoc(doc(db, "onlineOrders", edit.id), upd); closeEdit(); }
  catch (err) { console.error(err); $("eErr").textContent = "저장하지 못했어요. 인터넷 연결을 확인하고 다시 눌러주세요."; }
  finally { $("eSave").disabled = false; $("eSave").textContent = "수정 저장"; }
};
</script>
