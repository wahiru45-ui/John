<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>배달·포장 주문 접수</title>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e8;--card:#fff;--ink:#1f1a15;--soft:#6f6358;--line:#e3d7c4;--red:#c3321c;--ok:#2f7d4f;--blue:#2556a8;--amber:#b7791f}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Noto Sans KR",system-ui,sans-serif}
button,input{font:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.top h1{font:400 24px "Do Hyeon",sans-serif;margin:0;flex:1 1 auto}
.top button{border:0;border-radius:10px;padding:9px 14px;font-weight:700;background:#fff;color:var(--ink);min-height:40px}
.top button.on{background:var(--ok);color:#fff}
.tabs{display:flex;gap:8px;padding:12px 16px 0;overflow-x:auto}
.tabs button{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:700;min-height:42px}
.tabs button.on{background:var(--red);border-color:var(--red);color:#fff}
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:12px 16px 0}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.sum small{display:block;color:var(--soft);font-size:13px}
.sum b{font-size:18px;white-space:nowrap}
h2{font:400 22px "Do Hyeon",sans-serif;margin:18px 16px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;padding:0 16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card.new{border-color:var(--red);box-shadow:0 0 0 4px rgba(195,50,28,.12)}
.head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.code{font:400 26px "Do Hyeon",sans-serif}
.tag{border-radius:999px;padding:3px 10px;font-size:14px;font-weight:700;color:#fff}
.t-delivery{background:var(--blue)}.t-pickup{background:var(--amber)}.t-table{background:var(--ok)}
.time{margin-left:auto;color:var(--soft);font-size:14px}
.items{margin:0;padding:0;list-style:none;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:6px 0}
.items li{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.items b{white-space:nowrap}
.line{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.line span:first-child{color:var(--soft);flex:none}
.line a{color:var(--blue);font-weight:700}
.pay{font-weight:700}
.memo{background:#fff6d6;border-radius:10px;padding:8px 10px;font-size:15px}
.total{font-size:18px;font-weight:700;text-align:right}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts button{flex:1;border:0;border-radius:12px;padding:12px;font-weight:700;min-height:48px;color:#fff;background:var(--ink)}
.acts .go{background:var(--red)}
.acts .cancel{flex:0 0 auto;background:#eee;color:var(--soft)}
.st{font-weight:700;color:var(--soft);font-size:14px}
.empty{padding:6px 16px;color:var(--soft)}
.login{max-width:380px;margin:60px auto;padding:0 16px}
.login input{display:block;width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;margin-top:10px;font-size:16px}
.login button{width:100%;margin-top:14px;border:0;border-radius:12px;padding:14px;background:var(--red);color:#fff;font-weight:700;font-size:17px}
.err{color:var(--red);min-height:22px;margin-top:8px}
.hide{display:none!important}
details{margin:0 16px 40px}
summary{font:400 20px "Do Hyeon",sans-serif;padding:10px 0;cursor:pointer}
@media(max-width:600px){.sum{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div id="loginView" class="login hide">
  <h1 style="font:400 30px 'Do Hyeon',sans-serif">배달·포장 주문 접수</h1>
  <p style="color:var(--soft)">직원용 이메일 계정으로 로그인하세요.</p>
  <input id="email" type="email" placeholder="이메일" autocomplete="username">
  <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
  <button id="loginBtn">로그인</button>
  <p class="err" id="loginErr"></p>
</div>

<div id="app" class="hide">
  <div class="top">
    <h1>배달·포장 주문</h1>
    <button id="soundBtn">🔔 알림 소리 켜기</button>
    <button id="logout">로그아웃</button>
  </div>
  <div class="tabs" id="tabs">
    <button data-f="all" class="on">전체</button>
    <button data-f="delivery">배달</button>
    <button data-f="pickup">포장</button>
    <button data-f="table">테이블 QR</button>
  </div>
  <div class="sum" id="sum"></div>
  <h2 id="newTitle">새 주문</h2><div class="grid" id="newList"></div>
  <h2 id="workTitle">진행 중</h2><div class="grid" id="workList"></div>
  <details><summary id="doneTitle">완료·취소</summary><div class="grid" id="doneList" style="padding:0"></div></details>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, query, where, orderBy, onSnapshot, doc, updateDoc, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./order-config.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);
const won = n => (n || 0).toLocaleString("ko-KR") + "원";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtPhone = p => p && p.length === 11 ? `${p.slice(0,3)}-${p.slice(3,7)}-${p.slice(7)}` : (p || "");
const TYPE = { delivery: "배달", pickup: "포장", table: "테이블" };
const ST = { new: "새 주문", accepted: "조리 중", ready: "준비 완료", out: "배달 중", done: "완료", canceled: "취소" };

// 로그인
$("loginBtn").onclick = async () => {
  $("loginErr").textContent = "";
  try { await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pw").value); }
  catch { $("loginErr").textContent = "이메일 또는 비밀번호를 확인해 주세요."; }
};
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") $("loginBtn").click(); });
$("logout").onclick = () => signOut(auth);

let unsub = null, orders = [], filter = "all", seen = null;
onAuthStateChanged(auth, user => {
  $("loginView").classList.toggle("hide", !!user);
  $("app").classList.toggle("hide", !user);
  if (unsub) { unsub(); unsub = null; }
  if (user) listen();
});

function listen() {
  // 오늘(한국시간 0시) 이후 주문
  const now = new Date(), kst = new Date(now.getTime() + 9 * 3600e3);
  const start = new Date(Date.UTC(kst.getUTCFullYear(), kst.getUTCMonth(), kst.getUTCDate()) - 9 * 3600e3);
  const q = query(collection(db, "onlineOrders"), where("createdAt", ">=", Timestamp.fromDate(start)), orderBy("createdAt", "desc"));
  seen = null;
  unsub = onSnapshot(q, snap => {
    orders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    const ids = new Set(orders.filter(o => o.status === "new").map(o => o.id));
    if (seen && [...ids].some(id => !seen.has(id))) alarm();
    seen = ids;
    render();
  }, e => { console.error(e); $("newList").innerHTML = `<p class="empty">주문을 불러오지 못했어요. Firestore 규칙을 확인해 주세요.</p>`; });
}

// 알림 소리
let ac = null;
$("soundBtn").onclick = () => {
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); beep(); $("soundBtn").textContent = "🔔 알림 소리 켜짐"; $("soundBtn").classList.add("on"); } catch {}
};
function beep() {
  if (!ac) return;
  [0, 0.35, 0.7].forEach(t => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ac.destination); g.gain.setValueAtTime(0.4, ac.currentTime + t); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + t + 0.3); o.start(ac.currentTime + t); o.stop(ac.currentTime + t + 0.3); });
}
let flash = null;
function alarm() {
  beep(); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch {}
  clearInterval(flash); let i = 0;
  flash = setInterval(() => { document.title = i++ % 2 ? "🔔 새 주문!" : "배달·포장 주문 접수"; if (i > 20) { clearInterval(flash); document.title = "배달·포장 주문 접수"; } }, 700);
}

// 탭
$("tabs").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  filter = b.dataset.f;
  $("tabs").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  render();
};

function payText(o) {
  if (o.type === "table") return "카운터 계산";
  const p = o.payment || {};
  if (p.method === "card") return "💳 카드 (현장결제)";
  let t = "💵 현금 (현장결제)";
  if (p.receipt) t += ` · 현금영수증 ${p.receiptType === "business" ? "사업자" : "개인"} ${esc(p.receiptType === "business" ? p.receiptNo : fmtPhone(p.receiptNo))}`;
  else t += " · 현금영수증 필요 없음";
  return t;
}
function nextAction(o) {
  if (o.status === "new") return ["accepted", "접수하기"];
  if (o.status === "accepted") return ["ready", "조리 완료"];
  if (o.status === "ready") return o.type === "delivery" ? ["out", "배달 출발"] : ["done", o.type === "table" ? "서빙 완료" : "손님 픽업 완료"];
  if (o.status === "out") return ["done", "배달 완료"];
  return null;
}
function card(o) {
  const t = o.createdAt?.toDate ? o.createdAt.toDate() : new Date();
  const time = t.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Seoul" });
  const c = o.customer || {}, act = nextAction(o);
  return `<div class="card ${o.status === "new" ? "new" : ""}">
    <div class="head"><span class="code">${esc(o.code)}</span><span class="tag t-${o.type}">${TYPE[o.type] || ""}${o.type === "table" ? " " + esc(o.table) + "번" : ""}</span><span class="st">${ST[o.status] || ""}</span><span class="time">${time}</span></div>
    <ul class="items">${(o.items || []).map(i => `<li><span>${esc(i.name)}</span><b>× ${i.qty}</b></li>`).join("")}</ul>
    <div class="total">${won(o.total)}</div>
    ${o.type !== "table" ? `
      ${c.name ? `<div class="line"><span>이름</span><b>${esc(c.name)}</b></div>` : ""}
      <div class="line"><span>전화</span><a href="tel:${esc(c.phone)}">${esc(fmtPhone(c.phone))}</a></div>
      ${o.type === "delivery" ? `<div class="line"><span>주소</span><b style="text-align:right">${esc(c.address)}</b></div>` : ""}` : ""}
    <div class="pay">${payText(o)}</div>
    ${o.memo ? `<div class="memo">요청: ${esc(o.memo)}</div>` : ""}
    ${act || o.status === "new" || o.status === "accepted" ? `<div class="acts">
      ${act ? `<button class="go" data-id="${o.id}" data-to="${act[0]}">${act[1]}</button>` : ""}
      ${["new", "accepted"].includes(o.status) ? `<button class="cancel" data-id="${o.id}" data-to="canceled">취소</button>` : ""}
    </div>` : ""}
  </div>`;
}
function render() {
  const list = orders.filter(o => filter === "all" || o.type === filter);
  const groups = { n: list.filter(o => o.status === "new"), w: list.filter(o => ["accepted", "ready", "out"].includes(o.status)), d: list.filter(o => ["done", "canceled"].includes(o.status)) };
  $("newTitle").textContent = `새 주문 (${groups.n.length})`;
  $("workTitle").textContent = `진행 중 (${groups.w.length})`;
  $("doneTitle").textContent = `완료·취소 (${groups.d.length})`;
  $("newList").innerHTML = groups.n.map(card).join("") || `<p class="empty">새 주문이 없어요.</p>`;
  $("workList").innerHTML = groups.w.map(card).join("") || `<p class="empty">진행 중인 주문이 없어요.</p>`;
  $("doneList").innerHTML = groups.d.map(card).join("") || `<p class="empty">아직 없어요.</p>`;
  // 오늘 합계 (취소 제외)
  const live = orders.filter(o => o.status !== "canceled" && o.type !== "table");
  const sumBy = f => live.filter(f).reduce((s, o) => s + (o.total || 0), 0);
  $("sum").innerHTML = `
    <div><small>오늘 배달·포장</small><b>${live.length}건</b></div>
    <div><small>합계</small><b>${won(sumBy(() => true))}</b></div>
    <div><small>카드</small><b>${won(sumBy(o => o.payment?.method === "card"))}</b></div>
    <div><small>현금 (영수증 ${live.filter(o => o.payment?.receipt).length}건)</small><b>${won(sumBy(o => o.payment?.method === "cash"))}</b></div>`;
}
document.addEventListener("click", async e => {
  const b = e.target.closest("button[data-to]"); if (!b) return;
  if (b.dataset.to === "canceled" && !b.dataset.sure) { b.dataset.sure = "1"; b.textContent = "정말 취소?"; setTimeout(() => { delete b.dataset.sure; b.textContent = "취소"; }, 3000); return; }
  b.disabled = true;
  try { await updateDoc(doc(db, "onlineOrders", b.dataset.id), { status: b.dataset.to }); }
  catch (err) { console.error(err); b.disabled = false; b.textContent = "다시 눌러주세요"; }
});
</script>
</body>
</html>
