<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 배달기사용: 한 손으로 쓰는 큰 글씨·큰 버튼, 받을 돈과 주소가 먼저 */
:root{--bg:#f3f5f8;--card:#fff;--ink:#16202a;--soft:#5d6875;--line:#dde3ea;--blue:#1f5fbf;--red:#c3321c;--ok:#2f7d4f;--amber:#b7791f}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Noto Sans KR",system-ui,sans-serif;padding-bottom:40px}
button,input{font:inherit}
button,a{touch-action:manipulation}
.hide{display:none!important}
.top{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
.top img{width:36px;height:36px;border-radius:9px;background:#fff}
.top h1{font:400 22px "Do Hyeon",sans-serif;margin:0;flex:1}
.top button{border:0;border-radius:10px;padding:8px 12px;font-weight:700;background:#fff;color:var(--ink);min-height:40px;font-size:14px}
.top button.on{background:var(--ok);color:#fff}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:12px 14px 0}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.sum small{display:block;color:var(--soft);font-size:12px}
.sum b{font-size:18px;white-space:nowrap}
h2{font:400 22px "Do Hyeon",sans-serif;margin:18px 14px 8px}
.list{display:flex;flex-direction:column;gap:12px;padding:0 14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.go{border-color:var(--blue)}
.card.wait{opacity:.6}
.head{display:flex;align-items:center;gap:8px}
.code{font:400 26px "Do Hyeon",sans-serif}
.st{border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;background:#e8edf3;color:var(--soft)}
.st.out{background:var(--blue);color:#fff}
.time{margin-left:auto;color:var(--soft);font-size:14px}
.addr{font-size:19px;font-weight:700;line-height:1.35}
.who{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--soft);font-size:15px}
.collect{border-radius:14px;padding:12px 14px;font-weight:700;font-size:17px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.collect small{display:block;font-weight:500;font-size:13px}
.collect.cd{background:#eaf1fd;color:var(--blue)}
.collect.cash{background:#fff4dc;color:#7a4e00}
.collect.none{background:#e7f4ec;color:var(--ok)}
.collect.wait{background:#fdecea;color:var(--red)}
.collect b{font-size:22px;white-space:nowrap}
.memo{background:#fff6d6;border-radius:10px;padding:8px 10px;font-size:15px}
.items{font-size:14px;color:var(--soft)}
.fee{font-size:15px;color:var(--soft)}
.fee b{color:var(--ink)}
.btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btns a,.btns button{display:flex;align-items:center;justify-content:center;gap:4px;border:0;border-radius:12px;min-height:50px;font-weight:700;text-decoration:none;background:#eef2f6;color:var(--ink);font-size:15px}
.main{display:block;width:100%;border:0;border-radius:14px;min-height:58px;font-weight:700;font-size:19px;color:#fff;background:var(--blue)}
.main.done{background:var(--ok)}
.main.sure{background:var(--red)}
.empty{padding:6px 14px;color:var(--soft)}
details{margin:0 14px}
summary{font:400 20px "Do Hyeon",sans-serif;padding:14px 0 8px;cursor:pointer}
.dl{display:flex;justify-content:space-between;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:15px}
.dl b{white-space:nowrap}
.login{max-width:380px;margin:50px auto;padding:0 16px;text-align:center}
.login img{width:90px;height:90px;border-radius:20px}
.login h1{font:400 28px "Do Hyeon",sans-serif;margin:12px 0 4px}
.login input{display:block;width:100%;padding:13px;border:1.5px solid var(--line);border-radius:12px;margin-top:10px;font-size:16px}
.login button{width:100%;margin-top:14px;border:0;border-radius:12px;padding:15px;background:var(--blue);color:#fff;font-weight:700;font-size:17px}
.err{color:var(--red);min-height:22px;margin-top:8px}
</style>
</head>

});

// ===== 배달대행비 규칙 (가게 화면 ⚙ 설정과 같은 값) =====
const RDEF = { addr: "광주 서구 쌍촌동 1325", base: 3600, from: 1.5, at: 3800, step: 100, key: "" };
let R = RDEF;
const riderFee = km => km < R.from ? R.base : R.at + Math.floor((km - R.from) * 10 + 1e-6) * R.step;
const feeOf = o => { const r = deliv[o.id]; if (!r || r.km == null || r.addr !== (o.customer?.address || "")) return null; return r.manual && r.fee != null ? r.fee : riderFee(r.km); };

function listen() {
  const kst = new Date(Date.now() + 9 * 3600e3);
  const start = new Date(Date.UTC(kst.getUTCFullYear(), kst.getUTCMonth(), kst.getUTCDate()) - 9 * 3600e3);
  const q = query(collection(db, "onlineOrders"), where("createdAt", ">=", Timestamp.fromDate(start)), orderBy("createdAt", "desc"));
  subs.push(onSnapshot(q, snap => {
    const before = new Set(orders.filter(isReady).map(o => o.id));
    orders = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(o => o.type === "delivery");
    const fresh = orders.filter(isReady).filter(o => !before.has(o.id));
    if (loaded && fresh.length) notify(fresh.length);
    loaded = true;
    render(); queueFees();
  }, e => { console.error(e); $("goList").innerHTML = `<p class="empty">주문을 불러오지 못했어요. 가게에 문의해 주세요.</p>`; }));
  subs.push(onSnapshot(doc(db, "private", "rider"), s => { R = { ...RDEF, ...(s.exists() ? s.data() : {}) }; render(); queueFees(); }, () => {}));
  subs.push(onSnapshot(query(collection(db, "delivery"), where("day", "==", todayStr())), snap => {
    deliv = {}; snap.docs.forEach(d => deliv[d.id] = d.data()); render(); queueFees();
  }, () => {}));
}
let loaded = false;
const isReady = o => ["accepted", "ready"].includes(o.status);

// ===== 거리 계산 (가게 화면이 꺼져 있어도 여기서 계산) =====
let kakaoP = null, kakaoKeyUsed = "";
function loadKakao() {
  if (!R.key || (kakaoP && kakaoKeyUsed === R.key)) return kakaoP;
  kakaoKeyUsed = R.key;
  kakaoP = new Promise((res, rej) => {
    const sc = document.createElement("script");
    sc.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(R.key)}&libraries=services&autoload=false`;
    sc.onload = () => { try { kakao.maps.load(() => res(kakao.maps.services)); } catch (e) { rej(e); } };
    sc.onerror = () => rej(new Error("kakao"));
    document.head.appendChild(sc);
  });
  kakaoP.catch(() => {});
  return kakaoP;
}
async function geocode(addr) {
  const sv = await loadKakao(); if (!sv) return null;
  const g = new sv.Geocoder();
  let a = addr.replace(/번지/g, " ").replace(/[,()]/g, " ").replace(/\s+/g, " ").trim();
  if (!/^(광주|전남|전라|서울|경기)/.test(a)) a = "광주 " + a;
  const toks = a.split(" ");
  for (let n = toks.length; n >= 3; n--) {
    const q = toks.slice(0, n).join(" ");
    const r = await new Promise(res => g.addressSearch(q, (d, st) => res(st === sv.Status.OK ? d[0] : null)));
    if (r) return { lat: +r.y, lng: +r.x, q, approx: n <= 3 };
  }
  const p = new sv.Places();
  const r = await new Promise(res => p.keywordSearch(a, (d, st) => res(st === sv.Status.OK ? d[0] : null)));
  return r ? { lat: +r.y, lng: +r.x, q: a, approx: false } : null;
}
const distKm = (a, b) => { const R0 = 6371, t = x => x * Math.PI / 180, dLa = t(b.lat - a.lat), dLo = t(b.lng - a.lng);
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(t(a.lat)) * Math.cos(t(b.lat)) * Math.sin(dLo / 2) ** 2; return 2 * R0 * Math.asin(Math.sqrt(h)); };
let shopPos = null, shopAddrUsed = "";
const busy = new Set();
async function queueFees() {
  if (!R.key) return;
  for (const o of orders) {
    if (o.status === "canceled") continue;
    const addr = o.customer?.address || "", rec = deliv[o.id];
    if (!addr || busy.has(o.id) || (rec && rec.addr === addr)) continue;
    busy.add(o.id);
    try {
      if (!shopPos || shopAddrUsed !== R.addr) { shopPos = await geocode(R.addr); shopAddrUsed = R.addr; }
      const p = await geocode(addr);
      const data = { day: todayStr(), addr, at: serverTimestamp() };
      if (p && shopPos) Object.assign(data, { km: Math.round(distKm(shopPos, p) * 100) / 100, lat: p.lat, lng: p.lng, approx: p.approx, q: p.q });
      else data.fail = true;
      await setDoc(doc(db, "delivery", o.id), data);
    } catch (e) { console.error(e); }
    finally { busy.delete(o.id); }
  }
}

// ===== 화면 =====
function collect(o) {
  const p = o.payment || {}, amt = won(o.total);
  if (p.method === "card") return `<div class="collect cd"><span>💳 카드로 받기</span><b>${amt}</b></div>`;
  if (p.method === "cash") return `<div class="collect cash"><span>💵 현금으로 받기${p.receipt ? `<small>현금영수증 ${p.receiptType === "business" ? "사업자 " + esc(p.receiptNo) : "개인 " + esc(fmtPhone(p.receiptNo))}</small>` : ""}</span><b>${amt}</b></div>`;
  if (p.method === "transfer") return p.paid ? `<div class="collect none"><span>🏦 계좌이체 입금 완료<small>받을 돈 없어요</small></span><b>0원</b></div>`
    : `<div class="collect wait"><span>🏦 계좌이체 입금 확인 전<small>가게에 확인해 주세요</small></span><b>${amt}</b></div>`;
  return `<div class="collect cash"><span>결제 확인</span><b>${amt}</b></div>`;
}
function card(o) {
  const c = o.customer || {}, rec = deliv[o.id], fee = feeOf(o);
  const t = o.createdAt?.toDate ? o.createdAt.toDate() : new Date();
  const time = t.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Seoul" });
  const map = rec?.lat ? `https://map.kakao.com/link/to/${encodeURIComponent(c.address || "")},${rec.lat},${rec.lng}` : `https://map.kakao.com/link/search/${encodeURIComponent(c.address || "")}`;
  const nmap = `https://map.naver.com/p/search/${encodeURIComponent(c.address || "")}`;
  const wait = o.status === "new";
  const btn = o.status === "out" ? `<button class="main done" data-to="done" data-id="${o.id}">✅ 배달 완료</button>`
    : isReady(o) ? `<button class="main" data-to="out" data-id="${o.id}">🛵 배달 출발</button>` : "";
  return `<div class="card ${o.status === "out" ? "go" : ""} ${wait ? "wait" : ""}">
    <div class="head"><span class="code">${esc(o.code)}</span><span class="st ${o.status}">${{ new: "가게 확인 중", accepted: "출발 대기", ready: "출발 대기", out: "배달 중" }[o.status] || ""}</span><span class="time">${time}</span></div>
    <div class="addr">${esc(c.address)}</div>
    <div class="who"><span>${esc(c.name || "손님")} · ${esc(fmtPhone(c.phone))}</span></div>
    ${collect(o)}
    ${o.memo ? `<div class="memo">요청: ${esc(o.memo)}</div>` : ""}
    <div class="items">${(o.items || []).map(i => `${esc(i.name)} ×${i.qty}`).join(", ")}</div>
    <div class="fee">🛵 대행비 <b>${fee != null ? won(fee) : rec?.fail && rec.addr === (c.address || "") ? "주소 확인 필요 (가게 문의)" : R.key ? "계산 중" : "가게에서 확인"}</b>${rec?.km != null ? ` · 직선 ${rec.km.toFixed(1)}km` : ""}</div>
    <div class="btns">
      <a href="${map}" target="_blank" rel="noopener">🗺 카카오맵</a>
      <a href="${nmap}" target="_blank" rel="noopener">🧭 네이버지도</a>
      <a href="tel:${esc(c.phone)}">📞 전화</a>
    </div>
    ${btn}
  </div>`;
}
function render() {
  const go = orders.filter(o => o.status === "out"), ready = orders.filter(isReady), wait = orders.filter(o => o.status === "new"), done = orders.filter(o => o.status === "done");
  $("goTitle").textContent = `배달 중 (${go.length})`;
  $("readyTitle").textContent = `출발 대기 (${ready.length})`;
  $("waitTitle").textContent = `가게 접수 전 (${wait.length})`;
  $("goList").innerHTML = go.map(card).join("") || `<p class="empty">배달 중인 주문이 없어요.</p>`;
  $("readyList").innerHTML = ready.map(card).join("") || `<p class="empty">출발할 주문이 없어요.</p>`;
  $("waitList").innerHTML = wait.map(card).join("") || `<p class="empty">없어요.</p>`;
  $("waitTitle").classList.toggle("hide", !wait.length); $("waitList").classList.toggle("hide", !wait.length);
  const feeSum = done.reduce((s, o) => s + (feeOf(o) || 0), 0);
  $("doneTitle").textContent = `오늘 완료 (${done.length}건 · 대행비 ${won(feeSum)})`;
  $("doneList").innerHTML = done.map(o => `<div class="dl"><span>${esc(o.code)} · ${esc(o.customer?.address || "")}</span><b>${feeOf(o) != null ? won(feeOf(o)) : "-"}</b></div>`).join("") || `<p class="empty" style="padding:0">아직 없어요.</p>`;
  $("sum").innerHTML = `<div><small>출발 대기</small><b>${ready.length}건</b></div><div><small>오늘 완료</small><b>${done.length}건</b></div><div><small>오늘 대행비</small><b>${won(feeSum)}</b></div>`;
}

// ===== 배달 출발 / 완료 =====
document.addEventListener("click", async e => {
  const b = e.target.closest("button[data-to]"); if (!b) return;
  if (b.dataset.to === "done" && !b.classList.contains("sure")) {
    b.classList.add("sure"); b.textContent = "한 번 더 누르면 완료"; setTimeout(() => { b.classList.remove("sure"); b.textContent = "✅ 배달 완료"; }, 3000); return;
  }
  b.disabled = true;
  try { await updateDoc(doc(db, "onlineOrders", b.dataset.id), { status: b.dataset.to, [b.dataset.to === "out" ? "outAt" : "doneAt"]: serverTimestamp() }); }
  catch (err) { console.error(err); b.disabled = false; b.textContent = "다시 눌러주세요"; }
});

// ===== 알림: 출발할 배달이 생기면 =====
let ac = null, soundOn = false, wake = null;
function ding() { if (!ac) return; [[0, 880], [0.25, 1175]].forEach(([t, f]) => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = f; o.connect(g); g.connect(ac.destination); g.gain.setValueAtTime(0.5, ac.currentTime + t); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + t + 0.5); o.start(ac.currentTime + t); o.stop(ac.currentTime + t + 0.5); }); }
function say(t) { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = "ko-KR"; const v = speechSynthesis.getVoices().find(v => /^ko/i.test(v.lang)); if (v) u.voice = v; speechSynthesis.speak(u); } catch {} }
function notify(n) {
  if (soundOn) { ding(); setTimeout(() => say(n > 1 ? `배달 ${n}건 준비됐어요` : "배달 준비됐어요"), 700); }
  try { navigator.vibrate && navigator.vibrate([300, 120, 300]); } catch {}
}
async function keepAwake() { try { if (soundOn && "wakeLock" in navigator && document.visibilityState === "visible") wake = await navigator.wakeLock.request("screen"); } catch {} }
document.addEventListener("visibilitychange", keepAwake);
$("soundBtn").onclick = () => {
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch {}
  soundOn = true; ding(); setTimeout(() => say("배달 알림을 켰어요"), 700); keepAwake();
  $("soundBtn").textContent = "🔔 알림 켜짐"; $("soundBtn").classList.add("on");
};
try { speechSynthesis.getVoices(); } catch {}
</script>
